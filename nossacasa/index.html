      }
    }
  }

  /* ─── Hoje ─── */
  function viewHoje() {
    const c = calc();
    const mk = c.mk;
    const rec = S.recebidos[mk] || {};
    const hojeDia = new Date().getDate();
    const nq = nomesQuem();

    if (!S.caixa) {
      return `
      <div class="hero amarelo">
        <div class="k">Bem-vindos</div>
        <div class="v" style="font-size:1.85rem;">Quanto tem agora?</div>
        <div class="sub">Só 2 números: no banco e em papel (cédula).</div>
      </div>
      <form class="card mt" data-form="caixa-set">
        <div class="row2">
          <div><label>No banco (R$)</label><input name="valor" inputmode="decimal" placeholder="0,00" required autofocus /></div>
          <div><label>Em cédula (R$)</label><input name="cedula" inputmode="decimal" placeholder="0,00" /></div>
        </div>
        <button class="btn full" type="submit">Começar</button>
        <div class="dica">Pode pôr 0. Salário do dia ${c.prox ? c.prox.d.getDate() : "?"} o app já espera.</div>
      </form>`;
    }

    const sem = semaforo(c.porDia);
    const diaProx = c.prox ? c.prox.d.getDate() : "?";
    const icoPlus = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`;
    const icoMinus = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M5 12h14"/></svg>`;
    const icoCheck = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>`;
    let html = `
      <div class="hero ${sem.cls}">
        <div class="k">Vocês têm</div>
        <div class="v">${fmt(c.caixa)}</div>
        <div class="split">Banco ${fmt(c.banco)} · Cédula ${fmt(c.cedula)}</div>
        <div class="status-row">
          <span class="status-dot" aria-hidden="true"></span>
          <div>
            <div class="msg">${sem.msg}</div>
            <div class="sub">${sem.sub}</div>
          </div>
        </div>
        <div class="metrics">
          <div>Pode ~<b>${fmt(Math.max(0, c.porDia))}/dia</b> até dia ${diaProx}</div>
          <div>Lazer do mês: <b>${fmt(c.lazerRest || 0)}</b></div>
          ${c.obrigAte > 0 ? `<div>Não gasta agora: <b>${fmt(c.obrigAte)}</b> <span style="opacity:0.85">(contas + fatura + meta ${fmt(c.metaNum)})</span></div>` : ""}
        </div>
      </div>

      <div class="acao-grid">
        <button type="button" class="acao-btn ${hojePainel === "entrou" ? "on" : ""}" data-action="hoje-painel" data-painel="entrou">
          <span class="ico">${icoPlus}</span>Entrou
        </button>
        <button type="button" class="acao-btn ${hojePainel === "gastei" ? "on" : ""}" data-action="hoje-painel" data-painel="gastei">
          <span class="ico">${icoMinus}</span>Gastei
        </button>
        <button type="button" class="acao-btn ${hojePainel === "caiu" ? "on" : ""}" data-action="hoje-painel" data-painel="caiu">
          <span class="ico">${icoCheck}</span>Caiu?
        </button>
      </div>`;

    if (hojePainel === "entrou") {
      html += `
      <form class="card mt" data-form="entrada-add">
        <label style="margin-top:0;">Quanto entrou?</label>
        <div class="dica" style="margin-top:0.2rem;">PIX, bônus, presente — não é salário.</div>
        <div class="row2">
          <div><label>Valor (R$)</label><input name="valor" inputmode="decimal" placeholder="0,00" required autofocus /></div>
          <div><label>De onde</label><input name="desc" placeholder="PIX da mãe…" required /></div>
        </div>
        <label>Foi pra onde?</label>
        <select name="fonte">
          <option value="banco">Banco / PIX</option>
          <option value="cedula">Cédula (papel)</option>
        </select>
        <button class="btn full" type="submit">Somar</button>
      </form>`;
    }

    if (hojePainel === "gastei") {
      html += `
      <form class="card mt" data-form="gasto">
        <label style="margin-top:0;">O que gastou?</label>
        <input name="desc" placeholder="Mercado, farmácia…" required autofocus />
        <div class="row2">
          <div><label>Valor (R$)</label><input name="valor" inputmode="decimal" placeholder="35,00" required /></div>
          <div><label>Tipo</label><select name="cat">${CATS_GASTO.map((x) => `<option>${x}</option>`).join("")}</select></div>
        </div>
        <label>Quem?</label>
        <select name="quem">
          <option value="eu">${esc(nq.eu)}</option>
          <option value="ela">${esc(nq.ela)}</option>
          <option value="casa">Juntos</option>
        </select>
        <label>Saiu de onde?</label>
        <select name="fonte">
          <option value="banco">Banco / PIX</option>
          <option value="cedula">Cédula</option>
        </select>
        <button class="btn full" type="submit">Anotar</button>
      </form>`;
    }

    if (hojePainel === "caiu") {
      html += `<div class="sect">Salário caiu?</div><div class="card">`;
      if (!S.config.rendas.length) html += `<div class="vazio">Nenhuma renda. Ajuste em Mais → Ajustes.</div>`;
      S.config.rendas.forEach((r) => {
        const total = num(r.valor) * (num(r.pessoas) || 1);
        const got = rec[r.id];
        html += `
        <div class="item">
          <div class="grow">
            <div class="t">${esc(r.nome)} <span class="pill neu">dia ${r.dia}</span></div>
            <div class="s">${fmt(total)}</div>
          </div>
          ${got
            ? `<button class="statusbtn tem" data-action="renda-toggle" data-id="${r.id}">Caiu ✓</button>`
            : `<button class="statusbtn ${r.dia <= hojeDia ? "acabou" : ""}" data-action="renda-toggle" data-id="${r.id}">Marcar Caiu</button>`}
        </div>`;
      });
      html += `<div class="dica">Toque Caiu só quando o dinheiro aparecer no banco.</div></div>`;
    }

    html += lembretesSmartCard(c);

    if (!showMaisHoje) {
      html += `<button type="button" class="softlink" data-action="toggle-mais-hoje">Ver mais do dia →</button>`;
      return html;
    }

    html += `<button type="button" class="softlink" data-action="toggle-mais-hoje">Esconder extras ↑</button>`;
    html += renderChatConversa();
    html += `
      <form class="card mt" data-form="simular">
        <label style="margin-top:0;">E se gastar quanto?</label>
        <div style="display:flex; gap:0.6rem; align-items:flex-end;">
          <div style="flex:1;"><input name="valor" inputmode="decimal" placeholder="40,00" required /></div>
          <button class="btn small" type="submit" style="min-height:3rem;">Simular</button>
        </div>
      </form>`;
    html += renderBaloes(dicas(c));

    const ck = checklistEstado();
    if (ck) {
      const espera = ck.modo === "espera" && !ck.caiu;
      html += `
      <div class="sect">Passo a passo</div>
      <div class="card">
        ${espera ? `<div class="dica" style="margin-top:0;">Próximo salário dia <b>${ck.alvo.dia}</b>. Até lá, sem conta grande.</div>` : ""}
        <div class="chkstep">
          <div class="chknum ${ck.caiu ? "done" : "wait"}">1</div>
          <div class="grow">
            <div class="t">${esc(ck.alvo.nome)} — ${fmt(ck.total)}</div>
            <div class="s">${ck.caiu ? "Já caiu ✓" : "Quando cair, marca Caiu"}</div>
          </div>
          ${ck.caiu ? `<span class="statusbtn tem">OK</span>` : `<button class="btn small" data-action="checklist-salario">Caiu</button>`}
        </div>
        <div class="chkstep">
          <div class="chknum ${!ck.faltam.length ? "done" : (ck.caiu ? "wait" : "")}">2</div>
          <div class="grow">
            <div class="t">Pagar contas</div>
            <div class="s">${ck.faltam.length ? ck.faltam.length + " falta · " + fmt(ck.totalContas) : "Tudo pago"}</div>
          </div>
          ${ck.faltam.length && ck.caiu
            ? `<button class="btn small" data-action="checklist-pagar-quinzena">Pagar</button>`
            : `<span class="statusbtn">${ck.faltam.length ? "Depois" : "OK"}</span>`}
        </div>
      </div>`;
    }

    const entradasMesLista = (S.entradas || [])
      .filter((e) => {
        const ini = new Date(); ini.setDate(1); ini.setHours(0, 0, 0, 0);
        return num(e.ts) >= ini.getTime();
      })
      .slice()
      .sort((a, b) => num(b.ts) - num(a.ts));
    if (entradasMesLista.length) {
      html += `<div class="sect">Entradas</div><div class="card">`;
      entradasMesLista.forEach((e) => {
        const dest = e.fonte === "cedula" ? "cédula" : "banco";
        html += `<div class="chkstep">
          <div class="grow"><div class="t">${esc(e.desc || "Entrada")}</div><div class="s">${fmt(e.valor)} · ${dest}</div></div>
          <button class="btn small ghost" data-action="entrada-del" data-id="${esc(e.id)}">Apagar</button>
        </div>`;
      });
      html += `</div>`;
    }

    html += `
      <div class="card mt">
        <button type="button" class="btn ghost full" style="margin-top:0;" data-action="toggle-corrigir">${showCorrigirSaldos ? "Esconder correção" : "Banco/cédula errado? Corrigir"}</button>
        ${showCorrigirSaldos ? `
        <form data-form="caixa-set" class="mt">
          <div class="dica" style="margin-top:0;">Só se o banco ou a carteira mostrar outro valor.</div>
          <div class="row2">
            <div><label>Banco</label><input name="valor" inputmode="decimal" placeholder="${String(num(S.caixa.valor)).replace(".", ",")}" required /></div>
            <div><label>Cédula</label><input name="cedula" inputmode="decimal" value="${String(num((S.cedula || {}).valor)).replace(".", ",")}" /></div>
          </div>
          <button class="btn full" type="submit">Corrigir</button>
        </form>` : ""}
      </div>`;

    const ini = new Date(); ini.setDate(1); ini.setHours(0, 0, 0, 0);
    const recentesAll = S.gastos.filter((g) => g.ts >= ini.getTime()).slice().sort((a, b) => b.ts - a.ts);
    const recentes = recentesAll.filter((g) => passaFiltroQuem(g.quem)).slice(0, 12);
    let totEu = 0, totEla = 0;
    recentesAll.forEach((g) => {
      if (g.quem === "eu") totEu += num(g.valor);
      if (g.quem === "ela") totEla += num(g.valor);
    });
    html += `<div class="sect">Gastos do mês</div><div class="card">
      ${htmlFiltroQuem()}
      <div class="dica" style="margin-top:0;">${esc(nq.eu)} ${fmt(totEu)} · ${esc(nq.ela)} ${fmt(totEla)}</div>`;
    if (!recentes.length) html += `<div class="vazio">Nenhum gasto ainda.</div>`;
    recentes.forEach((g) => {
      const quemLbl = g.quem === "ela" ? nq.ela : g.quem === "eu" ? nq.eu : (g.quem === "casa" ? "Juntos" : "");
      const fonteLbl = g.fonte === "cedula" ? "cédula" : "banco";
      html += `
        <div class="item">
          <div class="grow"><div class="t">${esc(g.desc)}</div><div class="s">${esc(g.cat)}${quemLbl ? " · " + esc(quemLbl) : ""} · ${fonteLbl} · ${dataBR(g.ts)}</div></div>
          <div class="val">${fmt(g.valor)}</div>
          <button class="statusbtn" data-action="gasto-del" data-id="${g.id}">✕</button>
        </div>`;
    });
    html += `</div>`;
    return html;
  }

  function viewCasa() {
    return `
      <div class="subtabs">
        <button type="button" class="${casaSub === "despensa" ? "on" : ""}" data-action="casa-sub" data-sub="despensa">Despensa</button>
        <button type="button" class="${casaSub === "gatos" ? "on" : ""}" data-action="casa-sub" data-sub="gatos">Gatos</button>
      </div>
      ${casaSub === "gatos" ? viewGatos() : viewDespensa()}`;
  }

  function viewMais() {
    return `
      <div class="subtabs">
        <button type="button" class="${maisSub === "mes" ? "on" : ""}" data-action="mais-sub" data-sub="mes">Mês</button>
        <button type="button" class="${maisSub === "ajustes" ? "on" : ""}" data-action="mais-sub" data-sub="ajustes">Ajustes</button>
      </div>
      ${maisSub === "ajustes" ? viewAjustes() : viewMes()}`;
  }

  function maybeShowOnboard() {
    const old = document.getElementById("onboard");
    if (old) old.remove();
    if (!logado || !S.caixa || S.config.onboardDone) return;
    const steps = [
      { t: "Só 3 botões no Hoje", p: "Entrou = dinheiro novo. Gastei = anotou saída. Caiu? = salário chegou no banco." },
      { t: "Contas e Cartão embaixo", p: "Pague contas na aba Contas. Compras no cartão ficam em Cartão. Casa = despensa + gatos." },
      { t: "Meta alimenta emergência", p: "Meta do mês = quanto juntar agora. Quando juntar, some no Fundo de emergência (aba Mais → Mês)." },
    ];
    const s = steps[Math.min(onboardStep, steps.length - 1)];
    const last = onboardStep >= steps.length - 1;
    const wrap = document.createElement("div");
    wrap.id = "onboard";
    wrap.className = "onboard";
    wrap.innerHTML = `<div class="sheet">
      <div class="pill ok" style="margin-bottom:0.6rem;">Dica ${onboardStep + 1}/${steps.length}</div>
      <h2>${s.t}</h2>
      <p>${s.p}</p>
      <button class="btn full" type="button" data-action="onboard-next">${last ? "Entendi, bora" : "Próximo"}</button>
      <button class="softlink" type="button" data-action="onboard-skip">Pular</button>
    </div>`;
    document.body.appendChild(wrap);
  }

  /* ─── Mês (histórico) ─── */
  function viewMes() {
    const r = resumoMesDados();
    const c = r.c;
    const mk = c.mk;
    const maxBar = Math.max(c.entrouMes, r.saiu, 1);
    const meta = c.metaNum;
    const metaPct = barraPct(r.juntadoEst, meta || 1);
    const pag = S.pagamentos[mk] || {};
    const rec = S.recebidos[mk] || {};
    const ini = new Date(); ini.setDate(1); ini.setHours(0, 0, 0, 0);
    const gastosMes = S.gastos.filter((g) => g.ts >= ini.getTime()).slice().sort((a, b) => b.ts - a.ts);

    let detalhePago = "";
    const nqMes = nomesQuem();
    for (const id in pag) {
      const ct = S.contas.find((x) => x.id === id);
      const nome = ct ? ct.nome : "Conta antiga (apagada)";
      const quemP = pag[id].quem === "ela" ? nqMes.ela : pag[id].quem === "eu" ? nqMes.eu : "";
      if (!passaFiltroQuem(pag[id].quem || "casa")) continue;
      detalhePago += `<div class="item"><div class="grow"><div class="t">${esc(nome)}</div><div class="s">pago ${dataBR(pag[id].ts)}${quemP ? " · " + esc(quemP) : ""}</div></div><div class="val">${fmt(pag[id].valor)}</div></div>`;
    }
    let detalheEntrou = "";
    for (const id in rec) {
      const rd = S.config.rendas.find((x) => x.id === id);
      const nome = rd ? rd.nome : "Renda";
      detalheEntrou += `<div class="item"><div class="grow"><div class="t">${esc(nome)}</div><div class="s">caiu ${dataBR(rec[id].ts)}</div></div><div class="val">${fmt(rec[id].valor)}</div></div>`;
    }
    let detalheGastos = "";
    gastosMes.filter((g) => passaFiltroQuem(g.quem)).forEach((g) => {
      const quemLbl = g.quem === "ela" ? nqMes.ela : g.quem === "eu" ? nqMes.eu : (g.quem === "casa" ? "Casa" : "");
      detalheGastos += `<div class="item"><div class="grow"><div class="t">${esc(g.desc)}</div><div class="s">${esc(g.cat)}${quemLbl ? " · " + esc(quemLbl) : ""} · ${dataBR(g.ts)}</div></div><div class="val">${fmt(g.valor)}</div></div>`;
    });

    let html = `
      <div class="hero ${r.saldo >= 0 ? "verde" : "vermelho"}">
        <div class="k">Este mês · ${esc(mesNome())}</div>
        <div class="v">${fmt(r.saldo)}</div>
        <div class="sub">Entrou ${fmt(c.entrouMes)} · saiu ${fmt(r.saiu)} (contas + dinheiro + fatura paga)</div>
      </div>

      <div class="sect">Ver por pessoa</div>
      <div class="card">${htmlFiltroQuem()}<div class="dica" style="margin-top:0;">Filtra gastos e contas pagas abaixo.</div></div>

      <div class="sect">Fluxo</div>
      <div class="card">
        <div class="bar-legend"><span>Entrou</span><span>${fmt(c.entrouMes)} / previsto ${fmt(c.previstoMes)}</span></div>
        <div class="hbar"><i style="width:${barraPct(c.entrouMes, c.previstoMes || maxBar)}%"></i></div>
        <div class="bar-legend"><span>Saiu</span><span>${fmt(r.saiu)}</span></div>
        <div class="hbar alt"><i style="width:${barraPct(r.saiu, maxBar)}%"></i></div>
        <div class="bar-legend"><span>Contas pagas</span><span>${fmt(c.contasPagas)}</span></div>
        <div class="hbar"><i style="width:${barraPct(c.contasPagas, maxBar)}%"></i></div>
        <div class="bar-legend"><span>Gastos no dinheiro</span><span>${fmt(c.gastosMes)}</span></div>
        <div class="hbar"><i style="width:${barraPct(c.gastosMes, maxBar)}%"></i></div>
        <div class="bar-legend"><span>Fatura paga</span><span>${fmt(c.faturaPaga)}</span></div>
        <div class="hbar"><i style="width:${barraPct(c.faturaPaga, maxBar)}%"></i></div>
        <div class="bar-legend"><span>Cartão aberto (ciclo)</span><span>${fmt(c.comprasCiclo)}</span></div>
        <div class="hbar bad"><i style="width:${barraPct(c.comprasCiclo, maxBar)}%"></i></div>
      </div>

      <div class="sect">De onde veio o número</div>
      <div class="card">
        <div class="t" style="margin-bottom:0.4rem;">Entrou</div>
        ${detalheEntrou || `<div class="vazio">Nenhum salário marcado.</div>`}
        <div class="t" style="margin:0.8rem 0 0.4rem;">Contas pagas</div>
        ${detalhePago || `<div class="vazio">Nenhuma conta paga.</div>`}
        <div class="t" style="margin:0.8rem 0 0.4rem;">Gastos no dinheiro</div>
        ${detalheGastos || `<div class="vazio">Nenhum gasto.</div>`}
        ${c.faturaPaga ? `<div class="t" style="margin:0.8rem 0 0.4rem;">Fatura</div><div class="item"><div class="grow"><div class="t">Fatura paga</div></div><div class="val">${fmt(c.faturaPaga)}</div></div>` : ""}
      </div>

      <div class="sect">Onde o dinheiro foi</div>
      <div class="card">
        <div class="bar-legend"><span>iFood</span><span>${fmt(r.ifood)}</span></div>
        <div class="hbar alt"><i style="width:${barraPct(r.ifood, Math.max(c.gastosMes, 1))}%"></i></div>
        <div class="bar-legend"><span>Mercado</span><span>${fmt(r.mercado)}</span></div>
        <div class="hbar"><i style="width:${barraPct(r.mercado, Math.max(c.gastosMes, 1))}%"></i></div>
        <div class="bar-legend"><span>Lazer</span><span>${fmt(r.lazer)}</span></div>
        <div class="hbar"><i style="width:${barraPct(r.lazer, Math.max(c.gastosMes, 1))}%"></i></div>
        <div class="bar-legend"><span>Imprevisto</span><span>${fmt(r.imprevisto)}</span></div>
        <div class="hbar bad"><i style="width:${barraPct(r.imprevisto, Math.max(c.gastosMes, 1))}%"></i></div>
        ${Object.keys(r.porCat).filter((k) => !["iFood", "Mercado", "Lazer", "Imprevisto"].includes(k)).map((k) => `
          <div class="bar-legend"><span>${esc(k)}</span><span>${fmt(r.porCat[k])}</span></div>
          <div class="hbar"><i style="width:${barraPct(r.porCat[k], Math.max(c.gastosMes, 1))}%"></i></div>
        `).join("")}
        ${!c.gastosMes ? `<div class="vazio">Nenhum gasto no dinheiro este mês.</div>` : ""}
      </div>

      <div class="sect">Meta de juntar</div>
      <div class="card">
        <div class="bar"><div class="fill lim" style="width:${meta > 0 ? metaPct : 0}%"></div></div>
        <div class="bar-legend"><span>Estimativa sobra do mês</span><span>${fmt(r.juntadoEst)} / meta ${fmt(meta)}</span></div>
        <div class="dica">Meta do mês = quanto juntar <b>este mês</b>. Emergência = pote grande. Ordem: 1) contas+fatura 2) meta do mês → soma na emergência 3) lazer.</div>
      </div>

      <div class="sect">Fundo de emergência</div>
      <div class="card">
        <div class="bar"><div class="fill lim" style="width:${barraPct(emergenciaGuardado(), emergenciaMeta())}%"></div></div>
        <div class="bar-legend"><span>Guardado</span><span>${fmt(emergenciaGuardado())} / ${fmt(emergenciaMeta())}</span></div>
        <form class="buyrow mt" data-form="emergencia-add" style="grid-template-columns: 1fr auto;">
          <input name="valor" inputmode="decimal" placeholder="Guardei quanto (R$)" required />
          <button class="btn small" type="submit">Somar</button>
        </form>
        <div class="dica">Quando cumprir a meta do mês, toca Somar aqui. Meta não compete com emergência — a meta <b>alimenta</b> o fundo.</div>
      </div>

      <div class="sect">Previsto × real (contas)</div>
      <div class="card">`;
    const previstoContas = S.contas.reduce((a, x) => a + num(x.valor), 0);
    S.contas.slice().sort((a, b) => a.dia - b.dia).forEach((x) => {
      const p = pag[x.id];
      const delta = p ? num(p.valor) - num(x.valor) : null;
      html += `
        <div class="item">
          <div class="grow">
            <div class="t">${esc(x.nome)} <span class="pill neu">dia ${x.dia}</span></div>
            <div class="s">previsto ${fmt(x.valor)}${p ? ` · pago ${fmt(p.valor)}${delta ? ` (${delta > 0 ? "+" : ""}${fmt(delta)})` : ""}` : " · ainda não"}</div>
          </div>
          <div class="val">${p ? fmt(p.valor) : "—"}</div>
        </div>`;
    });
    html += `
        <div class="bar-legend" style="margin-top:0.5rem;"><span>Previsto total</span><span>${fmt(previstoContas)}</span></div>
        <div class="bar-legend"><span>Pago total</span><span>${fmt(c.contasPagas)}</span></div>
      </div>`;

    const fechado = S.mesesFechados && S.mesesFechados[mk];
    html += `
      <div class="sect">Fechar mês</div>
      <div class="card">
        ${fechado ? `
          <div class="alerta ok" style="margin-bottom:0.7rem;"><span>Mês fechado em ${dataBR(fechado.ts)}. Foto do fechamento salva.</span></div>
          <div class="bar-legend"><span>Renda</span><span>${fmt(fechado.entrou)} / prev ${fmt(fechado.previstoRenda)}</span></div>
          <div class="bar-legend"><span>Contas</span><span>${fmt(fechado.contasPagas)} / prev ${fmt(fechado.previstoContas)}</span></div>
          <div class="bar-legend"><span>Gastos + fatura</span><span>${fmt((fechado.gastos || 0) + (fechado.fatura || 0))}</span></div>
          <div class="bar-legend"><span>Sobra est.</span><span>${fmt(fechado.juntadoEst)} (meta ${fmt(fechado.meta)})</span></div>
          <button class="btn ghost full" data-action="mes-reabrir">Reabrir mês</button>
        ` : `
          <div class="s" style="margin-bottom:0.7rem;">Trava um resumo deste mês (previsto × real). Continua podendo anotar depois; o fechamento é a foto.</div>
          <button class="btn full" data-action="mes-fechar">Fechar ${esc(mesNome())}</button>
        `}
      </div>`;

    const histKeys = mesesFechadosLista();
    if (histKeys.length) {
      if (!histCmpA || !S.mesesFechados[histCmpA]) histCmpA = histKeys[0] || "";
      if (!histCmpB || !S.mesesFechados[histCmpB]) histCmpB = histKeys[1] || histKeys[0] || "";
      html += `
      <div class="sect">Histórico fechados <span class="mini">${histKeys.length}</span></div>
      <div class="card">`;
      histKeys.slice(0, 8).forEach((k) => {
        const s = S.mesesFechados[k];
        html += `<div class="item">
          <div class="grow">
            <div class="t">${esc(mesNomeDe(k))}${k === mk ? ' <span class="pill ok">atual</span>' : ""}</div>
            <div class="s">entrou ${fmt(s.entrou)} · saiu ${fmt(s.saiu)} · sobra ${fmt(s.juntadoEst)}</div>
          </div>
          <div class="val">${fmt(s.juntadoEst)}</div>
        </div>`;
      });
      html += `
        <div class="sect" style="margin:0.8rem 0 0.4rem;">Comparar dois meses</div>
        <form data-form="hist-cmp">
          <div class="row2">
            <div><label>Mês A</label><select name="a">${histKeys.map((k) => `<option value="${k}" ${k === histCmpA ? "selected" : ""}>${esc(mesNomeDe(k))}</option>`).join("")}</select></div>
            <div><label>Mês B</label><select name="b">${histKeys.map((k) => `<option value="${k}" ${k === histCmpB ? "selected" : ""}>${esc(mesNomeDe(k))}</option>`).join("")}</select></div>
          </div>
          <button class="btn full" type="submit">Atualizar comparação</button>
        </form>`;
      const a = S.mesesFechados[histCmpA];
      const b = S.mesesFechados[histCmpB];
      if (a && b) {
        const row = (label, va, vb) => {
          const max = Math.max(num(va), num(vb), 1);
          return `<div class="bar-legend"><span>${esc(label)}</span><span>${fmt(va)} vs ${fmt(vb)}</span></div>
            <div class="hbar"><i style="width:${barraPct(va, max)}%"></i></div>
            <div class="hbar alt"><i style="width:${barraPct(vb, max)}%"></i></div>`;
        };
        html += `<div class="dica">${esc(mesNomeDe(histCmpA))} (barra) vs ${esc(mesNomeDe(histCmpB))} (barra clara)</div>
          ${row("Entrou", a.entrou, b.entrou)}
          ${row("Saiu", a.saiu, b.saiu)}
          ${row("Gastos", a.gastos, b.gastos)}
          ${row("iFood", a.ifood, b.ifood)}
          ${row("Sobra", a.juntadoEst, b.juntadoEst)}`;
      }
      html += `</div>`;
    }

    html += `
      <div class="sect">Limpar / exportar</div>
      <div class="card">
        <div class="s" style="margin-bottom:0.7rem;">Apaga só os lançamentos de <b>${esc(mesNome())}</b>: salários marcados, contas pagas, gastos no dinheiro e fatura paga do mês. Contas cadastradas, despensa, gatos e saldo do banco <b>ficam</b>.</div>
        <button class="btn ghost full" data-action="exportar-mes">Baixar resumo do mês (.txt)</button>
        <button class="btn danger full" data-action="limpar-mes">Limpar lançamentos deste mês</button>
      </div>`;
    return html;
  }

  /* ─── Contas ─── */
  function viewContas() {
    const c = calc();
    const mk = c.mk;
    const pag = S.pagamentos[mk] || {};
    const totalMes = S.contas.reduce((a, x) => a + num(x.valor), 0);
    const pagoMes = S.contas.filter((x) => pag[x.id]).reduce((a, x) => a + num(pag[x.id].valor), 0);
    const pct = totalMes ? Math.min(100, (pagoMes / totalMes) * 100) : 0;

    let html = `
      <div class="sect">Contas da casa <span class="mini">${esc(mesNome())}</span></div>
      <div class="card resumo-card">
        <div class="resumo-label">Contas do mês</div>
        <div class="resumo-valor">${fmt(totalMes)}</div>
        <div class="resumo-meta">Total previsto · <b>${fmt(pagoMes)}</b> pago</div>
        <div class="bar"><div class="fill lim" style="width:${pct}%"></div></div>
        <div class="bar-legend"><span>${Math.round(pct)}% quitado</span><span>${fmt(Math.max(0, totalMes - pagoMes))} falta</span></div>
      </div>
      <div class="card">`;

    if (!S.contas.length) {
      html += `<div class="vazio">Nenhuma conta cadastrada.<br>Adicione a primeira conta fixa pra começar.</div>`;
    }
    const nqC = nomesQuem();
    S.contas.slice().sort((a, b) => a.dia - b.dia).forEach((x) => {
      const p = pag[x.id];
      const quemLbl = p && p.quem === "ela" ? nqC.ela : p && p.quem === "eu" ? nqC.eu : "";
      const openMenu = menuContaId === x.id;
      html += `
        <div class="conta-row">
          <div class="grow">
            <div class="t">${esc(x.nome)}</div>
            <div class="s">${p ? "Pago " + dataBR(p.ts) + (quemLbl ? " · " + esc(quemLbl) : "") : "Vence dia " + x.dia}</div>
            <div class="val">${fmt(p ? p.valor : x.valor)}</div>
          </div>
          <div class="conta-actions">
            ${p
              ? `<button class="statusbtn tem" data-action="conta-desfazer" data-id="${x.id}">Pago ✓</button>`
              : `<button class="btn small" data-action="conta-pagar" data-id="${x.id}">Pagar</button>`}
            <button type="button" class="icon-more" data-action="conta-menu" data-id="${x.id}" aria-label="Mais opções">⋮</button>
          </div>
        </div>`;
      if (openMenu) {
        html += `<div class="menu-sheet" style="padding-bottom:8px;">
          <button class="btn ghost full" style="margin-top:0;" data-action="conta-edit" data-id="${x.id}">Editar valor previsto</button>
          <button class="btn danger full" style="margin-top:0;" data-action="conta-del" data-id="${x.id}">Excluir conta</button>
          <button class="btn ghost full" style="margin-top:0;" data-action="conta-menu-close">Fechar</button>
        </div>`;
      }
      if (!p && pagandoId === x.id) {
        html += `
        <form class="card" data-form="conta-paga" data-id="${x.id}" style="margin:0 0 12px; box-shadow:none; border-style:dashed;">
          <label style="margin-top:0;">Valor real deste mês</label>
          <input name="valor" inputmode="decimal" value="${String(num(x.valor)).replace(".", ",")}" required />
          <label>Quem pagou?</label>
          <select name="quem">
            <option value="eu">${esc(nqC.eu)}</option>
            <option value="ela">${esc(nqC.ela)}</option>
            <option value="casa">Juntos</option>
          </select>
          <button class="btn full" type="submit">Confirmar pagamento</button>
        </form>`;
      }
    });
    html += `</div>`;

    if (!showNovaConta) {
      html += `<button type="button" class="add-trigger" data-action="toggle-nova-conta">+ Nova conta fixa</button>`;
    } else {
      html += `
      <form class="card mt" data-form="conta-add">
        <label style="margin-top:0;">Nome da conta</label>
        <input name="nome" placeholder="Água, gás…" required autofocus />
        <div class="row2">
          <div><label>Valor (R$)</label><input name="valor" inputmode="decimal" placeholder="100,00" required /></div>
          <div><label>Dia do vencimento</label><input name="dia" type="number" min="1" max="31" value="7" required /></div>
        </div>
        <button class="btn full" type="submit">Salvar conta</button>
        <button type="button" class="softlink" data-action="toggle-nova-conta">Cancelar</button>
      </form>`;
    }
    return html;
  }

  /* ─── Cartão ─── */
  function viewCartao() {
    const c = calc();
    const mk = c.mk;
    const limite = num(S.config.limiteCartao);
    const reserva = num(S.config.reservaCartao);
    const teto = limite + reserva;
    const total = c.comprasCiclo;
    const fatura = S.cartao.faturas[mk];

    const pctLim = Math.min(total, limite) / teto * 100;
    const pctRes = Math.max(0, Math.min(total - limite, reserva)) / teto * 100;
    const pctOver = Math.max(0, total - teto) / teto * 100;

    let html = `
      <div class="sect">Fatura atual <span class="mini">vence dia ${S.config.diaVencFatura || 19}</span></div>
      <div class="card fatura-hero">
        <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:12px;">
          <div>
            <div class="fh-val">${fmt(total)}</div>
            <div class="fh-meta">${fatura ? "Fatura paga neste mês" : "Ciclo aberto · ainda não paga"}</div>
          </div>
          ${fatura ? `<span class="pill ok">Paga</span>` : total > teto ? `<span class="pill bad">Estourou</span>` : total > limite ? `<span class="pill warn">Reserva</span>` : `<span class="pill neu">Aberta</span>`}
        </div>
        <div class="bar">
          <div class="fill lim" style="width:${pctLim}%"></div>
          <div class="fill res" style="width:${pctRes}%"></div>
          <div class="fill over" style="width:${Math.min(pctOver, 100 - pctLim - pctRes)}%"></div>
        </div>
        <div class="bar-legend"><span>${fmt(total)} usado</span><span>${fmt(teto)} teto</span></div>
        <div class="fatura-stats">
          <div><div class="k">Limite</div><div class="v">${fmt(limite)}</div></div>
          <div><div class="k">Reserva</div><div class="v">${fmt(reserva)}</div></div>
          <div><div class="k">Utilizado</div><div class="v">${fmt(total)}</div></div>
        </div>
        ${!fatura ? `
        <form data-form="fatura-paga-valor" class="mt">
          <label>Valor da fatura (R$)</label>
          <input name="valor" inputmode="decimal" value="${total > 0 ? String(total).replace(".", ",") : String(num(S.config.faturaEstimada)).replace(".", ",")}" placeholder="0,00" required />
          <button class="btn full" type="submit">Pagar fatura e zerar ciclo</button>
          <div class="dica">Confirma o valor e zera as compras deste ciclo. Parcelas futuras entram depois.</div>
        </form>` : `<div class="dica">Fatura de ${esc(mesNome())} paga (${fmt(fatura.valor)}). Compras novas entram na próxima.</div>`}
      </div>

      <div class="sect">Comprei no cartão</div>
      <form class="card" data-form="compra">
        <label style="margin-top:0;">Descrição</label>
        <input name="desc" placeholder="Mercado, remédio…" required />
        <div class="row2">
          <div>
            <label>Valor total (R$)</label>
            <input name="valor" inputmode="decimal" placeholder="300,00" required />
          </div>
          <div>
            <label>Parcelas</label>
            <input name="parcelas" type="number" min="1" max="24" value="1" />
          </div>
        </div>
        <button class="btn full" type="submit">Lançar no cartão</button>
        <div class="dica">Ex.: R$ 300 em 3× → R$ 100 nesta fatura; o resto cai depois.</div>
      </form>

      <div class="sect">Compras do ciclo</div>
      <div class="card">`;

    const lista = S.cartao.compras.slice().sort((a, b) => b.ts - a.ts);
    if (!lista.length) html += `<div class="vazio">Nenhuma compra neste ciclo.<br>Cartão zerado — ótimo.</div>`;
    lista.forEach((x) => {
      html += `
        <div class="item">
          <div class="grow"><div class="t">${esc(x.desc)}</div><div class="s">${dataBR(x.ts)}</div></div>
          <div class="val">${fmt(x.valor)}</div>
          <button class="icon-more" data-action="compra-del" data-id="${x.id}" aria-label="Remover compra" title="Remover">×</button>
        </div>`;
    });
    html += `</div>`;

    const fut = (S.cartao.parcelas || []).slice();
    if (fut.length) {
      html += `<div class="sect">Parcelas futuras</div><div class="card">`;
      fut.forEach((p) => {
        html += `
          <div class="item">
            <div class="grow">
              <div class="t">${esc(p.desc)}</div>
              <div class="s">${p.restantes}× de ${fmt(p.valorParcela)} (total ${p.total}× · ${fmt(p.valorTotal)})</div>
            </div>
            <div class="val">${fmt(num(p.valorParcela) * num(p.restantes))}</div>
          </div>`;
      });
      html += `<div class="dica">Entram sozinhas no ciclo depois que vocês pagam a fatura.</div></div>`;
    }

    const pags = Object.keys(S.cartao.faturas).sort().reverse().slice(0, 4);
    if (pags.length) {
      html += `<div class="sect">Faturas pagas</div><div class="card">`;
      pags.forEach((k) => {
        const f = S.cartao.faturas[k];
        const [y, m] = k.split("-");
        const nome = new Date(y, m - 1, 1).toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
        html += `<div class="item"><div class="grow"><div class="t">${esc(nome)}</div></div><div class="val">${fmt(f.valor)}</div></div>`;
      });
      html += `</div>`;
    }
    return html;
  }

  /* ─── Despensa ─── */
  function viewDespensa() {
    let html = `
      <div class="sect">Lista de compras <span class="mini">usar o cartão dos R$ 1.200</span></div>
      <div class="card">`;
    if (!S.lista.length) html += `<div class="vazio">Lista vazia. Ao marcar algo como "acabando" ou "acabou", ele aparece aqui.</div>`;
    S.lista.forEach((it) => {
      const dep = S.despensa.find((d) => d.nome.toLowerCase() === it.nome.toLowerCase());
      const dm = dep ? duracaoMedia(dep) : null;
      const dica = dm ? `dura ~${Math.round(dm)}d/un · leva ${Math.max(1, Math.ceil(30 / dm))}` : "";
      html += `
        <form class="buyrow" data-form="lista-comprar" data-id="${it.id}">
          <div class="nome">${esc(it.nome)}<span class="s">${esc([it.cat, dica].filter(Boolean).join(" · "))}</span></div>
          <input name="qtd" type="number" min="1" step="1" value="1" title="Quantidade" required />
          <input name="valor" inputmode="decimal" placeholder="R$ total" title="Quanto custou" required />
          <button class="btn small" type="submit" data-pago="cartao">Cartão</button>
          <button class="btn small ghost" type="submit" data-pago="dinheiro">Dinheiro</button>
        </form>`;
    });
    html += `
        <form class="buyrow" data-form="lista-add" style="border-top:1px dashed var(--line); margin-top:0.3rem;">
          <div class="nome"><input name="nome" placeholder="Adicionar à lista…" required style="border:none; padding:0; font-weight:800;" /></div>
          <span></span>
          <span></span>
          <button class="btn small" type="submit">Add</button>
          <span></span>
        </form>
      </div>

      <div class="sect">Tem em casa <span class="mini">toque no status p/ mudar</span></div>
      <div class="card">`;
    if (!S.despensa.length) html += `<div class="vazio">Despensa vazia. Cadastre o que vocês costumam ter em casa.</div>`;
    const ord = { acabou: 0, pouco: 1, tem: 2 };
    S.despensa.slice().sort((a, b) => ord[a.status] - ord[b.status] || a.nome.localeCompare(b.nome)).forEach((d) => {
      const lbl = d.status === "tem" ? "Tem" : d.status === "pouco" ? "Acabando" : "Acabou";
      const dm = duracaoMedia(d);
      const diaA = diaAcabaItem(d);
      const sub = [d.cat, dm ? `dura ~${Math.round(dm)}d/un` : "", diaA ? `acaba ~dia ${diaA}` : ""].filter(Boolean).join(" · ");
      html += `
        <div class="item">
          <div class="grow"><div class="t">${esc(d.nome)}</div><div class="s">${esc(sub)}</div></div>
          <button class="statusbtn ${d.status}" data-action="des-status" data-id="${d.id}">${lbl}</button>
          <button class="statusbtn" data-action="des-dia" data-id="${d.id}" title="Dia que costuma acabar">dia</button>
          <button class="statusbtn" data-action="des-del" data-id="${d.id}">✕</button>
        </div>`;
    });
    html += `</div>
      <div class="sect">Novo item da despensa</div>
      <form class="card" data-form="des-add">
        <label>Nome</label>
        <input name="nome" placeholder="Arroz, café, ração dos gatos…" required />
        <label>Categoria</label>
        <select name="cat">${CATS_DESP.map((x) => `<option>${x}</option>`).join("")}</select>
        <label>Costuma acabar no dia (~) — opcional</label>
        <input name="diaAcaba" type="number" min="1" max="31" placeholder="ex: 20" />
        <div class="dica">Se souber: “arroz acaba sempre ~dia 20”. Senão o app estima pelas compras.</div>
        <button class="btn full" type="submit">Adicionar</button>
      </form>`;
    return html;
  }

  /* ─── Gatos ─── */
  function viewGatos() {
    let html = `<div class="sect">Nossos gatos <span class="mini">${S.gatos.length || ""}</span></div>`;
    if (!S.gatos.length) html += `<div class="card"><div class="vazio">Nenhum gato cadastrado ainda. 🐱</div></div>`;
    S.gatos.forEach((g) => {
      const prox = (g.vacinas || []).map((v) => diasPara(v.proxima)).filter((d) => d !== null).sort((a, b) => a - b)[0];
      let badge = "";
      if (prox !== undefined && prox < 0) badge = `<span class="pill bad">vacina atrasada</span>`;
      else if (prox !== undefined && prox <= 30) badge = `<span class="pill warn">vacina em ${prox}d</span>`;
      else if (prox !== undefined) badge = `<span class="pill ok">vacinas ok</span>`;
      html += `
        <div class="card">
          <div class="gatohead">
            <div class="gatoava">${esc((g.nome || "?")[0].toUpperCase())}</div>
            <div class="grow">
              <div class="t" style="font-size:1.15rem;">${esc(g.nome)}</div>
              <div class="s">${esc(g.sexo || "")} · ${idadeTxt(g.nasc)}${g.peso ? " · " + String(g.peso).replace(".", ",") + " kg" : ""}</div>
            </div>
            ${badge}
          </div>
          <div class="mt" style="display:flex; gap:0.5rem;">
            <button class="btn small ghost" style="flex:1;" data-action="gato-abrir" data-id="${g.id}">Abrir ficha</button>
            <button class="btn small danger" data-action="gato-del" data-id="${g.id}">✕</button>
          </div>
        </div>`;
    });
    html += `
      <div class="sect">Novo gato</div>
      <form class="card" data-form="gato-add">
        <label>Nome</label>
        <input name="nome" placeholder="Nome do gato" required />
        <div class="row2">
          <div><label>Sexo</label><select name="sexo"><option>Fêmea</option><option>Macho</option></select></div>
          <div><label>Nascimento</label><input name="nasc" type="date" /></div>
        </div>
        <div class="row2">
          <div><label>Peso (kg)</label><input name="peso" inputmode="decimal" placeholder="4,2" /></div>
          <div><label>Ração</label><input name="racao" placeholder="Marca da ração" /></div>
        </div>
        <label>Observações</label>
        <input name="obs" placeholder="Alergias, manias…" />
        <button class="btn full" type="submit">Cadastrar gato</button>
      </form>`;
    return html;
  }

  function modalGato(g) {
    const vacinas = (g.vacinas || []).slice().sort((a, b) => (a.proxima || "").localeCompare(b.proxima || ""));
    let html = `
      <h3>${esc(g.nome)}</h3>
      <div class="s" style="color:var(--ink-soft); font-weight:700;">${esc(g.sexo || "")} · ${idadeTxt(g.nasc)}${g.peso ? " · " + String(g.peso).replace(".", ",") + " kg" : ""}</div>
      ${g.racao ? `<div class="mt"><b>Ração:</b> ${esc(g.racao)}</div>` : ""}
      ${g.obs ? `<div class="mt"><b>Obs:</b> ${esc(g.obs)}</div>` : ""}
      <div class="sect">Vacinas</div>`;
    if (!vacinas.length) html += `<div class="vazio">Sem vacina registrada.</div>`;
    vacinas.forEach((v) => {
      const d = diasPara(v.proxima);
      let pill = "";
      if (d !== null && d < 0) pill = `<span class="pill bad">atrasada</span>`;
      else if (d !== null && d <= 30) pill = `<span class="pill warn">em ${d}d</span>`;
      else if (d !== null) pill = `<span class="pill ok">ok</span>`;
      html += `
        <div class="item">
          <div class="grow"><div class="t">${esc(v.nome)}</div>
          <div class="s">aplicada ${v.data ? new Date(v.data + "T12:00:00").toLocaleDateString("pt-BR") : "?"}${v.proxima ? " · próxima " + new Date(v.proxima + "T12:00:00").toLocaleDateString("pt-BR") : ""}</div></div>
          ${pill}
          <button class="statusbtn" data-action="vacina-del" data-gato="${g.id}" data-id="${v.id}">✕</button>
        </div>`;
    });
    html += `
      <form class="mt" data-form="vacina-add" data-id="${g.id}">
        <div class="row2">
          <div><label>Vacina</label><input name="nome" placeholder="V4, raiva…" required /></div>
          <div><label>Data aplicada</label><input name="data" type="date" /></div>
        </div>
        <label>Próxima dose</label>
        <input name="proxima" type="date" />
        <button class="btn full" type="submit">Anotar vacina</button>
      </form>
      <button class="btn ghost full" data-action="modal-close">Fechar</button>`;
    return html;
  }

  /* ─── Ajustes ─── */
  function viewAjustes() {
    const cfg = S.config;
    let html = `
      <div class="sect">Renda do casal</div>
      <div class="card">`;
    cfg.rendas.forEach((r) => {
      html += `
        <form class="buyrow" data-form="renda-upd" data-id="${r.id}" style="grid-template-columns: 1fr 4.4rem 4.8rem auto;">
          <input name="nome" value="${esc(r.nome)}" />

    });
    html += `

          <input name="dia" type="number" min="1" max="31" placeholder="Dia" required />

        <div class="row2">
          <div><label>Lazer/iFood do mês (R$)</label><input name="lazer" inputmode="decimal" value="${String(lazerOrcamento()).replace(".", ",")}" /></div>
          <div><label>Meta juntar (opcional)</label><input name="meta" inputmode="decimal" value="${num(cfg.metaGuardar) > 0 ? String(num(cfg.metaGuardar)).replace(".", ",") : ""}" placeholder="vazio = automática" /></div>
        </div>
        <label>Fundo emergência — meta (R$)</label>
        <input name="emergencia" inputmode="decimal" value="${String(emergenciaMeta()).replace(".", ",")}" />
        <button class="btn full" type="submit">Salvar cartão e metas</button>
        <div class="dica">Meta automática agora: <b>${fmt(metaSugerida())}</b> — a casa calcula sozinha. Fundo emergência atual: <b>${fmt(emergenciaGuardado())}</b>.</div>
      </form>

      <div class="sect">Casal, lembretes e IA</div>
      <form class="card" data-form="cfg-casa">
        <div class="row2">
          <div><label>Seu nome</label><input name="quemEu" value="${esc(cfg.quemEu || "Luiz")}" /></div>
          <div><label>Nome dela</label><input name="quemEla" value="${esc(cfg.quemEla || "Esposa")}" /></div>
        </div>
        <label style="font-weight:600; display:flex; align-items:center; gap:0.5rem; margin-top:0.8rem;">

        <label>Chave da API (fica só neste aparelho)</label>
        <input name="aiKey" type="password" autocomplete="off" placeholder="${getAiKey() ? "•••• já salva — cole pra trocar" : "cole a chave aqui"}" />

        2. <b>Build &amp; deploy → Continuous deployment → Link repository</b> → GitHub <b>luroh213/trevoa-ai</b>.<br>
        3. Publish directory: <b>nossacasa</b> (já no <code>netlify.toml</code>).<br>
        4. Depois: push em <b>main</b> atualiza o site — sem Drop.</div>
        <div class="dica">Enquanto não linkar: Drop ainda funciona (pasta nossacasa).</div>
      </div>

      <div class="card">
        <button class="btn ghost full" style="margin-top:0;" data-action="exportar">Baixar backup (JSON)</button>
        <form data-form="backup-restore" class="mt">
          <label style="margin-top:0;">Restaurar backup</label>
          <input name="arquivo" type="file" accept="application/json,.json" required />
          <button class="btn full" type="submit">Restaurar deste arquivo</button>

    return html;
  }

  /* ═══════════════════════ AÇÕES ═══════════════════════ */
  function closeModal() {
    $("#modalbk").hidden = true;
    $("#modal").innerHTML = "";
  }

  const A = {
    "tab": (el) => {
      tab = el.dataset.tab;
      if (tab === "casa" && el.dataset.sub) casaSub = el.dataset.sub;
      if (tab === "mais" && el.dataset.mais) maisSub = el.dataset.mais;
      hojePainel = null;
      closeModal();
      render();
      window.scrollTo(0, 0);
    },
    "ir-mais": (el) => {
      tab = "mais";
      maisSub = el.dataset.mais || "ajustes";
      closeModal();
      render();
      window.scrollTo(0, 0);
    },
    "hoje-painel": (el) => {
      const p = el.dataset.painel;
      hojePainel = hojePainel === p ? null : p;
      render();
    },
    "toggle-mais-hoje": () => { showMaisHoje = !showMaisHoje; render(); },
    "casa-sub": (el) => { casaSub = el.dataset.sub || "despensa"; render(); window.scrollTo(0, 0); },
    "mais-sub": (el) => { maisSub = el.dataset.sub || "mes"; render(); window.scrollTo(0, 0); },
    "onboard-next": () => {
      const total = 3;
      if (onboardStep >= total - 1) {
        S.config.onboardDone = true;
        touch();
        return;
      }
      onboardStep += 1;
      maybeShowOnboard();
    },
    "onboard-skip": () => { S.config.onboardDone = true; touch(); },
    "modal-close": () => closeModal(),

    "renda-toggle": (el) => {
      const mk = mesKey();
      if (!S.recebidos[mk]) S.recebidos[mk] = {};
      if (S.recebidos[mk][el.dataset.id]) delete S.recebidos[mk][el.dataset.id];
      else {
        const r = S.config.rendas.find((x) => x.id === el.dataset.id);
        if (!r) return;
        S.recebidos[mk][r.id] = { valor: num(r.valor) * (num(r.pessoas) || 1), ts: Date.now() };
      }
      touch();
    },

    "checklist-salario": () => {
      const ck = checklistEstado();
      if (!ck || ck.caiu) return;
      if (ck.modo === "espera") {
        if (!confirm(`Hoje ainda não é dia ${ck.alvo.dia}. O salário já caiu no banco mesmo?`)) return;
      }
      if (!S.recebidos[ck.mk]) S.recebidos[ck.mk] = {};
      S.recebidos[ck.mk][ck.alvo.id] = { valor: ck.total, ts: Date.now() };
      touch();
    },
    "checklist-pagar-quinzena": () => {
      const ck = checklistEstado();
      if (!ck || !ck.faltam.length) return;
      if (!ck.caiu) { alert("Marca o salário como Caiu antes."); return; }
      if (!confirm(`Pagar ${ck.faltam.length} conta(s) da quinzena pelos valores previstos (${fmt(ck.totalContas)})? Energia/internet: ajuste depois em Contas se mudou.`)) return;
      if (!S.pagamentos[ck.mk]) S.pagamentos[ck.mk] = {};
      ck.faltam.forEach((ct) => {
        S.pagamentos[ck.mk][ct.id] = { valor: num(ct.valor), ts: Date.now() };
      });
      touch();
    },
    "checklist-fatura-guardar": () => {
      const mk = mesKey();
      if (!S.checklist) S.checklist = {};
      if (!S.checklist[mk]) S.checklist[mk] = {};
      S.checklist[mk].faturaGuardada = true;
      touch();
    },

    "gasto-del": (el) => {
      const g = S.gastos.find((x) => x.id === el.dataset.id);
      if (g && g.fonte === "cedula") {
        if (!S.cedula) S.cedula = { valor: 0 };
        S.cedula.valor = Math.round((num(S.cedula.valor) + num(g.valor)) * 100) / 100;
      }
      S.gastos = S.gastos.filter((x) => x.id !== el.dataset.id);
      touch();
    },
    "entrada-del": (el) => {
      const e = (S.entradas || []).find((x) => x.id === el.dataset.id);
      if (e && e.fonte === "cedula") {
        if (!S.cedula) S.cedula = { valor: 0 };
        S.cedula.valor = Math.max(0, Math.round((num(S.cedula.valor) - num(e.valor)) * 100) / 100);
      }
      S.entradas = (S.entradas || []).filter((x) => x.id !== el.dataset.id);
      touch();
    },
    "toggle-corrigir": () => {
      showCorrigirSaldos = !showCorrigirSaldos;
      render();
    },
    "filtro-quem": (el) => {
      filtroQuem = el.dataset.quem || "todos";
      render();
    },
    "des-dia": (el) => {
      const d = S.despensa.find((x) => x.id === el.dataset.id);
      if (!d) return;
      const raw = prompt("Costuma acabar no dia do mês (1–31). Vazio = automático pelo histórico.", d.diaAcaba != null ? String(d.diaAcaba) : "");
      if (raw === null) return;
      const t = String(raw).trim();
      if (t === "") delete d.diaAcaba;
      else {
        const n = Math.round(num(t));
        if (n >= 1 && n <= 31) d.diaAcaba = n;
        else { alert("Dia inválido."); return; }
      }
      touch();
    },

    "conta-pagar": (el) => {
      pagandoId = pagandoId === el.dataset.id ? null : el.dataset.id;
      menuContaId = null;
      render();
      const input = document.querySelector(`form[data-form="conta-paga"][data-id="${el.dataset.id}"] input`);
      if (input) { input.focus(); input.select(); }
    },
    "conta-menu": (el) => {
      menuContaId = menuContaId === el.dataset.id ? null : el.dataset.id;
      render();
    },
    "conta-menu-close": () => { menuContaId = null; render(); },
    "toggle-nova-conta": () => { showNovaConta = !showNovaConta; render(); },
    "conta-edit": (el) => {
      const ct = S.contas.find((c) => c.id === el.dataset.id);
      if (!ct) return;
      const raw = prompt("Novo valor previsto (R$)", String(num(ct.valor)).replace(".", ","));
      if (raw === null) return;
      const v = num(raw);
      if (!(v > 0)) { alert("Valor inválido."); return; }
      ct.valor = v;
      menuContaId = null;
      touch("Conta atualizada");
    },
    "conta-desfazer": (el) => {
      const mk = mesKey();
      if (S.pagamentos[mk]) delete S.pagamentos[mk][el.dataset.id];
      touch("Pagamento desfeito");
    },
    "conta-del": (el) => {
      if (!confirm("Excluir esta conta?\n\nEla sai do controle mensal. Lançamentos já pagos deste mês ficam no histórico até limpar o mês.")) return;
      S.contas = S.contas.filter((c) => c.id !== el.dataset.id);
      menuContaId = null;
      touch("Conta excluída");
    },

    "fatura-pagar": () => {
      const c = calc();
      const valor = c.comprasCiclo > 0 ? c.comprasCiclo : num(S.config.faturaEstimada);
      if (valor <= 0) return;
      if (!confirm(`Pagar fatura de ${fmt(valor)}?`)) return;
      S.cartao.faturas[c.mk] = { valor, ts: Date.now() };
      S.cartao.compras = [];
      avancarParcelasAposFatura();
      touch();
    },
    "compra-del": (el) => {
      S.cartao.compras = S.cartao.compras.filter((x) => x.id !== el.dataset.id);
      touch();
    },

    "mes-fechar": () => {
      const mk = mesKey();
      if (!confirm(`Fechar ${mesNome()}? Salva um resumo previsto × real.`)) return;
      if (!S.mesesFechados) S.mesesFechados = {};
      S.mesesFechados[mk] = snapMesAtual();
      touch();
      tab = "mes";
      render();
    },
    "mes-reabrir": () => {
      const mk = mesKey();
      if (!confirm("Reabrir este mês? Apaga só o fechamento (lançamentos ficam).")) return;
      if (S.mesesFechados) delete S.mesesFechados[mk];
      touch();
    },

    "des-status": (el) => {
      const d = S.despensa.find((x) => x.id === el.dataset.id);
      if (!d) return;
      d.status = d.status === "tem" ? "pouco" : d.status === "pouco" ? "acabou" : "tem";
      const naLista = S.lista.some((l) => l.nome.toLowerCase() === d.nome.toLowerCase());
      if (d.status !== "tem" && !naLista) S.lista.push({ id: uid(), nome: d.nome, cat: d.cat });
      if (d.status === "tem" && naLista) S.lista = S.lista.filter((l) => l.nome.toLowerCase() !== d.nome.toLowerCase());
      touch();
    },
    "des-del": (el) => {
      S.despensa = S.despensa.filter((x) => x.id !== el.dataset.id);
      touch();
    },

    "gato-abrir": (el) => {
      const g = S.gatos.find((x) => x.id === el.dataset.id);
      if (!g) return;
      $("#modal").innerHTML = modalGato(g);
      $("#modalbk").hidden = false;
    },
    "gato-del": (el) => {
      const g = S.gatos.find((x) => x.id === el.dataset.id);
      if (!g || !confirm(`Remover ${g.nome}? Vacinas e ficha vão junto.`)) return;
      S.gatos = S.gatos.filter((x) => x.id !== el.dataset.id);
      touch();
    },
    "vacina-del": (el) => {
      const g = S.gatos.find((x) => x.id === el.dataset.gato);
      if (!g) return;
      g.vacinas = (g.vacinas || []).filter((v) => v.id !== el.dataset.id);
      touch();
      $("#modal").innerHTML = modalGato(g);
    },

    "renda-del": (el) => {
      el.preventDefault();
      if (!confirm("Remover esta renda?")) return;
      S.config.rendas = S.config.rendas.filter((r) => r.id !== el.dataset.id);
      touch();
    },

    "chat-limpar": (el) => {
      if (el && el.preventDefault) el.preventDefault();
      if (!confirm("Limpar conversa com a casa?")) return;
      S.chat = [];
      S.chatResposta = null;
      touch();
    },

    "exportar": () => {
      const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "nossa-casa-backup.json";
      a.click();
      URL.revokeObjectURL(a.href);
    },

    "exportar-mes": () => {
      const r = resumoMesDados();
      const c = r.c;
      const nq = nomesQuem();
      const ini = new Date(); ini.setDate(1); ini.setHours(0, 0, 0, 0);
      const mk = mesKey();
      const pag = S.pagamentos[mk] || {};
      const lines = [];
      lines.push(`Nossa Casa — ${mesNome()}`);
      lines.push(`Entrou: ${fmt(c.entrouMes)} | Saiu: ${fmt(r.saiu)} | Saldo mês: ${fmt(r.saldo)}`);
      lines.push(`Caixa agora: ${fmt(c.caixa)} | Meta: ${fmt(c.metaNum)} | Lazer resto: ${fmt(c.lazerRest)}`);
      lines.push("");
      lines.push("Contas pagas:");
      for (const id in pag) {
        const ct = S.contas.find((x) => x.id === id);
        lines.push(`- ${ct ? ct.nome : "Conta"}: ${fmt(pag[id].valor)}`);
      }
      lines.push("");
      lines.push("Gastos dinheiro:");
      let eu = 0, ela = 0;
      S.gastos.filter((g) => g.ts >= ini.getTime()).forEach((g) => {
        const quem = g.quem === "ela" ? nq.ela : g.quem === "eu" ? nq.eu : "Casa";
        if (g.quem === "ela") ela += num(g.valor);
        if (g.quem === "eu") eu += num(g.valor);
        lines.push(`- ${g.desc} (${g.cat}, ${quem}): ${fmt(g.valor)}`);
      });
      lines.push("");
      lines.push(`Quem gastou: ${nq.eu} ${fmt(eu)} | ${nq.ela} ${fmt(ela)}`);
      lines.push(`iFood ${fmt(r.ifood)} | Mercado ${fmt(r.mercado)} | Lazer ${fmt(r.lazer)} | Imprevisto ${fmt(r.imprevisto)}`);
      lines.push(`Cartão aberto: ${fmt(c.comprasCiclo)} | Fatura paga: ${fmt(c.faturaPaga)}`);
      const blob = new Blob([lines.join("\n")], { type: "text/plain;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `nossa-casa-${mk}.txt`;
      a.click();
      URL.revokeObjectURL(a.href);
    },

    "limpar-mes": () => {
      const nome = mesNome();
      if (!confirm(`Limpar lançamentos de ${nome}?\n\nApaga: salários marcados, entradas por fora, contas pagas, gastos no dinheiro e fatura paga deste mês.\n\nNÃO apaga: contas cadastradas, despensa, gatos, compras do cartão em aberto, saldo do banco.`)) return;
      const mk = mesKey();
      const ini = new Date(); ini.setDate(1); ini.setHours(0, 0, 0, 0);
      if (S.pagamentos) delete S.pagamentos[mk];
      if (S.recebidos) delete S.recebidos[mk];
      if (S.checklist) delete S.checklist[mk];
      if (S.cartao && S.cartao.faturas) delete S.cartao.faturas[mk];
      S.gastos = (S.gastos || []).filter((g) => num(g.ts) < ini.getTime());
      S.entradas = (S.entradas || []).filter((e) => num(e.ts) < ini.getTime());
      S.ultimaCompra = null;
      S.chatResposta = null;
      // chat conversa fica (histórico); se quiser limpar: botão no chat
      touch();
      tab = "mais";
      maisSub = "mes";
      render();
      window.scrollTo(0, 0);
    },

    "sair": async () => {
      if (!confirm("Sair da conta neste aparelho?")) return;
      try { await NCCloud.logout(); } catch (_) {}
      logado = false;
      location.reload();
    },
  };

  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-action]");
    if (el && A[el.dataset.action]) A[el.dataset.action](el, e);
    if (e.target.id === "modalbk") closeModal();
  });

  /* ─── Forms ─── */
  const F = {
    "gasto": (f) => {
      const valor = num(f.valor.value);
      const fonte = f.fonte && f.fonte.value === "cedula" ? "cedula" : "banco";
      if (valor <= 0) return;
      if (fonte === "cedula") {
        if (!S.cedula) S.cedula = { valor: 0 };
        if (num(S.cedula.valor) < valor) {
          if (!confirm(`Cédula tem só ${fmt(S.cedula.valor)}. Anotar mesmo e zerar cédula?`)) return;
          S.cedula.valor = 0;
        } else {
          S.cedula.valor = Math.round((num(S.cedula.valor) - valor) * 100) / 100;
        }
      }
      S.gastos.push({
        id: uid(),
        desc: f.desc.value.trim(),
        cat: f.cat.value,
        valor,
        quem: f.quem ? f.quem.value : "casa",
        fonte,
        ts: Date.now(),
      });
      hojePainel = null;
      touch("✓ Gasto registrado (" + fmt(valor) + ")");
    },
    "caixa-set": (f) => {
      const agora = Date.now();
      if (!S.inicio) S.inicio = agora;
      S.caixa = { valor: num(f.valor.value), em: agora };
      if (!S.cedula) S.cedula = { valor: 0 };
      if (f.cedula) S.cedula.valor = Math.max(0, num(f.cedula.value));
      showCorrigirSaldos = false;
      touch("✓ Saldos atualizados");
    },
    "conta-add": (f) => {
      S.contas.push({ id: uid(), nome: f.nome.value.trim(), valor: num(f.valor.value), dia: Math.min(31, Math.max(1, parseInt(f.dia.value) || 7)) });
      showNovaConta = false;
      touch("✓ Conta adicionada");
    },
    "conta-paga": (f) => {
      const mk = mesKey();
      if (!S.pagamentos[mk]) S.pagamentos[mk] = {};
      S.pagamentos[mk][f.dataset.id] = {
        valor: num(f.valor.value),
        quem: f.quem ? f.quem.value : "casa",
        ts: Date.now(),
      };
      pagandoId = null;
      touch("✓ Conta paga");
    },
    "hist-cmp": (f) => {
      histCmpA = f.a.value;
      histCmpB = f.b.value;
      tab = "mais";
      maisSub = "mes";
      render();
    },
    "backup-restore": (f) => {
      const file = f.arquivo && f.arquivo.files && f.arquivo.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const doc = JSON.parse(reader.result);
          if (!doc || typeof doc !== "object") throw new Error("invalid");
          if (!confirm("Isso substitui TODOS os dados atuais pelo backup. Continuar?")) return;
          S = hydrate(doc);
          touch("Backup restaurado");
          tab = "hoje";
          window.scrollTo(0, 0);
        } catch (_) {
          alert("Arquivo inválido. Use o JSON baixado em Ajustes.");
        }
      };
      reader.readAsText(file);
    },
    "entrada-add": (f) => {
      const valor = num(f.valor.value);
      const desc = String(f.desc.value || "").trim() || "Entrada";
      const fonte = f.fonte && f.fonte.value === "cedula" ? "cedula" : "banco";
      if (valor <= 0) return;
      if (fonte === "cedula") {
        if (!S.cedula) S.cedula = { valor: 0 };
        S.cedula.valor = Math.round((num(S.cedula.valor) + valor) * 100) / 100;
      }
      if (!S.entradas) S.entradas = [];
      S.entradas.push({ id: uid(), desc, valor, fonte, ts: Date.now() });
      hojePainel = null;
      touch("✓ Entrada registrada (" + fmt(valor) + ")");
      window.scrollTo(0, 0);
    },
    "pergunte": async (f) => {
      const q = String(f.q.value || "").trim();
      if (!q) return;
      if (!S.chat) S.chat = [];
      S.chat.push({ role: "eu", txt: q, ts: Date.now() });
      S.chat.push({ role: "casa", t: "ok", tit: "Casa pensando…", txt: "Só um segundo.", ts: Date.now() });
      if (S.chat.length > 40) S.chat = S.chat.slice(-40);
      render();
      const box = document.getElementById("chatbox");
      if (box) box.scrollTop = box.scrollHeight;
      const c = calc();
      const ans = await responderPerguntaSmart(q, c);
      S.chat = S.chat.filter((m) => !(m.tit === "Casa pensando…" && m.role === "casa"));
      S.chat.push({
        role: "casa",
        t: ans.t || "ok",
        tit: ans.tit || "Casa",
        txt: ans.txt || "",
        ts: Date.now(),
      });
      if (S.chat.length > 40) S.chat = S.chat.slice(-40);
      touch();
      requestAnimationFrame(() => {
        const b2 = document.getElementById("chatbox");
        if (b2) b2.scrollTop = b2.scrollHeight;
        const inp = document.getElementById("chat-input");
        if (inp) inp.focus();
      });
    },
    "simular": (f) => {
      if (!S.chat) S.chat = [];
      const v = f.valor.value;
      S.chat.push({ role: "eu", txt: `E se gastar ${v}?`, ts: Date.now() });
      const ans = simularGasto(v, calc());
      S.chat.push({ role: "casa", t: ans.t || "ok", tit: ans.tit || "Simulação", txt: ans.txt || "", ts: Date.now() });
      if (S.chat.length > 40) S.chat = S.chat.slice(-40);
      touch();
      requestAnimationFrame(() => {
        const b2 = document.getElementById("chatbox");
        if (b2) b2.scrollTop = b2.scrollHeight;
      });
    },
    "compra": (f) => {
      const desc = f.desc.value.trim();
      const total = num(f.valor.value);
      const n = Math.max(1, Math.min(24, parseInt(f.parcelas && f.parcelas.value, 10) || 1));
      if (total <= 0) return;
      const parcela = Math.round((total / n) * 100) / 100;
      const pid = uid();
      S.cartao.compras.push({
        id: uid(),
        desc: n > 1 ? `${desc} (1/${n})` : desc,
        valor: parcela,
        ts: Date.now(),
        parcelaDe: n > 1 ? pid : null,
      });
      if (n > 1) {
        if (!S.cartao.parcelas) S.cartao.parcelas = [];
        S.cartao.parcelas.push({
          id: pid,
          desc,
          valorParcela: parcela,
          valorTotal: total,
          total: n,
          restantes: n - 1,
        });
      }
      touch();
    },
    "emergencia-add": (f) => {
      const v = num(f.valor.value);
      if (v <= 0) return;
      if (!S.emergencia) S.emergencia = { guardado: 0 };
      S.emergencia.guardado = emergenciaGuardado() + v;
      touch();
      tab = "mes";
      render();
    },
    "des-add": (f) => {
      const item = { id: uid(), nome: f.nome.value.trim(), cat: f.cat.value, status: "tem" };
      const dia = Math.round(num(f.diaAcaba && f.diaAcaba.value));
      if (dia >= 1 && dia <= 31) item.diaAcaba = dia;
      S.despensa.push(item);
      touch();
    },
    "lista-add": (f) => {
      S.lista.push({ id: uid(), nome: f.nome.value.trim(), cat: "" });
      touch();
    },
    "lista-comprar": (f, btn) => {
      const it = S.lista.find((x) => x.id === f.dataset.id);
      if (!it) return;
      const valor = num(f.valor.value);
      const qtd = Math.max(1, parseInt(f.qtd.value) || 1);
      const pago = btn && btn.dataset.pago === "dinheiro" ? "dinheiro" : "cartao";
      if (valor <= 0) return;
      const desc = qtd > 1 ? `${it.nome} (${qtd} un)` : it.nome;
      if (pago === "cartao") S.cartao.compras.push({ id: uid(), desc, valor, ts: Date.now() });
      else S.gastos.push({ id: uid(), desc, cat: "Mercado", valor, ts: Date.now() });
      S.lista = S.lista.filter((x) => x.id !== it.id);
      const dep = S.despensa.find((d) => d.nome.toLowerCase() === it.nome.toLowerCase());
      if (dep) {
        dep.status = "tem";
        if (!dep.hist) dep.hist = [];
        dep.hist.push({ ts: Date.now(), qtd, valor });
      }
      S.ultimaCompra = { ts: Date.now(), desc, valor, pago };
      touch();
      tab = "hoje";
      render();
      window.scrollTo(0, 0);
    },
    "fatura-paga-valor": (f) => {
      const valor = num(f.valor.value);
      if (valor <= 0) return;
      if (!confirm(`Pagar fatura de ${fmt(valor)} e zerar compras do ciclo?`)) return;
      S.cartao.faturas[mesKey()] = { valor, ts: Date.now() };
      S.cartao.compras = [];
      S.config.faturaEstimada = 0;
      avancarParcelasAposFatura();
      touch();
    },
    "gato-add": (f) => {
      S.gatos.push({
        id: uid(), nome: f.nome.value.trim(), sexo: f.sexo.value,
        nasc: f.nasc.value || "", peso: f.peso.value || "", racao: f.racao.value.trim(),
        obs: f.obs.value.trim(), vacinas: [],
      });
      touch();
    },
    "vacina-add": (f) => {
      const g = S.gatos.find((x) => x.id === f.dataset.id);
      if (!g) return;
      if (!g.vacinas) g.vacinas = [];
      g.vacinas.push({ id: uid(), nome: f.nome.value.trim(), data: f.data.value || "", proxima: f.proxima.value || "" });
      touch();
      $("#modal").innerHTML = modalGato(g);
    },
    "renda-upd": (f) => {
      const r = S.config.rendas.find((x) => x.id === f.dataset.id);
      if (!r) return;
      r.nome = f.nome.value.trim() || r.nome;
      r.dia = Math.min(31, Math.max(1, parseInt(f.dia.value) || r.dia));
      r.valor = num(f.valor.value);
      touch();
    },
    "renda-add": (f) => {
      S.config.rendas.push({ id: uid(), nome: f.nome.value.trim(), dia: Math.min(31, Math.max(1, parseInt(f.dia.value) || 7)), valor: num(f.valor.value), pessoas: 2 });
      touch();
    },
    "cfg-cartao": (f) => {
      S.config.limiteCartao = num(f.limite.value);
      S.config.reservaCartao = num(f.reserva.value);
      S.config.diaVencFatura = Math.min(31, Math.max(1, parseInt(f.diaFatura.value, 10) || 19));
      S.config.faturaEstimada = num(f.faturaEst.value);
      S.config.lazerMes = num(f.lazer.value);
      const rawMeta = String(f.meta.value || "").trim();
      const metaInput = rawMeta === "" ? 0 : num(rawMeta);
      const sug = metaSugerida();
      S.config.metaGuardar = metaInput > 0 && Math.round(metaInput) !== Math.round(sug) ? metaInput : 0;
      if (f.emergencia) S.config.emergenciaMeta = Math.max(0, num(f.emergencia.value));
      touch();
    },
    "cfg-casa": async (f) => {
      S.config.quemEu = f.quemEu.value.trim() || "Luiz";
      S.config.quemEla = f.quemEla.value.trim() || "Esposa";
      S.config.aiOn = !!(f.aiOn && f.aiOn.checked);
      S.config.aiProvider = f.aiProvider.value || "groq";
      const novaKey = f.aiKey.value.trim();
      if (novaKey) setAiKey(novaKey);
      const querLembrete = !!(f.lembretes && f.lembretes.checked);
      if (querLembrete) {
        if (!("Notification" in window)) {
          alert("Este celular/navegador não tem notificação.");
          S.config.lembretesOn = false;
        } else {
          const p = await Notification.requestPermission();
          S.config.lembretesOn = p === "granted";
          if (!S.config.lembretesOn) alert("Permissão de notificação negada.");
        }
      } else {
        S.config.lembretesOn = false;
      }
      touch();
      checarLembretes(true);
    },
    "perfil": async (f) => {
      const msg = $("#perfil-msg");
      try {
        const r = await NCCloud.atualizarPerfil({ nome: f.nome.value.trim(), senhaAtual: f.atual.value || null, senhaNova: f.nova.value || null });
        if (r && r.ok) {
          if (r.nome) $("#h-nome").textContent = r.nome;
          if (msg) { msg.hidden = false; msg.textContent = "Perfil salvo."; }
          f.atual.value = ""; f.nova.value = "";
        } else if (msg) {
          msg.hidden = false;
          msg.textContent = (r && r.erro) || "Não deu pra salvar.";
        }
      } catch (e2) {
        if (msg) { msg.hidden = false; msg.textContent = "Sem nuvem agora — tente de novo."; }
      }
    },
  };

  document.addEventListener("submit", (e) => {
    const f = e.target.closest("form[data-form]");
    if (!f) return;
    e.preventDefault();
    const fn = F[f.dataset.form];
    if (fn) Promise.resolve(fn(f, e.submitter)).catch((err) => console.error(err));
  });

  function checarLembretes(force) {
    if (!S.config.lembretesOn || !("Notification" in window) || Notification.permission !== "granted") return;
    const diaKey = new Date().toISOString().slice(0, 10);
    try {
      if (!force && localStorage.getItem("nc-lembrete-dia") === diaKey) return;
      localStorage.setItem("nc-lembrete-dia", diaKey);
    } catch (_) {}
    const hoje = new Date().getDate();
    const vf = diaFatura();
    S.config.rendas.forEach((r) => {
      if (r.dia === hoje + 1) {
        try { new Notification("Nossa Casa", { body: `Amanhã cai ${r.nome}. Marca no app quando entrar.` }); } catch (_) {}
      }
      if (r.dia === hoje) {
        try { new Notification("Nossa Casa", { body: `Hoje é dia de ${r.nome}. Caiu? Marca no Hoje.` }); } catch (_) {}
      }
    });
    if (vf === hoje + 1) {
      try { new Notification("Nossa Casa", { body: "Amanhã vence a fatura — separa o dinheiro." }); } catch (_) {}
    }
    if (vf === hoje) {
      try { new Notification("Nossa Casa", { body: "Hoje é dia da fatura. Olha o Cartão no app." }); } catch (_) {}
    }
    S.gatos.forEach((g) => (g.vacinas || []).forEach((va) => {
      const d = diasPara(va.proxima);
      if (d === 0 || d === 1 || d === 7) {
        try { new Notification("Nossa Casa", { body: `Vacina ${va.nome} do ${g.nome}: ${d === 0 ? "hoje" : "em " + d + "d"}.` }); } catch (_) {}
      }
    }));
  }

  /* ═══════════════════════ BOOT ═══════════════════════ */
  $("#form-login").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector("button");
    const erro = $("#l-erro");
    btn.disabled = true;
    erro.hidden = true;
    try {
      const r = await NCCloud.login($("#l-usuario").value, $("#l-senha").value, $("#l-permanente").checked);
      if (!r.ok) {
        erro.textContent = r.erro || "Login inválido";
        erro.hidden = false;
        return;
      }
      entrar();
    } catch (e2) {
      erro.textContent = "Sem conexão com a nuvem. Confere a internet.";
      erro.hidden = false;
    } finally {
      btn.disabled = false;
    }
  });

  async function entrar() {
    logado = true;
    $("#gate").hidden = true;
    $("#app").hidden = false;
    const meta = NCCloud.getMeta();
    if (meta.nome) $("#h-nome").textContent = meta.nome;
    render();
    await cloudLoad();
    checarLembretes(false);
  }

  (async function boot() {
    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
    if (NCCloud.configured() && NCCloud.getToken()) {
      $("#gate").hidden = true;
      $("#app").hidden = false;
      logado = true;
      const meta = NCCloud.getMeta();
      if (meta.nome) $("#h-nome").textContent = meta.nome;
      render();
      cloudLoad().then(() => checarLembretes(false));
    } else if (!NCCloud.configured()) {
      // Sem nuvem: modo local, sem login
      logado = true;
      $("#gate").hidden = true;
      $("#app").hidden = false;
      setSync("");
      render();
      checarLembretes(false);
    } else {
      $("#gate").hidden = false;
    }
  })();
  </script>
</body>
</html>
