<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f6b45" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Nossa Casa" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="Dinheiro do casal, despensa de casa e cadastro dos gatos" />
  <title>Nossa Casa</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f6f8f6;
      --bg-deep: #eef2ef;
      --surface: #ffffff;
      --ink: #1a2e24;
      --ink-soft: #6b7c72;
      --ink-mute: #93a399;
      --brand: #1f6b45;
      --brand-deep: #155234;
      --brand-soft: #e8f3ec;
      --line: #e3ebe5;
      --line-strong: #c9d6cd;
      --ok: #1f6b45;
      --ok-soft: #e8f3ec;
      --warn: #9a6b12;
      --warn-soft: #f8efd9;
      --bad: #b03a3a;
      --bad-soft: #f8e4e4;
      --radius-sm: 12px;
      --radius-md: 16px;
      --radius-lg: 20px;
      --radius-xl: 24px;
      --shadow: 0 1px 2px rgba(26, 46, 36, 0.04), 0 4px 12px rgba(26, 46, 36, 0.04);
      --shadow-soft: 0 1px 3px rgba(26, 46, 36, 0.06);
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
      --font: "Plus Jakarta Sans", system-ui, sans-serif;
      --touch: 44px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      min-height: 100dvh;
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.45;
      color: var(--ink);
      background: var(--bg);
      padding: calc(var(--space-4) + var(--safe-top)) var(--space-4) calc(5.75rem + var(--safe-bottom));
      -webkit-font-smoothing: antialiased;
    }

    .wrap { max-width: 26.5rem; margin: 0 auto; position: relative; z-index: 1; }

    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes pop { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    .gate { min-height: calc(100dvh - 6rem); display: flex; flex-direction: column; justify-content: center; animation: rise 0.35s ease both; }
    .gate .brand-mark { display: flex; align-items: center; gap: var(--space-3); }
    .logo { width: 2.75rem; height: 2.75rem; flex-shrink: 0; }
    .brand { font-size: 1.35rem; font-weight: 800; color: var(--brand-deep); letter-spacing: -0.03em; line-height: 1.1; }
    .subtitle { margin-top: 4px; font-size: 0.9rem; color: var(--ink-soft); font-weight: 500; }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
      box-shadow: var(--shadow-soft);
    }
    .card + .card { margin-top: var(--space-3); }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--ink-soft);
      margin: var(--space-4) 0 var(--space-2);
      letter-spacing: 0.01em;
    }
    label:first-child { margin-top: 0; }

    input, select {
      width: 100%;
      font: inherit;
      font-size: 1rem;
      font-weight: 600;
      color: var(--ink);
      background: var(--bg);
      border: 1.5px solid var(--line-strong);
      border-radius: var(--radius-sm);
      padding: 0.75rem 0.875rem;
      min-height: var(--touch);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }
    input:focus, select:focus {
      border-color: var(--brand);
      background: #fff;
      box-shadow: 0 0 0 3px var(--brand-soft);
    }
    input[type="date"] { font-weight: 500; }
    input[type="checkbox"] { width: auto; min-height: 0; margin-right: 8px; }

    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-3); }
    .row2 > label { margin-top: var(--space-4); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      font: inherit; font-weight: 700; font-size: 0.95rem;
      color: #fff; background: var(--brand);
      border: none; border-radius: var(--radius-sm);
      padding: 0.85rem 1rem; min-height: var(--touch);
      cursor: pointer;
      transition: transform 0.12s, background 0.15s, opacity 0.15s;
    }
    .btn:hover { background: var(--brand-deep); }
    .btn:active { transform: scale(0.98); }
    .btn:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
    .btn.full { width: 100%; margin-top: var(--space-4); }
    .btn.ghost {
      background: transparent; color: var(--brand);
      border: 1.5px solid var(--line-strong);
    }
    .btn.ghost:hover { background: var(--brand-soft); }
    .btn.danger { background: var(--bad); }
    .btn.small { min-height: 2.5rem; padding: 0.45rem 0.8rem; font-size: 0.85rem; margin-top: 0; }

    .erro { margin-top: var(--space-3); background: var(--bad-soft); color: var(--bad); font-weight: 600; font-size: 0.875rem; padding: 12px 14px; border-radius: var(--radius-sm); }
    .dica { margin-top: var(--space-3); font-size: 0.8rem; color: var(--ink-soft); text-align: center; font-weight: 500; line-height: 1.4; }

    header.app {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: var(--space-5);
      animation: rise 0.3s ease both;
    }
    header.app .logo { width: 2rem; height: 2rem; }
    header.app .brand { font-size: 1.15rem; }
    header.app .spacer { flex: 1; }
    .syncdot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-mute); }
    .syncdot.ok { background: var(--ok); }
    .syncdot.busy { background: var(--warn); animation: pulse 0.9s infinite; }
    .syncdot.err { background: var(--bad); }
    .iconbtn {
      display: inline-flex; align-items: center; justify-content: center;
      width: var(--touch); height: var(--touch); border-radius: var(--radius-sm);
      background: var(--surface); border: 1.5px solid var(--line); cursor: pointer;
      color: var(--ink-soft); transition: background 0.15s, color 0.15s;
    }
    .iconbtn:hover { color: var(--brand); background: var(--brand-soft); }
    .iconbtn:active { transform: scale(0.96); }
    .iconbtn svg { width: 1.2rem; height: 1.2rem; }

    .hero {
      border-radius: var(--radius-xl);
      padding: var(--space-5) var(--space-5) var(--space-5);
      color: #fff;
      animation: pop 0.3s ease both;
      position: relative;
      overflow: hidden;
    }
    .hero.verde { background: linear-gradient(155deg, #2a8054 0%, #1a5636 100%); }
    .hero.amarelo { background: linear-gradient(155deg, #b8862d 0%, #8a6418 100%); }
    .hero.vermelho { background: linear-gradient(155deg, #b04a4a 0%, #853333 100%); }
    .hero .k {
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.1em; opacity: 0.8;
    }
    .hero .v {
      font-size: clamp(2.4rem, 9vw, 2.85rem); font-weight: 800;
      letter-spacing: -0.04em; line-height: 1.05; margin-top: 6px;
    }
    .hero .split { margin-top: 6px; font-size: 0.875rem; font-weight: 500; opacity: 0.88; }
    .hero .status-row {
      display: flex; align-items: center; gap: 8px;
      margin-top: var(--space-4); padding-top: var(--space-4);
      border-top: 1px solid rgba(255,255,255,0.18);
    }
    .hero .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #fff; flex-shrink: 0; box-shadow: 0 0 0 3px rgba(255,255,255,0.25);
    }
    .hero .msg { font-weight: 700; font-size: 1rem; }
    .hero .sub { margin-top: 2px; font-size: 0.85rem; opacity: 0.85; font-weight: 500; }
    .hero .metrics {
      margin-top: var(--space-4);
      display: grid; gap: 6px;
      font-size: 0.85rem; font-weight: 500; opacity: 0.92;
      line-height: 1.4;
    }

    .sect {
      margin: var(--space-6) 0 var(--space-3);
      font-size: 1.05rem; font-weight: 800; color: var(--ink);
      display: flex; align-items: baseline; gap: 8px; letter-spacing: -0.02em;
    }
    .sect .mini { font-size: 0.8rem; font-weight: 600; color: var(--ink-soft); }

    .item {
      display: flex; align-items: center; gap: 10px;
      padding: 14px 0;
      border-top: 1px solid var(--line);
    }
    .item:first-of-type { border-top: none; padding-top: 0; }
    .item:last-child { padding-bottom: 0; }
    .item .grow { flex: 1; min-width: 0; }
    .item .t { font-weight: 700; font-size: 0.95rem; }
    .item .s { font-size: 0.8rem; color: var(--ink-soft); font-weight: 500; margin-top: 2px; }
    .item .val { font-weight: 800; white-space: nowrap; font-size: 0.95rem; letter-spacing: -0.02em; }

    .pill {
      display: inline-flex; align-items: center;
      font-size: 0.7rem; font-weight: 700;
      padding: 4px 10px; border-radius: 9999px;
      letter-spacing: 0.01em;
    }
    .pill.ok { background: var(--ok-soft); color: var(--ok); }
    .pill.warn { background: var(--warn-soft); color: var(--warn); }
    .pill.bad { background: var(--bad-soft); color: var(--bad); }
    .pill.neu { background: var(--bg-deep); color: var(--ink-soft); }

    .vazio { text-align: center; color: var(--ink-soft); font-weight: 500; font-size: 0.9rem; padding: var(--space-6) var(--space-3); line-height: 1.5; }

    .alerta {
      display: flex; gap: 10px; align-items: flex-start;
      border-radius: var(--radius-sm); padding: 12px 14px;
      font-weight: 600; font-size: 0.875rem; margin-bottom: 8px;
    }
    .alerta:last-child { margin-bottom: 0; }
    .alerta.warn { background: var(--warn-soft); color: var(--warn); }
    .alerta.bad { background: var(--bad-soft); color: var(--bad); }
    .alerta.ok { background: var(--ok-soft); color: var(--ok); }

    .chat { margin-top: var(--space-3); }
    .chatbox { max-height: 20rem; overflow-y: auto; }
    .balao { display: flex; gap: 10px; margin-top: 12px; animation: rise 0.25s ease both; }
    .balao .ava {
      width: 2.25rem; height: 2.25rem; border-radius: 50%; flex-shrink: 0;
      background: var(--brand); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 0.7rem;
    }
    .balao .msg {
      flex: 1; background: var(--surface); border: 1px solid var(--line);
      border-radius: 4px var(--radius-md) var(--radius-md) var(--radius-md);
      padding: 12px 14px;
    }
    .balao .who { font-size: 0.68rem; font-weight: 700; color: var(--brand); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 2px; }
    .balao .tit { font-weight: 700; font-size: 0.95rem; margin-bottom: 2px; }
    .balao .txt { font-weight: 500; font-size: 0.875rem; line-height: 1.45; color: var(--ink); }
    .balao .txt ol { margin: 6px 0 0 1.1rem; }
    .balao.warn .msg { background: #fffbf3; border-color: #ebd7a8; }
    .balao.warn .who { color: var(--warn); }
    .balao.bad .msg { background: #fff6f6; border-color: #e8b8b8; }
    .balao.bad .who { color: var(--bad); }
    .balao.ok .msg { background: #f4faf6; border-color: #b9d6c4; }
    .balao.eu { flex-direction: row-reverse; }
    .balao.eu .ava { background: #4a6fa5; }
    .balao.eu .msg { background: #f0f4fa; border-color: #c2d0e4; border-radius: var(--radius-md) 4px var(--radius-md) var(--radius-md); }
    .balao.eu .who { color: #3a5a8c; }

    .bar { height: 8px; border-radius: 999px; background: var(--bg-deep); overflow: hidden; display: flex; margin: 12px 0 8px; }
    .bar .fill { height: 100%; transition: width 0.25s ease; }
    .bar .fill.lim { background: var(--brand); }
    .bar .fill.res { background: #d4a017; }
    .bar .fill.over { background: var(--bad); }
    .bar-legend { display: flex; justify-content: space-between; font-size: 0.78rem; font-weight: 600; color: var(--ink-soft); }

    .statusbtn {
      border: 1.5px solid var(--line-strong); background: var(--surface);
      border-radius: 9999px; font: inherit; font-size: 0.78rem; font-weight: 700;
      padding: 8px 12px; min-height: 36px; cursor: pointer; white-space: nowrap;
      transition: background 0.15s, border-color 0.15s;
    }
    .statusbtn.tem { border-color: transparent; color: var(--ok); background: var(--ok-soft); }
    .statusbtn.pouco { border-color: transparent; color: var(--warn); background: var(--warn-soft); }
    .statusbtn.acabou { border-color: transparent; color: var(--brand); background: var(--brand-soft); }

    .buyrow {
      display: grid; grid-template-columns: 1fr 3.4rem 4.8rem auto auto;
      gap: 8px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line);
    }
    .buyrow:first-of-type { border-top: none; }
    .buyrow input { padding: 8px 10px; font-size: 0.9rem; min-height: 40px; }
    .buyrow .nome { font-weight: 700; }
    .buyrow .nome .s { display: block; font-size: 0.75rem; color: var(--ink-soft); font-weight: 500; }

    .gatohead { display: flex; align-items: center; gap: 12px; }
    .gatoava {
      width: 2.75rem; height: 2.75rem; border-radius: var(--radius-sm);
      background: var(--brand-soft); display: flex; align-items: center; justify-content: center;
      font-size: 1.25rem; font-weight: 800; color: var(--brand); flex-shrink: 0;
    }

    .modalbk {
      position: fixed; inset: 0; background: rgba(26, 46, 36, 0.4);
      backdrop-filter: blur(2px); z-index: 40;
      display: flex; align-items: flex-end; justify-content: center;
    }
    .modalbk[hidden] { display: none; }
    .modal {
      background: var(--surface); border-radius: var(--radius-xl) var(--radius-xl) 0 0;
      width: 100%; max-width: 26.5rem; max-height: 86dvh; overflow-y: auto;
      padding: var(--space-5) var(--space-5) calc(var(--space-5) + var(--safe-bottom));
      animation: pop 0.22s ease both;
    }
    .modal h3 { font-size: 1.2rem; font-weight: 800; color: var(--ink); margin-bottom: 8px; letter-spacing: -0.02em; }

    nav.tabs {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
      display: flex; justify-content: center;
      background: rgba(255,255,255,0.92); backdrop-filter: blur(16px) saturate(1.2);
      border-top: 1px solid var(--line);
      padding: 6px 8px calc(6px + var(--safe-bottom));
    }
    nav.tabs button {
      flex: 1; max-width: none; border: none; background: none; cursor: pointer;
      font: inherit; font-size: 0.68rem; font-weight: 700; color: var(--ink-mute);
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      padding: 8px 4px; min-height: 52px; border-radius: 12px;
      transition: color 0.15s, background 0.15s;
    }
    nav.tabs button svg { width: 1.35rem; height: 1.35rem; stroke-width: 1.75; }
    nav.tabs button.on { color: var(--brand); background: var(--brand-soft); }

    [hidden] { display: none !important; }
    .mt { margin-top: var(--space-3); }
    .view { animation: rise 0.25s ease both; }

    .hbar { height: 6px; background: var(--bg-deep); border-radius: 99px; overflow: hidden; margin: 4px 0 10px; }
    .hbar > i { display: block; height: 100%; background: var(--brand); border-radius: inherit; }
    .hbar.alt > i { background: #d4a017; }
    .hbar.bad > i { background: var(--bad); }

    .chkstep { display: flex; gap: 12px; align-items: flex-start; padding: 14px 0; border-bottom: 1px solid var(--line); }
    .chkstep:last-child { border-bottom: 0; }
    .chknum {
      width: 1.5rem; height: 1.5rem; border-radius: 50%; flex-shrink: 0;
      display: grid; place-items: center; font-weight: 800; font-size: 0.7rem;
      background: var(--brand-soft); color: var(--brand);
    }
    .chknum.done { background: var(--brand); color: #fff; }
    .chknum.wait { background: var(--warn-soft); color: var(--warn); }

    .acao-grid {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 10px; margin-top: var(--space-4);
    }
    .acao-btn {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 8px; min-height: 5rem; padding: 12px 8px;
      border: 1.5px solid var(--line); border-radius: var(--radius-md); cursor: pointer;
      font: inherit; font-weight: 700; font-size: 0.82rem; color: var(--ink);
      background: var(--surface);
      transition: transform 0.12s, border-color 0.15s, background 0.15s;
    }
    .acao-btn:active { transform: scale(0.97); }
    .acao-btn.on { background: var(--brand-soft); border-color: var(--brand); color: var(--brand-deep); }
    .acao-btn .ico {
      width: 36px; height: 36px; border-radius: 10px;
      display: grid; place-items: center;
      background: var(--brand-soft); color: var(--brand);
    }
    .acao-btn.on .ico { background: var(--brand); color: #fff; }
    .acao-btn .ico svg { width: 18px; height: 18px; }

    .subtabs {
      display: flex; gap: 4px; margin: 0 0 var(--space-4);
      background: var(--bg-deep); padding: 4px; border-radius: var(--radius-sm);
    }
    .subtabs button {
      flex: 1; border: none; background: transparent; cursor: pointer;
      font: inherit; font-weight: 700; font-size: 0.875rem; color: var(--ink-soft);
      padding: 10px 8px; min-height: 40px; border-radius: 10px;
      transition: background 0.15s, color 0.15s;
    }
    .subtabs button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-soft); }

    #toast {
      position: fixed; left: 50%; bottom: calc(4.75rem + var(--safe-bottom));
      transform: translateX(-50%) translateY(120%);
      z-index: 50; max-width: calc(100% - 2rem); width: max-content;
      background: var(--ink); color: #fff; font-weight: 600; font-size: 0.875rem;
      padding: 12px 18px; border-radius: 9999px;
      box-shadow: var(--shadow);
      transition: transform 0.22s ease, opacity 0.22s;
      opacity: 0; pointer-events: none;
    }
    #toast.on { transform: translateX(-50%) translateY(0); opacity: 1; }

    .onboard {
      position: fixed; inset: 0; z-index: 60;
      background: rgba(26, 46, 36, 0.45); backdrop-filter: blur(3px);
      display: flex; align-items: flex-end; justify-content: center; padding: 16px;
    }
    .onboard .sheet {
      width: 100%; max-width: 26.5rem; background: var(--surface);
      border-radius: var(--radius-xl); padding: var(--space-6) var(--space-5) calc(var(--space-5) + var(--safe-bottom));
      animation: pop 0.25s ease both;
    }
    .onboard .sheet h2 { font-size: 1.35rem; font-weight: 800; color: var(--ink); margin-bottom: 8px; letter-spacing: -0.02em; }
    .onboard .sheet p { color: var(--ink-soft); font-weight: 500; line-height: 1.5; margin-bottom: var(--space-5); }

    .softlink {
      display: flex; align-items: center; justify-content: center; gap: 4px;
      width: 100%; margin-top: var(--space-4); text-align: center;
      background: none; border: none; cursor: pointer; font: inherit;
      font-weight: 700; font-size: 0.875rem; color: var(--brand); padding: 12px;
    }
    .softlink:hover { opacity: 0.85; }

    .resumo-card .resumo-label { font-size: 0.8rem; font-weight: 600; color: var(--ink-soft); }
    .resumo-card .resumo-valor { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.03em; margin: 4px 0 2px; }
    .resumo-card .resumo-meta { font-size: 0.85rem; font-weight: 500; color: var(--ink-soft); }

    .conta-row { display: flex; align-items: flex-start; gap: 10px; padding: 14px 0; border-top: 1px solid var(--line); }
    .conta-row:first-of-type { border-top: none; padding-top: 0; }
    .conta-row .grow { flex: 1; min-width: 0; }
    .conta-row .t { font-weight: 700; font-size: 0.95rem; }
    .conta-row .s { font-size: 0.8rem; color: var(--ink-soft); font-weight: 500; margin-top: 2px; }
    .conta-row .val { font-weight: 800; white-space: nowrap; margin-top: 2px; }
    .conta-actions { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

    .icon-more {
      width: 36px; height: 36px; border: none; background: transparent;
      border-radius: 10px; cursor: pointer; color: var(--ink-mute);
      display: grid; place-items: center; font-size: 1.1rem; font-weight: 800;
      letter-spacing: 1px;
    }
    .icon-more:hover { background: var(--bg-deep); color: var(--ink); }

    .menu-sheet { display: grid; gap: 8px; margin-top: 8px; }
    .menu-sheet button { width: 100%; }

    .fatura-hero .fh-val { font-size: 2rem; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
    .fatura-hero .fh-meta { font-size: 0.85rem; color: var(--ink-soft); font-weight: 500; margin-top: 4px; }
    .fatura-stats {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;
      margin-top: var(--space-4); padding-top: var(--space-4);
      border-top: 1px solid var(--line);
    }
    .fatura-stats div { text-align: center; }
    .fatura-stats .k { font-size: 0.7rem; font-weight: 600; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.04em; }
    .fatura-stats .v { font-size: 0.9rem; font-weight: 800; margin-top: 2px; letter-spacing: -0.02em; }

    .add-trigger {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; min-height: var(--touch);
      border: 1.5px dashed var(--line-strong); border-radius: var(--radius-md);
      background: transparent; cursor: pointer;
      font: inherit; font-weight: 700; font-size: 0.9rem; color: var(--brand);
      margin-top: var(--space-4); padding: 12px;
      transition: background 0.15s, border-color 0.15s;
    }
    .add-trigger:hover { background: var(--brand-soft); border-color: var(--brand); }

    @media (min-width: 480px) {
      body { padding-left: var(--space-6); padding-right: var(--space-6); }
    }
  </style>
</head>

  </div>

  <script src="./config.js"></script>
  <script src="./config.secrets.js"></script>
  <script src="./cloud.js"></script>
  <script>
  /* ═══════════════════════ ESTADO ═══════════════════════ */
  const LS = "nc-state-v1";
  const CATS_GASTO = ["iFood", "Mercado", "Farmácia", "Transporte", "Lazer", "Imprevisto", "Gatos", "Casa", "Outros"];
  const CATS_DESP = ["Mercado", "Limpeza", "Higiene", "Ração", "Outros"];

  function uid() {
    return (crypto.randomUUID ? crypto.randomUUID() : "id" + Date.now() + Math.random().toString(16).slice(2));
  }

  function defaultState() {
    return {
      v: 3,
      inicio: null, // timestamp do 1º uso (saldo informado) — não julga contas de antes disso
      caixa: null, // {valor, em} — saldo no BANCO + quando informou
      cedula: { valor: 0 }, // dinheiro em papel na mão (não passa no banco)
      config: {
        rendas: [
          { id: uid(), nome: "Salário 1", dia: 7, valor: 738, pessoas: 2 },
          { id: uid(), nome: "Salário 2", dia: 15, valor: 810, pessoas: 2 },
        ],
        limiteCartao: 800,
        reservaCartao: 400,
        diaVencFatura: 19, // dia que a fatura vence / vocês pagam
        faturaEstimada: 0, // se ainda não lançou compras, chute opcional
        lazerMes: 200, // orçamento de lazer/iFood sem culpa
        metaGuardar: 0,
        emergenciaMeta: 2000, // fundo emergência (meta alvo)
        quemEu: "Luiz",
        quemEla: "Esposa",
        lembretesOn: false,
        aiOn: true,
        onboardDone: false,
      },
      contas: [
        { id: uid(), nome: "Aluguel", valor: 450, dia: 7 },
        { id: uid(), nome: "Energia", valor: 230, dia: 7 },
        { id: uid(), nome: "Internet", valor: 80, dia: 7 },
      ],
      pagamentos: {},
      recebidos: {},
      entradas: [], // dinheiro que entrou fora do salário (PIX, bônus, devolução…)
      gastos: [],
      cartao: { compras: [], faturas: {}, parcelas: [] }, // parcelas futuras após pagar fatura
      despensa: [],
      lista: [],
      gatos: [],
      checklist: {},
      chat: [],
      emergencia: { guardado: 0 }, // quanto já juntou no fundo
      mesesFechados: {}, // "AAAA-MM": { ts, snap }
    };
  }

  let S = defaultState();
  try {
    const raw = localStorage.getItem(LS);
    if (raw) S = hydrate(JSON.parse(raw));
  } catch (_) {
    S = defaultState();
  }

  function hydrate(doc) {
    const base = defaultState();
    if (!doc || typeof doc !== "object") return base;
    const out = Object.assign(base, doc);
    out.config = Object.assign({}, base.config, doc.config || {});
    if (!Array.isArray(out.config.rendas) || !out.config.rendas.length) out.config.rendas = base.config.rendas;
    out.contas = Array.isArray(doc.contas) ? doc.contas : [];
    out.gastos = Array.isArray(doc.gastos) ? doc.gastos : [];
    out.entradas = Array.isArray(doc.entradas) ? doc.entradas : [];
    out.despensa = Array.isArray(doc.despensa) ? doc.despensa : [];
    out.lista = Array.isArray(doc.lista) ? doc.lista : [];
    out.gatos = Array.isArray(doc.gatos) ? doc.gatos : [];
    out.pagamentos = doc.pagamentos && typeof doc.pagamentos === "object" ? doc.pagamentos : {};
    out.recebidos = doc.recebidos && typeof doc.recebidos === "object" ? doc.recebidos : {};
    out.cartao = Object.assign({ compras: [], faturas: {}, parcelas: [] }, doc.cartao || {});
    if (!Array.isArray(out.cartao.compras)) out.cartao.compras = [];
    if (!out.cartao.faturas || typeof out.cartao.faturas !== "object") out.cartao.faturas = {};
    if (!Array.isArray(out.cartao.parcelas)) out.cartao.parcelas = [];
    if (out.caixa && !out.inicio) out.inicio = out.caixa.em || Date.now();
    out.cedula = Object.assign({ valor: 0 }, doc.cedula || {});
    if (!(num(out.cedula.valor) >= 0)) out.cedula.valor = 0;
    if (!(num(out.config.lazerMes) > 0)) out.config.lazerMes = 200;
    if (out.config.diaVencFatura == null) out.config.diaVencFatura = 19;
    if (!(num(out.config.emergenciaMeta) >= 0)) out.config.emergenciaMeta = 2000;
    if (!out.config.quemEu || out.config.quemEu === "Die") out.config.quemEu = "Luiz";
    if (!out.config.quemEla) out.config.quemEla = "Esposa";
    if (out.config.lembretesOn == null) out.config.lembretesOn = false;
    if (out.config.aiOn == null) out.config.aiOn = !!(window.NC_AI && window.NC_AI.enabled && window.NC_AI.apiKey);
    if (out.config.onboardDone == null) out.config.onboardDone = false;
    if (!out.config.aiProvider) out.config.aiProvider = (window.NC_AI && window.NC_AI.provider) || "groq";
    if (window.NC_AI && window.NC_AI.enabled && window.NC_AI.apiKey) out.config.aiOn = true;
    out.checklist = doc.checklist && typeof doc.checklist === "object" ? doc.checklist : {};
    out.chat = Array.isArray(doc.chat) ? doc.chat : [];
    out.emergencia = Object.assign({ guardado: 0 }, doc.emergencia || {});
    out.mesesFechados = doc.mesesFechados && typeof doc.mesesFechados === "object" ? doc.mesesFechados : {};
    return out;
  }

  let tab = "hoje";
  let pagandoId = null;
  let filtroQuem = "todos"; // todos | eu | ela
  let histCmpA = "";
  let histCmpB = "";
  let showCorrigirSaldos = false;
  let showNovaConta = false;
  let menuContaId = null;
  let hojePainel = null; // entrou | gastei | caiu
  let showMaisHoje = false;
  let casaSub = "despensa";
  let maisSub = "mes";
  let onboardStep = 0;
  let toastTimer = null;
  let saveTimer = null;
  let saving = false;
  let logado = false;

  /* ═══════════════════════ HELPERS ═══════════════════════ */
  const $ = (sel) => document.querySelector(sel);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const fmt = (v) => (Number(v) || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  const num = (v) => { const n = Number(String(v).replace(",", ".")); return Number.isFinite(n) ? n : 0; };

  function mesKey(ts) {
    const d = ts ? new Date(ts) : new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
  }
  function mesNome() {
    return new Date().toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
  }
  function mesNomeDe(mk) {
    if (!mk || !/^\d{4}-\d{2}$/.test(mk)) return mk || "";
    const [y, m] = mk.split("-").map(Number);
    const d = new Date(y, m - 1, 1);
    return d.toLocaleDateString("pt-BR", { month: "short", year: "numeric" });
  }
  function mesesFechadosLista() {
    return Object.keys(S.mesesFechados || {}).sort().reverse();
  }
  function diasAteDiaMes(diaAlvo) {
    if (!(diaAlvo >= 1 && diaAlvo <= 31)) return null;
    const h = new Date();
    const hoje = h.getDate();
    if (diaAlvo === hoje) return 0;
    if (diaAlvo > hoje) return diaAlvo - hoje;
    const ult = new Date(h.getFullYear(), h.getMonth() + 1, 0).getDate();
    const dia = Math.min(diaAlvo, ult);
    const alvo = new Date(h.getFullYear(), h.getMonth() + 1, dia);
    alvo.setHours(0, 0, 0, 0);
    const hoje0 = new Date(h); hoje0.setHours(0, 0, 0, 0);
    return Math.max(1, Math.round((alvo - hoje0) / 86400000));
  }
  function lembretesSmartCard(c) {
    const linhas = [];
    const hoje = new Date().getDate();
    if (c.prox) {
      const d = c.diasAte;
      const nome = c.prox.nome || "salário";
      if (d === 0) linhas.push({ cls: "warn", txt: `<b>${esc(nome)}</b> cai <b>hoje</b> (~${fmt(c.prox.valor)}). Marca Caiu quando entrar.` });
      else if (d === 1) linhas.push({ cls: "warn", txt: `Amanhã cai <b>${esc(nome)}</b> (~${fmt(c.prox.valor)}).` });
      else if (d <= 7) linhas.push({ cls: "ok", txt: `Faltam <b>${d} dias</b> pro salário (~${fmt(c.prox.valor)}) · dia ${c.prox.d.getDate()}.` });
      else linhas.push({ cls: "ok", txt: `Próximo salário em <b>${d} dias</b> (dia ${c.prox.d.getDate()} · ~${fmt(c.prox.valor)}).` });
    }
    const vf = diaFatura();
    const df = diasAteDiaMes(vf);
    if (df === 0) linhas.push({ cls: "bad", txt: `Fatura vence <b>hoje</b> (dia ${vf}). Olha Cartão.` });
    else if (df === 1) linhas.push({ cls: "warn", txt: `Fatura amanhã (dia ${vf}). Separa o valor.` });
    else if (df != null && df <= 7) linhas.push({ cls: "warn", txt: `Fatura em <b>${df} dias</b> (dia ${vf}).` });
    const ck = checklistEstado();
    if (ck && !ck.caiu && ck.modo === "ativo") {
      linhas.push({ cls: "warn", txt: `Salário do dia ${ck.alvo.dia} já deveria ter caído — falta marcar <b>Caiu</b>.` });
    }
    if (ck && ck.caiu && ck.faltam.length) {
      linhas.push({ cls: "warn", txt: `${ck.faltam.length} conta(s) desta quinzena ainda abertas (~${fmt(ck.totalContas)}).` });
    }
    // despensa recorrente perto do dia
    (S.despensa || []).forEach((d) => {
      const dia = diaAcabaItem(d);
      if (!dia) return;
      const dist = Math.min(Math.abs(dia - hoje), Math.abs(dia - hoje + 30), Math.abs(dia + 30 - hoje));
      if (dist <= 2 && d.status === "tem") {
        linhas.push({ cls: "ok", txt: `<b>${esc(d.nome)}</b> costuma acabar ~dia ${dia} — confere a despensa.` });
      }
    });
    if (!linhas.length) return "";
    return `
      <div class="sect">Lembretes</div>
      <div class="card">
        ${linhas.slice(0, 5).map((l) => `<div class="alerta ${l.cls}"><span>${l.txt}</span></div>`).join("")}
      </div>`;
  }
  function diaAcabaItem(d) {
    const manual = num(d.diaAcaba);
    if (manual >= 1 && manual <= 31) return Math.round(manual);
    const h = (d.hist || []).slice().sort((a, b) => b.ts - a.ts);
    const dm = duracaoMedia(d);
    if (!h.length || !(dm > 0)) return null;
    const last = h[0];
    const qtd = Math.max(1, num(last.qtd) || 1);
    const next = new Date(num(last.ts) + dm * qtd * 86400000);
    return next.getDate();
  }
  function passaFiltroQuem(quem) {
    if (filtroQuem === "todos") return true;
    if (filtroQuem === "eu") return quem === "eu";
    if (filtroQuem === "ela") return quem === "ela";
    return true;
  }
  function htmlFiltroQuem() {
    const nq = nomesQuem();
    const btn = (id, label) =>
      `<button type="button" class="btn small ${filtroQuem === id ? "" : "ghost"}" data-action="filtro-quem" data-quem="${id}" style="flex:1;">${esc(label)}</button>`;
    return `<div style="display:flex; gap:0.4rem; margin:0.5rem 0 0.7rem;">
      ${btn("todos", "Todos")}
      ${btn("eu", nq.eu)}
      ${btn("ela", nq.ela)}
    </div>`;
  }
  function dataBR(ts) {
    return new Date(ts).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" });
  }
  function diasAteFimDoMes() {
    const h = new Date();
    const ult = new Date(h.getFullYear(), h.getMonth() + 1, 0).getDate();
    return ult - h.getDate() + 1;
  }
  function idadeTxt(nasc) {
    if (!nasc) return "idade ?";
    const d = new Date(nasc + "T12:00:00");
    if (isNaN(d)) return "idade ?";
    let meses = (new Date().getFullYear() - d.getFullYear()) * 12 + (new Date().getMonth() - d.getMonth());
    if (meses < 0) meses = 0;
    if (meses < 12) return meses + (meses === 1 ? " mês" : " meses");
    const a = Math.floor(meses / 12), m = meses % 12;
    return a + (a === 1 ? " ano" : " anos") + (m ? " e " + m + " m" : "");
  }
  function diasPara(dataStr) {
    if (!dataStr) return null;
    const alvo = new Date(dataStr + "T12:00:00");
    if (isNaN(alvo)) return null;
    const hoje = new Date(); hoje.setHours(12, 0, 0, 0);
    return Math.round((alvo - hoje) / 86400000);
  }

  /* ═══════════════════════ NUVEM ═══════════════════════ */
  function setSync(estado) {
    const d = $("#syncdot");
    if (!d) return;
    d.className = "syncdot" + (estado ? " " + estado : "");
  }

  function saveLocal() {
    try { localStorage.setItem(LS, JSON.stringify(S)); } catch (_) {}
  }

  function touch(msg) {
    saveLocal();
    if (logado && NCCloud.configured()) {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(cloudSave, 900);
    }
    render();
    if (msg) toast(msg);
  }

  function toast(msg) {
    const el = document.getElementById("toast");
    if (!el || !msg) return;
    el.textContent = msg;
    el.classList.add("on");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("on"), 2400);
  }

  async function cloudSave() {
    if (saving) return;
    saving = true;
    setSync("busy");
    try {
      await NCCloud.salvar(S);
      setSync("ok");
    } catch (e) {
      setSync("err");
    } finally {
      saving = false;
    }
  }

  async function cloudLoad() {
    setSync("busy");
    try {
      const r = await NCCloud.carregar();
      if (r.doc) {
        S = hydrate(r.doc);
        saveLocal();
      }
      if (r.nome) $("#h-nome").textContent = r.nome;
      setSync("ok");
    } catch (e) {
      setSync("err");
    }
    render();
  }

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible" && logado) {
      if (NCCloud.configured() && !saving) cloudLoad();
      checarLembretes(false);
    }
  });

  /* ═══════════════════════ CÁLCULO FINANCEIRO ═══════════════════════ */
  // Próxima renda a cair (data + valor total do casal)
  function proxRenda() {
    const h = new Date(); h.setHours(0, 0, 0, 0);
    let best = null;
    S.config.rendas.forEach((r) => {
      let d = new Date(h.getFullYear(), h.getMonth(), r.dia);
      if (d < h) d = new Date(h.getFullYear(), h.getMonth() + 1, r.dia);
      if (!best || d < best.d) best = { d, valor: num(r.valor) * (num(r.pessoas) || 1), nome: r.nome };
    });
    return best;
  }

  function calc() {
    const mk = mesKey();
    const cfg = S.config;
    const rec = S.recebidos[mk] || {};
    const pag = S.pagamentos[mk] || {};
    const hoje0 = new Date(); hoje0.setHours(0, 0, 0, 0);

    // Caixa real: saldo informado + tudo que entrou/saiu DEPOIS dessa informação
    const emBase = S.caixa ? num(S.caixa.em) : 0;
    let entrou = 0, pagou = 0, faturasPagas = 0;
    for (const k in S.recebidos) for (const id in S.recebidos[k]) {
      const r = S.recebidos[k][id];
      if (num(r.ts) > emBase) entrou += num(r.valor);
    }
    (S.entradas || []).forEach((e) => {
      if (e.fonte === "cedula") return; // cédula já soma no potinho, não no banco
      if (num(e.ts) > emBase) entrou += num(e.valor);
    });
    for (const k in S.pagamentos) for (const id in S.pagamentos[k]) {
      const p = S.pagamentos[k][id];
      if (num(p.ts) > emBase) pagou += num(p.valor);
    }
    for (const k in S.cartao.faturas) {
      const f = S.cartao.faturas[k];
      if (num(f.ts) > emBase) faturasPagas += num(f.valor);
    }
    const gastosPos = S.gastos
      .filter((g) => g.ts > emBase && g.fonte !== "cedula")
      .reduce((a, g) => a + num(g.valor), 0);
    const banco = (S.caixa ? num(S.caixa.valor) : 0) + entrou - pagou - gastosPos - faturasPagas;
    const cedula = Math.max(0, num((S.cedula || {}).valor));
    const caixa = banco + cedula; // total na mão + banco

    // Visão do mês (telas de controle)
    const iniMesCalc = new Date(); iniMesCalc.setDate(1); iniMesCalc.setHours(0, 0, 0, 0);
    const entradasMes = (S.entradas || []).filter((e) => num(e.ts) >= iniMesCalc.getTime()).reduce((a, e) => a + num(e.valor), 0);
    const entrouMes = Object.values(rec).reduce((a, r) => a + num(r.valor), 0) + entradasMes;
    const previstoMes = cfg.rendas.reduce((a, r) => a + num(r.valor) * (num(r.pessoas) || 1), 0);
    let contasPagas = 0;
    for (const k in pag) contasPagas += num(pag[k].valor);
    const contasFaltam = S.contas.filter((c) => !pag[c.id]).reduce((a, c) => a + num(c.valor), 0);
    const ini = new Date(); ini.setDate(1); ini.setHours(0, 0, 0, 0);
    const gastosMes = S.gastos.filter((g) => g.ts >= ini.getTime()).reduce((a, g) => a + num(g.valor), 0);
    const comprasCiclo = S.cartao.compras.reduce((a, c) => a + num(c.valor), 0);
    const faturaPaga = S.cartao.faturas[mk] ? num(S.cartao.faturas[mk].valor) : 0;

    // Reserva no BANCO (contas/fatura/meta saem da conta, não da cédula)
    const prox = proxRenda();
    const diasAte = prox ? Math.max(1, Math.round((prox.d - hoje0) / 86400000)) : diasAteFimDoMes();
    let obrigAte = 0;
    let bestCaiu = null;
    for (const id in rec) {
      const r = S.config.rendas.find((x) => x.id === id);
      if (!r) continue;
      const ts = num(rec[id].ts);
      if (!bestCaiu || ts > bestCaiu.ts) bestCaiu = { dia: r.dia, ts };
    }
    if (bestCaiu) {
      const diasRenda = S.config.rendas.map((r) => r.dia).sort((a, b) => a - b);
      const idx = diasRenda.indexOf(bestCaiu.dia);
      const proxDia = diasRenda.length && idx >= 0 ? diasRenda[(idx + 1) % diasRenda.length] : 32;
      const viraMes = idx < 0 || !diasRenda.length || proxDia <= bestCaiu.dia;
      S.contas.forEach((ct) => {
        if (pag[ct.id]) return;
        const na = viraMes ? ct.dia >= bestCaiu.dia : (ct.dia >= bestCaiu.dia && ct.dia < proxDia);
        if (na) obrigAte += num(ct.valor);
      });
      if (!S.cartao.faturas[mk]) {
        const ciclo = S.cartao.compras.reduce((a, x) => a + num(x.valor), 0);
        obrigAte += ciclo > 0 ? ciclo : num(S.config.faturaEstimada);
      }
    }
    // Meta: automática (metaSugerida) ou forçada em Ajustes
    const metaNum = metaEfetiva();
    // Enquanto espera salário, não reserva meta cheia no caixa pequeno
    const metaReserva = bestCaiu ? metaNum : Math.min(metaNum, Math.max(0, Math.floor(banco * 0.1)));
    obrigAte += metaReserva;

    const lazerOrc = num(S.config.lazerMes) > 0 ? num(S.config.lazerMes) : 200;
    // Livre = (banco − reservado) + cédula
    const livreAte = Math.max(0, banco - obrigAte) + cedula;
    const lazerRest = Math.max(0, lazerOrc - (() => {
      const iniM = new Date(); iniM.setDate(1); iniM.setHours(0, 0, 0, 0);
      return S.gastos.filter((g) => g.ts >= iniM.getTime() && (g.cat === "iFood" || g.cat === "Lazer")).reduce((a, g) => a + num(g.valor), 0);
    })());
    // Esperando salário: lazer quase zerado de propósito
    const lazerDisp = bestCaiu ? lazerRest : Math.min(lazerRest, Math.max(0, Math.floor(caixa * 0.15)));
    const livreViver = Math.max(0, livreAte - (bestCaiu ? lazerRest : 0));
    const porDia = livreViver / diasAte;

    return { mk, caixa, banco, cedula, entrouMes, previstoMes, contasPagas, contasFaltam, gastosMes, comprasCiclo, faturaPaga, prox, diasAte, obrigAte, livreAte, livreViver, lazerRest: lazerDisp, porDia, metaNum, esperandoSalario: !bestCaiu };
  }

  // Duração média por unidade (dias) de um item da despensa, pelo histórico de compras
  function duracaoMedia(d) {
    const h = (d.hist || []).slice().sort((a, b) => a.ts - b.ts);
    if (h.length < 2) return null;
    let dias = 0, un = 0;
    for (let i = 1; i < h.length; i++) {
      dias += (h[i].ts - h[i - 1].ts) / 86400000;
      un += num(h[i - 1].qtd) || 1;
    }
    return un > 0 ? dias / un : null;
  }

  function semaforo(porDia) {
    if (porDia >= 50) return { cls: "verde", msg: "Ritmo tranquilo", sub: "Dá pra viver sem aperto até o próximo salário." };
    if (porDia >= 20) return { cls: "amarelo", msg: "Atenção", sub: "Tem dinheiro, mas sem exagero no dia a dia." };
    return { cls: "vermelho", msg: "Apertado", sub: "Prioriza o essencial até o próximo salário." };
  }

  function contasDaQuinzena(diaRenda) {
    const dias = S.config.rendas.map((r) => r.dia).sort((a, b) => a - b);
    const idx = dias.indexOf(diaRenda);
    const proxDia = dias.length && idx >= 0 ? dias[(idx + 1) % dias.length] : 32;
    const viraMes = idx < 0 || !dias.length || proxDia <= diaRenda;
    return S.contas.filter((ct) => (viraMes ? ct.dia >= diaRenda : (ct.dia >= diaRenda && ct.dia < proxDia)));
  }

  function checklistEstado() {
    const hoje = new Date().getDate();
    const mk = mesKey();
    const rec = S.recebidos[mk] || {};
    const pag = S.pagamentos[mk] || {};
    const rendas = S.config.rendas.slice().sort((a, b) => a.dia - b.dia);
    if (!rendas.length) return null;

    // Mira o salário que importa AGORA — nunca um dia passado (ex.: dia 7 no dia 12)
    let alvo = null;
    let modo = "espera"; // espera | ativo
    const caiuObj = rendaRecenteCaiu();
    if (caiuObj) {
      const proxNaoCaiu = rendas.find((r) => r.dia > caiuObj.dia && !rec[r.id]);
      if (proxNaoCaiu && hoje >= proxNaoCaiu.dia) {
        alvo = proxNaoCaiu;
        modo = "ativo";
      } else {
        alvo = rendas.find((r) => r.id === caiuObj.id) || rendas[0];
        modo = "ativo";
      }
    } else {
      alvo = rendas.find((r) => r.dia >= hoje) || rendas[0];
      modo = hoje >= alvo.dia ? "ativo" : "espera";
    }

    const total = num(alvo.valor) * (num(alvo.pessoas) || 1);
    const caiu = !!rec[alvo.id];
    const contas = contasDaQuinzenaDia(alvo.dia);
    const faltam = contas.filter((c) => !pag[c.id]);
    const totalContas = faltam.reduce((a, c) => a + num(c.valor), 0);
    const todasQuinzena = S.contas.filter((ct) => {
      const dias = rendas.map((r) => r.dia);
      const idx = dias.indexOf(alvo.dia);
      const proxDia = dias.length && idx >= 0 ? dias[(idx + 1) % dias.length] : 32;
      const viraMes = idx < 0 || !dias.length || proxDia <= alvo.dia;
      return viraMes ? ct.dia >= alvo.dia : (ct.dia >= alvo.dia && ct.dia < proxDia);
    });
    const faltamPrev = todasQuinzena.filter((c) => !pag[c.id]);
    const totalContasPrev = faltamPrev.reduce((a, c) => a + num(c.valor), 0);
    const faturaPaga = !!S.cartao.faturas[mk];
    const faturaVal = faturaPaga ? 0 : (S.cartao.compras.reduce((a, x) => a + num(x.valor), 0) || num(S.config.faturaEstimada));
    const faturaGuardada = faturaPaga || !!(S.checklist && S.checklist[mk] && S.checklist[mk].faturaGuardada);
    const c = calc();
    const usarContas = modo === "ativo" && caiu ? faltam : faltamPrev;
    const usarTotal = modo === "ativo" && caiu ? totalContas : totalContasPrev;
    const reservar = (caiu ? usarTotal : 0) + (faturaGuardada ? 0 : faturaVal) + (caiu ? c.metaNum : 0);
    const sobra = Math.max(0, c.caixa - reservar);
    return {
      mk, alvo, total, caiu, modo,
      faltam: usarContas, totalContas: usarTotal,
      faturaVal, faturaPaga, faturaGuardada, sobra,
      meta: c.metaNum, lazer: c.lazerRest,
    };
  }

  function barraPct(val, max) {
    if (!(max > 0) || !(val > 0)) return 0;
    return Math.min(100, Math.round((val / max) * 100));
  }

  function resumoMesDados() {
    const c = calc();
    const ini = new Date(); ini.setDate(1); ini.setHours(0, 0, 0, 0);
    const porCat = {};
    S.gastos.filter((g) => g.ts >= ini.getTime()).forEach((g) => {
      const k = g.cat || "Outro";
      porCat[k] = (porCat[k] || 0) + num(g.valor);
    });
    const ifood = porCat["iFood"] || 0;
    const mercado = porCat["Mercado"] || 0;
    const lazer = porCat["Lazer"] || 0;
    const imprevisto = porCat["Imprevisto"] || 0;
    const saiu = c.contasPagas + c.gastosMes + c.faturaPaga;
    const saldo = c.entrouMes - saiu;
    const juntadoEst = Math.max(0, saldo);
    return { c, porCat, ifood, mercado, lazer, imprevisto, saiu, saldo, juntadoEst };
  }

  // Marca início do app (1ª vez que informa saldo). Contas anteriores a isso NÃO entram como "vencidas".
  function garantirInicio() {
    if (!S.inicio && S.caixa && S.caixa.em) S.inicio = S.caixa.em;
  }

  // Conta só é "vencida" se o vencimento caiu DEPOIS do app começar (mesmo mês) ou em mês seguinte
  function contaVencida(conta, hojeDia) {
    garantirInicio();
    if (!S.inicio) return false;
    const start = new Date(S.inicio);
    const startDia = start.getDate();
    const startMk = mesKey(S.inicio);
    const mk = mesKey();
    if (mk === startMk) {
      // App começou dia 12: dia 7 NÃO é "vencido" no app — era antes
      return conta.dia >= startDia && conta.dia < hojeDia;
    }
    return conta.dia < hojeDia;
  }

  function contasPendentes() {
    const mk = mesKey();
    const pag = S.pagamentos[mk] || {};
    return S.contas.filter((c) => !pag[c.id]).slice().sort((a, b) => a.dia - b.dia || a.nome.localeCompare(b.nome));
  }

  // Última renda marcada como "Caiu" neste mês
  function rendaRecenteCaiu() {
    const mk = mesKey();
    const rec = S.recebidos[mk] || {};
    let best = null;
    S.config.rendas.forEach((r) => {
      if (!rec[r.id]) return;
      const ts = num(rec[r.id].ts);
      if (!best || ts > best.ts) best = { id: r.id, nome: r.nome, dia: r.dia, valor: num(r.valor) * (num(r.pessoas) || 1), ts };
    });
    return best;
  }

  // Contas da quinzena a partir de um dia de salário
  function contasDaQuinzenaDia(diaSalario) {
    if (diaSalario == null) return [];
    const dias = S.config.rendas.map((r) => r.dia).sort((a, b) => a - b);
    const idx = dias.indexOf(diaSalario);
    const proxDia = dias.length && idx >= 0 ? dias[(idx + 1) % dias.length] : 32;
    const viraMes = idx < 0 || !dias.length || proxDia <= diaSalario;
    return contasPendentes().filter((c) => {
      if (viraMes) return c.dia >= diaSalario;
      return c.dia >= diaSalario && c.dia < proxDia;
    });
  }

  function contasDaQuinzena(renda) {
    return contasDaQuinzenaDia(renda && renda.dia);
  }

  // Quinzena de referência pra PRIORIDADE de pagamento
  // - Se salário desta quinzena já caiu → essa quinzena
  // - Se estamos ENTRE salários (ex.: dia 12, próximo dia 15) → próxima quinzena (ainda NÃO "paga agora")
  // - Contas de quinzena anterior (dia 7) NÃO viram prioridade no dia 12
  function diaQuinzenaAtual() {
    const caiu = rendaRecenteCaiu();
    if (caiu) return caiu.dia;
    const prox = proxRenda();
    if (prox) return prox.d.getDate();
    return new Date().getDate();
  }

  // Contas pra "paga AGORA": só se o salário dessa quinzena já caiu
  function contasPagarAgora() {
    const caiu = rendaRecenteCaiu();
    if (!caiu) return [];
    return contasDaQuinzenaDia(caiu.dia);
  }

  // Contas da próxima quinzena (preview — paga quando o salário cair)
  function contasProximas() {
    const caiu = rendaRecenteCaiu();
    if (caiu) return []; // já estamos na quinzena ativa
    return contasDaQuinzenaDia(diaQuinzenaAtual());
  }

  // Atrasadas reais: venceram DEPOIS do app começar e o salário daquela quinzena já tinha caído ou a data passou no app
  function contasAtrasadasVisiveis() {
    const hoje = new Date().getDate();
    return contasPendentes().filter((c) => contaVencida(c, hoje));
  }

  function rendaMesPrevista() {
    return S.config.rendas.reduce((a, r) => a + num(r.valor) * (num(r.pessoas) || 1), 0);
  }

  function contasMesPrevistas() {
    return S.contas.reduce((a, c) => a + num(c.valor), 0);
  }

  // Meta inteligente: sobra após contas + fatura típica + lazer, guarda ~50%
  function metaSugerida() {
    const renda = rendaMesPrevista();
    const contas = contasMesPrevistas();
    const fatura = valorFaturaPendente() || num(S.config.faturaEstimada) || Math.min(num(S.config.limiteCartao) || 800, 900);
    const lazer = num(S.config.lazerMes) > 0 ? num(S.config.lazerMes) : 200;
    const sobra = renda - contas - fatura - lazer;
    if (sobra <= 0) return 0;
    return Math.max(50, Math.round((sobra * 0.5) / 50) * 50);
  }

  function metaEfetiva() {
    const m = num(S.config.metaGuardar);
    if (m > 0) return m;
    return metaSugerida();
  }

  function emergenciaMeta() {
    const m = num(S.config.emergenciaMeta);
    return m > 0 ? m : 2000;
  }
  function emergenciaGuardado() {
    return Math.max(0, num((S.emergencia || {}).guardado));
  }

  function avancarParcelasAposFatura() {
    if (!S.cartao.parcelas) S.cartao.parcelas = [];
    const next = [];
    S.cartao.parcelas.forEach((p) => {
      const rest = Math.max(0, (parseInt(p.restantes, 10) || 0) - 1);
      if (rest > 0) {
        const total = parseInt(p.total, 10) || 1;
        const parcelaNum = total - rest + 1;
        S.cartao.compras.push({
          id: uid(),
          desc: `${p.desc} (${parcelaNum}/${total})`,
          valor: num(p.valorParcela),
          ts: Date.now(),
          parcelaDe: p.id,
        });
        next.push(Object.assign({}, p, { restantes: rest }));
      }
    });
    S.cartao.parcelas = next;
  }

  function snapMesAtual() {
    const r = resumoMesDados();
    const c = r.c;
    const mk = c.mk;
    const previstoContas = S.contas.reduce((a, x) => a + num(x.valor), 0);
    return {
      ts: Date.now(),
      entrou: c.entrouMes,
      previstoRenda: c.previstoMes,
      saiu: r.saiu,
      contasPagas: c.contasPagas,
      previstoContas,
      gastos: c.gastosMes,
      fatura: c.faturaPaga,
      meta: c.metaNum,
      juntadoEst: r.juntadoEst,
      ifood: r.ifood,
      mercado: r.mercado,
      emergencia: emergenciaGuardado(),
    };
  }

  function lazerOrcamento() {
    const l = num(S.config.lazerMes);
    return l > 0 ? l : 200;
  }

  function imprevistosMes() {
    const ini = new Date(); ini.setDate(1); ini.setHours(0, 0, 0, 0);
    return S.gastos
      .filter((g) => g.ts >= ini.getTime() && g.cat === "Imprevisto")
      .reduce((a, g) => a + num(g.valor), 0);
  }

  // Resposta do chat "posso gastar..." + discernimento (ex.: entrou 400)
  function nomesQuem() {
    return {
      eu: (S.config.quemEu || "Luiz").trim() || "Luiz",
      ela: (S.config.quemEla || "Esposa").trim() || "Esposa",
    };
  }

  function aconselharCaixaVsContas(c) {
    const proximas = (!rendaRecenteCaiu() ? contasProximas() : contasPagarAgora());
    const totalP = proximas.reduce((a, x) => a + num(x.valor), 0);
    const nomes = proximas.map((x) => x.nome).join(", ") || "contas da quinzena";
    const fat = valorFaturaPendente();
    const meta = metaEfetiva();
    const lazerRest = Math.max(0, lazerOrcamento() - lazerGastoMes());
    const diaProx = c.prox ? c.prox.d.getDate() : "?";
    if (!(totalP > 0)) return null;
    if (c.caixa >= totalP + fat && fat > 0) {
      return {
        t: "ok",
        tit: "Discernimento da casa",
        txt: `Com <b>${fmt(c.caixa)}</b> (banco ${fmt(c.banco)} + cédula ${fmt(c.cedula)}) dá pra: pagar <b>${esc(nomes)}</b> (${fmt(totalP)}) <b>e</b> separar fatura (${fmt(fat)}). Sobra ~<b>${fmt(c.caixa - totalP - fat)}</b>.<br><b>Recomendação:</b> 1) separa fatura 2) paga as contas se já estiverem perto do vencimento 3) o resto = lazer ${fmt(lazerRest)} + juntar ${fmt(meta)}.`,
      };
    }
    if (c.caixa >= totalP) {
      const sobra = c.caixa - totalP;
      return {
        t: "ok",
        tit: "Discernimento da casa",
        txt: `Vocês têm <b>${fmt(c.caixa)}</b> e as contas (<b>${esc(nomes)}</b>) somam <b>${fmt(totalP)}</b> — <b>já cobrem</b>.<br><b>Não é automático “paga agora”</b>. Opções:<ol><li><b>Pagar agora</b> — se alguma vence antes do dia ${diaProx}, fica limpo. Sobra ~${fmt(sobra)}.</li><li><b>Esperar o salário dia ${diaProx}</b> — salário cobre as contas; estes ${fmt(c.caixa)} servem pra fatura${fat ? ` (~${fmt(fat)})` : ""} / meta / emergência.</li></ol><b>Sugestão:</b> se nada vence urgente, <b>espera o salário</b> e <b>não queima</b> os ${fmt(c.caixa)} em bobagem. Se já venceu ou vence amanhã, paga.`,
      };
    }
    return null;
  }

  function simularGasto(valor, c) {
    const v = Math.max(0, num(valor));
    const lazerRest = Math.max(0, lazerOrcamento() - lazerGastoMes());
    const meta = metaEfetiva();
    const caixa2 = c.caixa - v;
    const porDia2 = c.diasAte > 0 ? Math.max(0, (c.livreViver - v) / c.diasAte) : 0;
    const comeLazer = v > 0 && v <= lazerRest;
    const comeMeta = v > lazerRest;
    let t = "ok";
    let txt = `Se gastar <b>${fmt(v)}</b> agora:<ul><li>Caixa fica ~<b>${fmt(caixa2)}</b></li><li>Pode/dia ~<b>${fmt(porDia2)}</b> (antes ${fmt(Math.max(0, c.porDia))})</li>`;
    if (comeLazer) txt += `<li>Cabe no lazer (ainda ${fmt(lazerRest)})</li>`;
    else if (comeMeta) txt += `<li>Passa do lazer — come meta de juntar (${fmt(meta)})</li>`;
    if (caixa2 < 0) { t = "bad"; txt += `<li><b>Não tem saldo</b> pra isso</li>`; }
    else if (porDia2 < 10 && c.esperandoSalario) { t = "warn"; txt += `<li>Fica apertado até o próximo salário</li>`; }
    txt += `</ul>`;
    return { t, tit: `E se gastar ${fmt(v)}?`, txt, v, caixa2, porDia2 };
  }

    const nq = nomesQuem();
    const prox = contasProximas();
    const pagar = contasPagarAgora();

    }).join(" | ");
    const contasLinhas = S.contas
      .slice()
      .sort((a, b) => a.dia - b.dia)
      .map((x) => `${x.nome} dia ${x.dia}: ${fmt(x.valor)}${pag[x.id] ? " PAGA" : " aberta"}`)
      .join(" | ");
    const ini = new Date(); ini.setDate(1); ini.setHours(0, 0, 0, 0);

      .slice()
      .sort((a, b) => num(b.valor) - num(a.valor))
      .slice(0, 8)
      .map((g) => `${g.desc} (${g.cat}${g.quem ? "/" + g.quem : ""}): ${fmt(g.valor)}`)
      .join(" | ");
    const despensaFalta = S.despensa.filter((d) => d.status !== "tem").map((d) => d.nome).join(", ");
    const lista = S.lista.map((x) => x.nome).join(", ");
    const rendaMes = rendaMesPrevista();

    const fat = valorFaturaPendente() || num(S.config.faturaEstimada);
    const lazer = lazerOrcamento();

    return [

  function getAiKey() {
    try {
      const local = localStorage.getItem("nc-ai-key");
      if (local) return local;
    } catch (_) {}
    const built = window.NC_AI && window.NC_AI.apiKey;
    return built ? String(built) : "";
  }
  function setAiKey(k) {
    try {
      if (k) localStorage.setItem("nc-ai-key", k);
      else localStorage.removeItem("nc-ai-key");
    } catch (_) {}
  }

  async function perguntarIA(pergunta, c) {
    const key = getAiKey();
    const builtOn = !!(window.NC_AI && window.NC_AI.enabled && key);
    if (!(S.config.aiOn || builtOn) || !key) return null;
    const provider = S.config.aiProvider || (window.NC_AI && window.NC_AI.provider) || "groq";
    const url = provider === "openai"
      ? "https://api.openai.com/v1/chat/completions"
      : "https://api.groq.com/openai/v1/chat/completions";
    const model = provider === "openai" ? "gpt-4o-mini" : "llama-3.1-8b-instant";
    const nq = nomesQuem();
    const hist = (S.chat || []).slice(-12).map((m) => ({
      role: m.role === "eu" ? "user" : "assistant",
      content: m.role === "eu" ? String(m.txt || "") : `${m.tit ? m.tit + ". " : ""}${String(m.txt || "").replace(/<[^>]+>/g, " ")}`,
    }));
    const messages = [
      {
        role: "system",
        content: `Você é a 'Nossa Casa', assistente financeira do app do casal ${nq.eu} e ${nq.ela}. Você TEM acesso completo aos dados do projeto no bloco de contexto (salários, contas, cartão, caixa, meta, gastos, despensa). NUNCA diga que não conhece o projeto ou que não tem acesso. Cite números em R$ do contexto. Se algo não estiver no contexto, diga só esse item. Português do Brasil, curto, claro, sem jargão, didático. Não cumprimente de novo se a conversa já começou.`,
      },
      { role: "user", content: `Contexto financeiro atual:\n${contextoCasaTexto(c)}` },
      ...hist,
      { role: "user", content: pergunta },
    ];
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: "Bearer " + key },
      body: JSON.stringify({ model, temperature: 0.3, max_tokens: 450, messages }),
    });
    if (!res.ok) throw new Error("IA HTTP " + res.status);
    const data = await res.json();
    const txt = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    if (!txt) throw new Error("IA vazia");
    return String(txt).replace(/\n/g, "<br>");
  }

  function responderPergunta(pergunta, c) {
    const q = String(pergunta || "").toLowerCase().trim();
    const hoje = new Date().getDate();
    const pode = Math.max(0, c.porDia);
    const caiu = rendaRecenteCaiu();
    const vf = diaFatura();
    const meta = metaEfetiva();
    const lazerRest = Math.max(0, lazerOrcamento() - lazerGastoMes());
    const mSim = q.match(/(?:e se|simula(?:r)?|gastar|pedir|pagar)\s*(?:r\$\s*)?(\d+(?:[.,]\d+)?)/i) || q.match(/(\d+(?:[.,]\d+)?)\s*(?:reais|no ifood|de ifood)/i);

    if (mSim) return simularGasto(mSim[1], c);

    if (/entrar|entrou|caiu|aparec|receb|pix|extra|400|sobrou|dinheiro a mais|aument/.test(q) || /pagar (agora|já)|adiantar conta/.test(q)) {
      const disc = aconselharCaixaVsContas(c);
      if (disc) return disc;
    }

    if (!q || /posso gastar|quanto (posso|gastar)|gastar hoje|quanto hoje/.test(q)) {
      const disc = (!caiu && c.caixa > 100) ? aconselharCaixaVsContas(c) : null;
      if (c.caixa <= 0) {
        return { t: "bad", tit: "Posso gastar quanto hoje?", txt: `<b>Não.</b> Conta zerada. Segura até o salário do dia ${c.prox ? c.prox.d.getDate() : "?"}.` };
      }
      if (!caiu && c.prox && hoje < c.prox.d.getDate()) {
        const teto = Math.min(pode, Math.max(0, Math.floor(c.caixa / Math.max(1, c.diasAte))));
        let txt = teto > 0
          ? `<b>Só essencial:</b> no máx. <b>${fmt(teto)}</b> hoje. Salário dia ${c.prox.d.getDate()} ainda não. Lazer: ${fmt(lazerRest)}.`
          : `<b>Melhor não.</b> Têm ${fmt(c.caixa)}; salário dia ${c.prox.d.getDate()} não caiu.`;
        if (disc) txt += `<br><br>${disc.txt}`;
        return { t: disc ? "ok" : (teto > 0 ? "warn" : "bad"), tit: "Posso gastar quanto hoje?", txt };
      }
      if (pode <= 0) {
        return { t: "bad", tit: "Posso gastar quanto hoje?", txt: `<b>Não (além do lazer).</b> Reservado pra contas/fatura/meta. Lazer: <b>${fmt(lazerRest)}</b>.` };
      }
      return { t: "ok", tit: "Posso gastar quanto hoje?", txt: `<b>Sim, até ${fmt(pode)}</b>/dia. Lazer: <b>${fmt(lazerRest)}</b>. Meta: <b>${fmt(meta)}</b>.` };
    }
    if (/meta|juntar|guardar|economiz|poupar|sobrar/.test(q)) {
      const renda = rendaMesPrevista();
      const contas = contasMesPrevistas();
      const fat = valorFaturaPendente() || num(S.config.faturaEstimada) || Math.min(num(S.config.limiteCartao) || 800, 900);
      const lazer = lazerOrcamento();
      const sobra = renda - contas - fat - lazer;
      const sug = metaSugerida();
      return {
        t: "ok",
        tit: "Quanto dá pra juntar?",
        txt: `Com o que tá cadastrado no app:<br>Renda mês <b>${fmt(renda)}</b><br>− Contas <b>${fmt(contas)}</b><br>− Fatura (ciclo/estimativa) <b>${fmt(fat)}</b><br>− Lazer <b>${fmt(lazer)}</b><br>= Sobra <b>${fmt(sobra)}</b><br>Meta da casa (~metade da sobra): <b>${fmt(sug)}</b>${num(S.config.metaGuardar) > 0 ? ` · você forçou ${fmt(meta)}` : ""}.<br>Cartão aberto agora: <b>${fmt(c.comprasCiclo)}</b>. Caixa: <b>${fmt(c.caixa)}</b>.`,
      };
    }
    if (/ifood|lazer/.test(q)) {
      return { t: lazerRest > 0 ? "ok" : "bad", tit: "Lazer", txt: lazerRest > 0 ? `Pode até <b>${fmt(lazerRest)}</b> de lazer este mês.` : `Lazer acabou. Próximo gasto de lazer come a meta.` };
    }
    if (/fatura|cart[aã]o/.test(q)) {
      return { t: faturaPagaEsteMes() ? "ok" : "warn", tit: "Fatura", txt: faturaPagaEsteMes() ? "Fatura já paga." : `Vence dia <b>${vf}</b>. ${valorFaturaPendente() > 0 ? `Guarda <b>${fmt(valorFaturaPendente())}</b>.` : "Valor ainda não saiu."}` };
    }
    if (/quem (gastou|mais)|ranking|esposa|die/.test(q)) {
      const nq = nomesQuem();
      const ini = new Date(); ini.setDate(1); ini.setHours(0, 0, 0, 0);
      let eu = 0, ela = 0;
      S.gastos.filter((g) => g.ts >= ini.getTime()).forEach((g) => {
        if (g.quem === "ela") ela += num(g.valor);
        else if (g.quem === "eu") eu += num(g.valor);
      });
      return { t: "ok", tit: "Quem gastou", txt: `<b>${esc(nq.eu)}</b>: ${fmt(eu)} · <b>${esc(nq.ela)}</b>: ${fmt(ela)} este mês (só o que marcou quem).` };
    }
    const disc = aconselharCaixaVsContas(c);
    return {
      t: "ok",
      tit: "Casa respondendo",
      txt: `Hoje ${hoje}. Conta ${fmt(c.caixa)}. Pode/dia ${fmt(pode)}. Lazer ${fmt(lazerRest)}. Meta ${fmt(meta)}.${disc ? "<br><br>" + disc.txt : ""} Pergunte: "posso gastar quanto hoje?" · "e se gastar 40?" · "entrou 400, o que faço?"`,
    };
  }

  async function responderPerguntaSmart(pergunta, c) {
    try {
      const ia = await perguntarIA(pergunta, c);
      if (ia) return { t: "ok", tit: "Casa (IA)", txt: ia };
    } catch (_) {}
    return responderPergunta(pergunta, c);
  }

  function diaFatura() {
    return Math.min(31, Math.max(1, parseInt(S.config.diaVencFatura, 10) || 19));
  }

  function faturaPagaEsteMes() {
    return !!S.cartao.faturas[mesKey()];
  }

  // Valor a guardar/pagar da fatura: compras do ciclo, senão estimativa manual
  function valorFaturaPendente() {
    if (faturaPagaEsteMes()) return 0;
    const ciclo = S.cartao.compras.reduce((a, x) => a + num(x.valor), 0);
    if (ciclo > 0) return ciclo;
    return num(S.config.faturaEstimada);
  }

  function lazerGastoMes() {
    const ini = new Date(); ini.setDate(1); ini.setHours(0, 0, 0, 0);
    return S.gastos
      .filter((g) => g.ts >= ini.getTime() && (g.cat === "iFood" || g.cat === "Lazer"))
      .reduce((a, g) => a + num(g.valor), 0);
  }

  /* ─── Motor de dicas (poucas, claras, pra quem é leigo) ─── */
  function dicas(c) {
    const out = [];
    if (!S.caixa) return out;
    garantirInicio();
    const tem = S.despensa.filter((d) => d.status === "tem");
    const faltando = S.despensa.filter((d) => d.status !== "tem");
    const limite = num(S.config.limiteCartao);
    const prox = c.prox;
    const hojeDia = new Date().getDate();
    const vf = diaFatura();
    const rendaCaiu = rendaRecenteCaiu();
    const pagarAgora = contasPagarAgora();
    const proximas = contasProximas();
    const fatPaga = faturaPagaEsteMes();
    const fatValor = valorFaturaPendente();
    const lazerOrc = lazerOrcamento();
    const lazerRest = c.lazerRest != null ? c.lazerRest : Math.max(0, lazerOrcamento() - lazerGastoMes());
    const meta = c.metaNum != null ? c.metaNum : metaEfetiva();

    // chat fica no painel "Chat com a casa" — não mistura com dicas

    // 1) UMA dica principal do momento (só essa fala de quinzena)
    if (rendaCaiu && pagarAgora.length) {
      const totalQ = pagarAgora.reduce((a, x) => a + num(x.valor), 0);
      const nomes = pagarAgora.map((x) => esc(x.nome)).join(", ");
      out.push({
        t: "warn",
        tit: "O que fazer agora",
        txt: `Salário do dia <b>${rendaCaiu.dia}</b> já caiu. Paga: <b>${nomes}</b> (total ${fmt(totalQ)}). Depois guarda a fatura até dia <b>${vf}</b>. Lazer sem culpa: <b>${fmt(lazerRest)}</b>. Meta pra juntar (a casa calculou): <b>${fmt(meta)}</b>.`,
      });
    } else if (rendaCaiu && !pagarAgora.length) {
      out.push({
        t: "ok",
        tit: "Tudo certo nesta quinzena",
        txt: `Contas do salário dia <b>${rendaCaiu.dia}</b> ok. Agora: vive com calma, fatura dia <b>${vf}</b>, lazer <b>${fmt(lazerRest)}</b>, juntar <b>${fmt(meta)}</b> (automático).`,
      });
    } else if (prox) {
      const diaProx = prox.d.getDate();
      const totalP = proximas.reduce((a, x) => a + num(x.valor), 0);
      const nomes = proximas.length ? proximas.map((x) => esc(x.nome)).join(", ") : "as contas dessa quinzena";
      const disc = aconselharCaixaVsContas(c);
      if (disc && c.caixa >= totalP && totalP > 0) {
        out.push(disc);
      } else {
        out.push({
          t: "warn",
          tit: `Hoje é dia ${hojeDia} — espera o dia ${diaProx}`,
          txt: `Vocês têm <b>${fmt(c.caixa)}</b>. <b>Não</b> paga conta grande agora. No dia <b>${diaProx}</b> o salário cai e aí sim paga: <b>${nomes}</b>${totalP ? ` (${fmt(totalP)})` : ""}. Até lá: só o essencial. Lazer livre agora: <b>${fmt(lazerRest)}</b>.`,
        });
      }
    }

    // 2) Só urgências (máx. mais 2)
    if (c.caixa <= 0 && prox) {
      out.push({
        t: "bad",
        tit: "Conta quase/zerada",
        txt: `Até dia <b>${prox.d.getDate()}</b>, só o essencial. ${tem.length ? `Tem em casa: ${tem.slice(0, 4).map((x) => esc(x.nome)).join(", ")}.` : "Olha a despensa."}`,
      });
    } else if (!fatPaga && hojeDia >= vf && hojeDia <= vf + 2) {
      out.push({
        t: "bad",
        tit: `Hora da fatura (dia ${vf})`,
        txt: fatValor > 0 ? `Paga <b>${fmt(fatValor)}</b> na aba Cartão.` : `Olha o valor no app do banco/cartão e anota em Cartão.`,
      });
    } else if (c.comprasCiclo > limite) {
      out.push({ t: "bad", tit: "Cartão passou do limite", txt: `Fatura em ${fmt(c.comprasCiclo)}. Até pagar, só dinheiro.` });
    } else if (lazerRest <= 0 && lazerOrc > 0 && rendaCaiu) {
      out.push({ t: "warn", tit: "Lazer do mês acabou", txt: `Os ${fmt(lazerOrc)} de lazer acabaram. Próximo gasto de lazer come o que ia juntar.` });
    } else if (faltando.length && hojeDia >= vf - 2 && hojeDia <= vf + 1) {
      out.push({ t: "ok", tit: "Lista de compras", txt: `Falta em casa: <b>${faltando.map((x) => esc(x.nome)).join(", ")}</b>.` });
    }

    S.gatos.forEach((g) => (g.vacinas || []).forEach((va) => {
      const d = diasPara(va.proxima);
      if (d !== null && d < 0) out.push({ t: "bad", tit: `Vacina atrasada — ${esc(g.nome)}`, txt: `${esc(va.nome)} atrasada.` });
      else if (d !== null && d <= 14 && out.length < 3) out.push({ t: "warn", tit: `Vacina do ${esc(g.nome)}`, txt: `${esc(va.nome)} em ${d === 0 ? "hoje" : d + " dias"}.` });
    }));

    // Máximo 3 balões — menos confusão
    return out.slice(0, 3);
  }


  /* ═══════════════════════ RENDER ═══════════════════════ */
  function render() {
    if (!logado) return;
    try {
      if (tab === "despensa" || tab === "gatos") { casaSub = tab; tab = "casa"; }
      if (tab === "mes" || tab === "ajustes") { maisSub = tab === "ajustes" ? "ajustes" : "mes"; tab = "mais"; }

      if (tab === "hoje") v.innerHTML = viewHoje();
      else if (tab === "contas") v.innerHTML = viewContas();
      else if (tab === "cartao") v.innerHTML = viewCartao();
      else if (tab === "casa") v.innerHTML = viewCasa();
      else if (tab === "mais") v.innerHTML = viewMais();
      else v.innerHTML = viewHoje();
      maybeShowOnboard();

      console.error(e);
      const v = $("#view");
      if (v) {
        v.innerHTML = `<div class="card mt"><div class="alerta bad">Travou ao montar a tela: <b>${esc(e && e.message ? e.message : e)}</b>. Em Mais → Ajustes → Sair, entra de novo.</div>
