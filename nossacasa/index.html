    }
    const disc = aconselharCaixaVsContas(c);
    return {
      t: "ok",
      tit: "Casa respondendo",
      txt: `Hoje ${hoje}. Conta ${fmt(c.caixa)}. Pode/dia ${fmt(pode)}. Lazer ${fmt(lazerRest)}. Meta ${fmt(meta)}.${disc ? "<br><br>" + disc.txt : ""} Pergunte: "posso gastar quanto hoje?" · "e se gastar 40?" · "entrou 400, o que faço?"`,
    };
  }

  async function responderPerguntaSmart(pergunta, c) {
    try {
      const ia = await perguntarIA(pergunta, c);
      if (ia) return { t: "ok", tit: "Casa (IA)", txt: ia };
    } catch (_) {}
    return responderPergunta(pergunta, c);
  }

  function diaFatura() {
    return Math.min(31, Math.max(1, parseInt(S.config.diaVencFatura, 10) || 19));
  }

  function faturaPagaEsteMes() {
    return !!S.cartao.faturas[mesKey()];
  }

  // Valor previsto da fatura: compras · estimativa (padrão R$ 1200)
  function valorFaturaPrevista() {
    if (faturaPagaEsteMes()) return 0;
    const ciclo = (S.cartao.compras || []).reduce((a, x) => a + num(x.valor), 0);
    if (ciclo > 0) return ciclo;
    const est = num(S.config.faturaEstimada);
    return est > 0 ? est : 1200;
  }
  function faturaEstimativaEhChute() {
    return false;
  }

  function diasSalarioOrdenados() {
    return (S.config.rendas || []).map((r) => Math.round(num(r.dia))).filter((d) => d >= 1 && d <= 31).sort((a, b) => a - b);
  }
  /** Maior salário ≤ dia do vencimento; se vencimento antes do 1º salário, usa o último. */
  function salarioPagaDia(diaVenc) {
    const dias = diasSalarioOrdenados();
    if (!dias.length) return null;
    let best = null;
    for (let i = 0; i < dias.length; i++) {
      if (dias[i] <= diaVenc) best = dias[i];
    }
    return best != null ? best : dias[dias.length - 1];
  }
  function rendaDoDia(dia) {
    return (S.config.rendas || []).find((r) => Math.round(num(r.dia)) === dia) || null;
  }
  function valorRenda(r) {
    if (!r) return 0;
    return num(r.valor) * (num(r.pessoas) || 1);
  }
  /** Último Caiu do mês, senão infere pelo calendário. */
  function janelaSalarioAtiva() {
    const mk = mesKey();
    const rec = S.recebidos[mk] || {};
    let best = null;
    for (const id in rec) {
      const r = S.config.rendas.find((x) => x.id === id);
      if (!r) continue;
      const ts = num(rec[id].ts);
      if (!best || ts > best.ts) {
        best = { id: r.id, dia: Math.round(num(r.dia)), nome: r.nome, valor: valorRenda(r), ts, caiu: true };
      }
    }
    if (best) return best;
    const hoje = new Date().getDate();
    const dias = diasSalarioOrdenados();
    let last = null;
    for (let i = 0; i < dias.length; i++) if (dias[i] <= hoje) last = dias[i];
    if (last == null && dias.length) last = dias[dias.length - 1];
    if (last == null) return null;
    const r = rendaDoDia(last);
    return { id: r && r.id, dia: last, nome: (r && r.nome) || ("Salário dia " + last), valor: valorRenda(r), ts: 0, caiu: false, inferido: true };
  }
  /** Contas da quinzena do salário S até o próximo (exclusive). Último salário: S→fim + dias antes do 1º. */
  function contasDaJanela(salarioDia) {
    const dias = diasSalarioOrdenados();
    if (!dias.length) return S.contas.slice();
    const idx = dias.indexOf(salarioDia);
    const prox = idx >= 0 && idx < dias.length - 1 ? dias[idx + 1] : null;
    const primeiro = dias[0];
    return S.contas.filter((ct) => {
      const d = Math.round(num(ct.dia));
      if (prox != null) return d >= salarioDia && d < prox;
      return d >= salarioDia || d < primeiro;
    });
  }
  function faturaNaJanela(salarioDia) {
    return salarioPagaDia(diaFatura()) === salarioDia;
  }

  /** Plano por janela de salário + caixa (banco+cédula). */
  function planoDoCaixa(c) {
    const janela = janelaSalarioAtiva();
    const fat = estadoFatura();
    const fatValor = valorFaturaPrevista();
    const chute = faturaEstimativaEhChute();
    const lazerDisp = Math.max(0, num(c.lazerRest));
    const meta = Math.max(0, num(c.metaNum));
    let resto = Math.max(0, num(c.caixa));

    const contasJ = janela ? contasDaJanela(janela.dia).map((ct) => ({ ct, st: estadoConta(ct) })) : [];
    const contasPagar = contasJ.filter((x) => !x.st.pago && x.st.cobrando);
    const contasSeparar = contasJ.filter((x) => !x.st.pago && !x.st.cobrando);
    const pagarAgora = contasPagar.reduce((a, x) => a + num(x.st.valor), 0);
    const separarContas = contasSeparar.reduce((a, x) => a + num(x.st.valor), 0);
    const nomesPagar = contasPagar.map((x) => x.ct.nome).join(", ");
    const nomesSeparar = contasSeparar.map((x) => x.ct.nome + " " + dataBRFull(x.st.venc)).join(", ");

    const fatDesta = janela ? faturaNaJanela(janela.dia) : true;
    const separarFatura = fatDesta && !fat.pago ? fatValor : 0;
    const fatCobrando = fatDesta && fat.cobrando;

    const passos = [];
    const rotuloJanela = janela
      ? (janela.caiu ? ("Pós " + janela.nome) : ("Janela " + janela.nome + " (marca Caiu se já caiu)"))
      : "Sem salário cadastrado";
    const subJanela = janela
      ? ("Salário ~" + fmt(janela.valor) + " · caixa agora " + fmt(c.caixa) + " (banco " + fmt(c.banco) + " + cédula " + fmt(c.cedula) + ")")
      : ("Caixa " + fmt(c.caixa));

    if (pagarAgora > 0) {
      passos.push({
        cls: "warn",
        n: passos.length + 1,
        tit: "Pagar agora (já venceu)",
        gs: nomesPagar || "Contas da janela",
        valor: pagarAgora,
      });
      resto = Math.max(0, resto - pagarAgora);
    }

    if (separarContas > 0) {
      passos.push({
        cls: "warn",
        n: passos.length + 1,
        tit: "Separar contas desta quinzena",
        gs: nomesSeparar || "Vencem antes do próximo salário",
        valor: separarContas,
      });
      resto = Math.max(0, resto - separarContas);
    }

    if (separarFatura > 0) {
      const dias = diasAteDate(fat.venc);
      passos.push({
        cls: "warn",
        n: passos.length + 1,
        tit: fatCobrando ? "Pagar fatura do cartão" : "Separar fatura do cartão",
        gs: fmt(fatValor) + " · vence " + dataBRFull(fat.venc) + (dias >= 0 ? " · em " + dias + "d" : "") + " · salário dia " + salarioPagaDia(diaFatura()) + " · não gasta",
        valor: separarFatura,
      });
      resto = Math.max(0, resto - separarFatura);
    } else if (fat.pago) {
      passos.push({ cls: "ok", n: passos.length + 1, tit: "Fatura ok", gs: "Próxima " + dataBRFull(fat.venc), valor: 0 });
    } else if (janela && !fatDesta) {
      passos.push({
        cls: "ok",
        n: passos.length + 1,
        tit: "Fatura não é desta quinzena",
        gs: "Vence " + dataBRFull(fat.venc) + " · fica pro salário dia " + salarioPagaDia(diaFatura()),
        valor: 0,
      });
    }

    if (!passos.length) {
      passos.push({ cls: "ok", n: 1, tit: "Nada vencido nesta janela", gs: "Pode seguir guardar e lazer", valor: 0 });
    }

    // Guardar ANTES do lazer: sobra prioriza hábito no cofre
    const guardarUsa = Math.min(meta, resto);
    passos.push({
      cls: guardarUsa > 0 ? "" : "skip",
      n: passos.length + 1,
      tit: guardarUsa > 0 ? "Guardar no cofre" : "Não dá pra guardar agora",
      gs: guardarUsa > 0
        ? ("Meta " + fmt(meta) + " · cofre " + fmt(emergenciaGuardado()) + " · Mais → Mês → Guardei")
        : (meta > 0
          ? ("Deste caixa não sobra. Guarda no próximo salário. Meta do mês " + fmt(meta) + ".")
          : "Sem meta"),
      valor: guardarUsa,
      skipCheck: guardarUsa <= 0,
    });
    resto = Math.max(0, resto - guardarUsa);

    const lazerUsa = Math.min(lazerDisp, resto);
    passos.push({
      cls: lazerUsa > 0 ? "" : "skip",
      n: passos.length + 1,
      tit: "Lazer / iFood",
      gs: lazerUsa > 0
        ? ("Depois de guardar: até " + fmt(lazerUsa) + " de lazer agora. Teto do mês " + fmt(lazerDisp) + ".")
        : "Sem folga pra lazer nesta conta",
      valor: lazerUsa,
      skipCheck: lazerUsa <= 0,
    });
    resto = Math.max(0, resto - lazerUsa);

    return {
      passos,
      livre: resto,
      pagarAgora: pagarAgora + (fatCobrando ? separarFatura : 0),
      separarFatura: fatCobrando ? 0 : separarFatura,
      separarContas,
      fatValor,
      fat,
      chute,
      lazerUsa,
      guardarUsa,
      janela,
      rotuloJanela,
      subJanela,
    };
  }

  function valorFaturaPendente() {
    if (faturaPagaEsteMes()) return 0;
    const ciclo = S.cartao.compras.reduce((a, x) => a + num(x.valor), 0);
    if (ciclo > 0) return ciclo;
    return num(S.config.faturaEstimada);
  }

  function lazerGastoMes() {
    const ini = new Date(); ini.setDate(1); ini.setHours(0, 0, 0, 0);
    return S.gastos
      .filter((g) => g.ts >= ini.getTime() && (g.cat === "iFood" || g.cat === "Lazer"))
      .reduce((a, g) => a + num(g.valor), 0);
  }

  /* ─── Motor de dicas (poucas, claras, pra quem é leigo) ─── */
  function dicas(c) {
    const out = [];
    if (!S.caixa) return out;
    garantirInicio();
    const tem = S.despensa.filter((d) => d.status === "tem");
    const faltando = S.despensa.filter((d) => d.status !== "tem");
    const limite = num(S.config.limiteCartao);
    const prox = c.prox;
    const hojeDia = new Date().getDate();
    const vf = diaFatura();
    const rendaCaiu = rendaRecenteCaiu();
    const pagarAgora = contasPagarAgora();
    const proximas = contasProximas();
    const fatPaga = faturaPagaEsteMes();
    const fatValor = valorFaturaPendente();
    const lazerOrc = lazerOrcamento();
    const lazerRest = c.lazerRest != null ? c.lazerRest : Math.max(0, lazerOrcamento() - lazerGastoMes());
    const meta = c.metaNum != null ? c.metaNum : metaEfetiva();

    // chat fica no painel "Chat com a casa" — não mistura com dicas

    // 1) UMA dica principal do momento (só essa fala de quinzena)
    if (rendaCaiu && pagarAgora.length) {
      const totalQ = pagarAgora.reduce((a, x) => a + num(x.valor), 0);
      const nomes = pagarAgora.map((x) => esc(x.nome)).join(", ");
      out.push({
        t: "warn",
        tit: "O que fazer agora",
        txt: `Salário do dia <b>${rendaCaiu.dia}</b> já caiu. Paga: <b>${nomes}</b> (total ${fmt(totalQ)}). Depois guarda a fatura até dia <b>${vf}</b>. Lazer sem culpa: <b>${fmt(lazerRest)}</b>. Meta pra juntar (a casa calculou): <b>${fmt(meta)}</b>.`,
      });
    } else if (rendaCaiu && !pagarAgora.length) {
      out.push({
        t: "ok",
        tit: "Tudo certo nesta quinzena",
        txt: `Contas do salário dia <b>${rendaCaiu.dia}</b> ok. Agora: vive com calma, fatura dia <b>${vf}</b>, lazer <b>${fmt(lazerRest)}</b>, juntar <b>${fmt(meta)}</b> (automático).`,
      });
    } else if (prox) {
      const diaProx = prox.d.getDate();
      const totalP = proximas.reduce((a, x) => a + num(x.valor), 0);
      const nomes = proximas.length ? proximas.map((x) => esc(x.nome)).join(", ") : "as contas dessa quinzena";
      const disc = aconselharCaixaVsContas(c);
      if (disc && c.caixa >= totalP && totalP > 0) {
        out.push(disc);
      } else {
        out.push({
          t: "warn",
          tit: `Hoje é dia ${hojeDia} — espera o dia ${diaProx}`,
          txt: `Vocês têm <b>${fmt(c.caixa)}</b>. <b>Não</b> paga conta grande agora. No dia <b>${diaProx}</b> o salário cai e aí sim paga: <b>${nomes}</b>${totalP ? ` (${fmt(totalP)})` : ""}. Até lá: só o essencial. Lazer livre agora: <b>${fmt(lazerRest)}</b>.`,
        });
      }
    }

    // 2) Só urgências (máx. mais 2)
    if (c.caixa <= 0 && prox) {
      out.push({
        t: "bad",
        tit: "Conta quase/zerada",
        txt: `Até dia <b>${prox.d.getDate()}</b>, só o essencial. ${tem.length ? `Tem em casa: ${tem.slice(0, 4).map((x) => esc(x.nome)).join(", ")}.` : "Olha a despensa."}`,
      });
    } else if (!fatPaga && hojeDia >= vf && hojeDia <= vf + 2) {
      out.push({
        t: "bad",
        tit: `Hora da fatura (dia ${vf})`,
        txt: fatValor > 0 ? `Paga <b>${fmt(fatValor)}</b> na aba Cartão.` : `Olha o valor no app do banco/cartão e anota em Cartão.`,
      });
    } else if (c.comprasCiclo > limite) {
      out.push({ t: "bad", tit: "Cartão passou do limite", txt: `Fatura em ${fmt(c.comprasCiclo)}. Até pagar, só dinheiro.` });
    } else if (lazerRest <= 0 && lazerOrc > 0 && rendaCaiu) {
      out.push({ t: "warn", tit: "Lazer do mês acabou", txt: `Os ${fmt(lazerOrc)} de lazer acabaram. Próximo gasto de lazer come o que ia juntar.` });
    } else if (faltando.length && hojeDia >= vf - 2 && hojeDia <= vf + 1) {
      out.push({ t: "ok", tit: "Lista de compras", txt: `Falta em casa: <b>${faltando.map((x) => esc(x.nome)).join(", ")}</b>.` });
    }

    S.gatos.forEach((g) => (g.vacinas || []).forEach((va) => {
      const d = diasPara(va.proxima);
      if (d !== null && d < 0) out.push({ t: "bad", tit: `Vacina atrasada — ${esc(g.nome)}`, txt: `${esc(va.nome)} atrasada.` });
      else if (d !== null && d <= 14 && out.length < 3) out.push({ t: "warn", tit: `Vacina do ${esc(g.nome)}`, txt: `${esc(va.nome)} em ${d === 0 ? "hoje" : d + " dias"}.` });
    }));

    // Máximo 3 balões — menos confusão
    return out.slice(0, 3);
  }

        </div>`;
      })() : ""}

      <div class="potes">
        <div class="pote n1" data-genio-anchor="pagar">
          <div class="pk">1 · Pagar / separar agora</div>
          <div class="pv">${fmt(precisaAgora)}</div>
          <div class="ps">${precisaAgora > 0
            ? `Contas ${fmt((plano.pagarAgora || 0) + (plano.separarContas || 0))}${plano.separarFatura ? " · fatura " + fmt(plano.separarFatura) : ""}`
            : (pagar <= 0 ? "Nada pra separar nesta quinzena" : "Contas " + fmt(pagar))}</div>
        </div>
        <div class="pote n2" data-genio-anchor="guardar">
          <div class="pk">2 · Guardar agora</div>
          <div class="pv">${fmt(plano.guardarUsa || 0)}</div>
          <div class="ps">${(plano.guardarUsa || 0) > 0
            ? `deste caixa · meta mês ${fmt(c.metaNum)} · cofre ${fmt(emergenciaGuardado())}`
            : `não dá agora · meta mês ${fmt(c.metaNum)} · cofre ${fmt(emergenciaGuardado())}`}</div>
        </div>
        <div class="pote n3" data-genio-anchor="lazer">
          <div class="pk">3 · Lazer agora</div>
          <div class="pv">${fmt(plano.lazerUsa || 0)}</div>
          <div class="ps">depois de guardar · teto do mês ainda ${fmt(lazerTetoMes)} de ${fmt(lazerOrc)}</div>
        </div>
      </div>

      <div class="guia" data-genio-anchor="guia">
        <div class="gh">${esc(plano.rotuloJanela || "O que fazer")}</div>
        <div class="dica" style="margin:0 0 10px;">${esc(plano.subJanela || "")}</div>
        ${plano.passos.map((p) => `
          <div class="guia-step ${p.cls || ""}">
            <div class="gn">${p.cls === "ok" ? "✓" : (p.cls === "skip" || p.skipCheck ? "·" : p.n)}</div>
            <div class="grow">
              <div class="gt">${esc(p.tit)}</div>
              <div class="gs">${esc(p.gs)}</div>
            </div>
            <div class="gv">${p.valor > 0 ? fmt(p.valor) : "—"}</div>
          </div>`).join("")}
        <div class="resumo-livre">
          ${plano.livre > 0
            ? `Sobrou ${fmt(plano.livre)} depois do plano — reforça o cofre primeiro; o resto é dia a dia.`
            : `Caixa fecha no plano desta quinzena. Sem folga extra.`}
        </div>
        <div class="dica" style="margin-top:0.5rem;">Regra: conta perto do dia 7 → salário 7. Conta/fatura após o 15 → salário 15. Fatura ${plano.fat && plano.fat.pago ? "já paga" : "= " + fmt(plano.fatValor)}. Potes = o que dá pra fazer AGORA com o caixa.</div>
        <div style="display:flex; gap:8px; margin-top:12px; flex-wrap:wrap;">
          ${plano.separarFatura > 0 || (plano.pagarAgora > 0) ? `<button type="button" class="btn small" data-action="tab" data-tab="cartao">Ver fatura</button>` : ""}
          ${plano.guardarUsa > 0 ? `<button type="button" class="btn small" data-action="ir-mais" data-mais="mes">Guardei</button>` : ""}
        </div>
      </div>

      <div class="ordem-fix">Quinzena: paga/separa · guarda · lazer</div>

      <div class="acao-grid">
        <button type="button" class="acao-btn ${hojePainel === "entrou" ? "on" : ""}" data-action="hoje-painel" data-painel="entrou">
          <span class="ico">${icoPlus}</span>Entrou
        </button>
        <button type="button" class="acao-btn ${hojePainel === "gastei" ? "on" : ""}" data-action="hoje-painel" data-painel="gastei">
          <span class="ico">${icoMinus}</span>Gastei
        </button>
        <button type="button" class="acao-btn ${hojePainel === "caiu" ? "on" : ""}" data-action="hoje-painel" data-painel="caiu">
          <span class="ico">${icoCheck}</span>Caiu?
        </button>
      </div>`;

    if (hojePainel === "entrou") {
      html += `
      <form class="card mt" data-form="entrada-add">
        <label style="margin-top:0;">Quanto entrou?</label>
        <div class="dica" style="margin-top:0.2rem;">PIX, bônus, presente — não é salário. App já calcula os 3 potes.</div>
        <div class="row2">
          <div><label>Valor (R$)</label><input name="valor" inputmode="decimal" placeholder="0,00" required autofocus /></div>
          <div><label>De onde</label><input name="desc" placeholder="PIX da mãe…" required /></div>
        </div>
        <label>Onde está agora?</label>
        <select name="fonte">
          <option value="banco">Banco / PIX</option>
          <option value="cedula">Cédula (papel)</option>
        </select>
        <div class="dica">Só local do dinheiro — não escolhe pote. Ordem: pagar → lazer → guardar.</div>
        <button class="btn full" type="submit">Somar no caixa</button>
      </form>`;
    }

    if (hojePainel === "gastei") {
      html += `
      <form class="card mt" data-form="gasto">
        <label style="margin-top:0;">O que gastou?</label>
        <input name="desc" placeholder="Mercado, farmácia…" required autofocus />
        <div class="row2">
          <div><label>Valor (R$)</label><input name="valor" inputmode="decimal" placeholder="35,00" required /></div>
          <div><label>Tipo</label><select name="cat">${CATS_GASTO.map((x) => `<option>${x}</option>`).join("")}</select></div>
        </div>
        <label>Quem?</label>
        <select name="quem">
          <option value="eu">${esc(nq.eu)}</option>
          <option value="ela">${esc(nq.ela)}</option>
          <option value="casa">Juntos</option>
        </select>
        <label>Saiu de onde?</label>
        <select name="fonte">
          <option value="banco">Banco / PIX</option>
          <option value="cedula">Cédula</option>
        </select>
        <div class="dica">iFood/Lazer consome o pote 2. Resto = vida do dia a dia.</div>
        <button class="btn full" type="submit">Anotar</button>
      </form>`;
    }

    if (hojePainel === "caiu") {
      html += `<div class="sect">Salário caiu?</div><div class="card">`;
      if (!S.config.rendas.length) html += `<div class="vazio">Nenhuma renda. Ajuste em Mais → Ajustes.</div>`;
      S.config.rendas.forEach((r) => {
        const total = num(r.valor) * (num(r.pessoas) || 1);
        const got = rec[r.id];
        html += `
        <div class="item">
          <div class="grow">
            <div class="t">${esc(r.nome)} <span class="pill neu">dia ${r.dia}</span></div>
            <div class="s">${fmt(total)}</div>
          </div>
          ${got
            ? `<button class="statusbtn tem" data-action="renda-toggle" data-id="${r.id}">Caiu ✓</button>`
            : `<button class="statusbtn ${r.dia <= hojeDia ? "acabou" : ""}" data-action="renda-toggle" data-id="${r.id}">Marcar Caiu</button>`}
        </div>`;
      });
      html += `<div class="dica">Toque Caiu só quando o dinheiro aparecer no banco.</div></div>`;
    }

    if (pagar > 0) {
      html += `<div class="alerta warn" style="margin-top:var(--space-4);"><span>Falta pagar ${fmt(pagar)}. Abre a aba <b>Dívidas</b> (e Cartão se for fatura).</span></div>`;
    }

    html += `
      <div class="card mt">
        <button type="button" class="btn ghost full" style="margin-top:0;" data-action="toggle-corrigir">${showCorrigirSaldos ? "Esconder correção" : "Banco/cédula errado? Corrigir"}</button>
        ${showCorrigirSaldos ? `
        <form data-form="caixa-set" class="mt">
          <div class="dica" style="margin-top:0;">Só se o banco ou a carteira mostrar outro valor.</div>
          <div class="row2">
            <div><label>Banco</label><input name="valor" inputmode="decimal" placeholder="${String(num(S.caixa.valor)).replace(".", ",")}" required /></div>
            <div><label>Cédula</label><input name="cedula" inputmode="decimal" value="${String(num((S.cedula || {}).valor)).replace(".", ",")}" /></div>
          </div>
          <button class="btn full" type="submit">Corrigir</button>
        </form>` : ""}
      </div>`;

    const ini = new Date(); ini.setDate(1); ini.setHours(0, 0, 0, 0);
    const recentesAll = S.gastos.filter((g) => g.ts >= ini.getTime()).slice().sort((a, b) => b.ts - a.ts);
    const recentes = recentesAll.filter((g) => passaFiltroQuem(g.quem)).slice(0, 8);
    html += `<div class="sect">Gastos recentes</div><div class="card">`;
    if (!recentes.length) html += `<div class="vazio">Nenhum gasto ainda.</div>`;
    recentes.forEach((g) => {
      const quemLbl = g.quem === "ela" ? nq.ela : g.quem === "eu" ? nq.eu : (g.quem === "casa" ? "Juntos" : "");
      const fonteLbl = g.fonte === "cedula" ? "cédula" : "banco";
      html += `
        <div class="item">
          <div class="grow"><div class="t">${esc(g.desc)}</div><div class="s">${esc(g.cat)}${quemLbl ? " · " + esc(quemLbl) : ""} · ${fonteLbl}</div></div>
          <div class="val">${fmt(g.valor)}</div>
          <button class="statusbtn" data-action="gasto-del" data-id="${g.id}">✕</button>
        </div>`;
    });
    html += `</div>`;
    return html;
  }

  function viewCasa() {
    return `
      <div class="subtabs">
        <button type="button" class="${casaSub === "despensa" ? "on" : ""}" data-action="casa-sub" data-sub="despensa">Despensa</button>
        <button type="button" class="${casaSub === "gatos" ? "on" : ""}" data-action="casa-sub" data-sub="gatos">Gatos</button>
      </div>
      ${casaSub === "gatos" ? viewGatos() : viewDespensa()}`;
  }

  function viewMais() {
    return `
      <div class="subtabs">
        <button type="button" class="${maisSub === "mes" ? "on" : ""}" data-action="mais-sub" data-sub="mes">Mês</button>
        <button type="button" class="${maisSub === "casa" ? "on" : ""}" data-action="mais-sub" data-sub="casa">Casa</button>
        <button type="button" class="${maisSub === "ajustes" ? "on" : ""}" data-action="mais-sub" data-sub="ajustes">Ajustes</button>
      </div>
      ${maisSub === "ajustes" ? viewAjustes() : maisSub === "casa" ? viewCasa() : viewMes()}`;

  function viewPoupar() {
    /* Removido da UI — desafio 500/100 não compete com Dívidas/Lazer/Guardar */
    return viewMes();
  }

  function viewDesafio500() {
    const st = env500Stats();
    const feitos = env500FeitosMap();
    const pct = Math.round((st.soma / ENV500_TOTAL) * 100);
    let cells = "";
    VALORES_500.forEach((v, i) => {
      const done = !!feitos[String(i)];
      cells += `<button type="button" class="env-cell${done ? " done" : ""}" data-action="env500-toggle" data-i="${i}" title="Guardar ${fmt(v)}">${v}</button>`;
    });
    return `
      <div class="card">
        <div class="t">Tabela R$ 500</div>
        <div class="s" style="margin-top:0.35rem;">Igual a tabela de papel: toca o valor, marca. Completou tudo = <b>${fmt(ENV500_TOTAL)}</b>.</div>
        <div class="bar" style="margin-top:0.85rem;"><div class="fill lim" style="width:${barraPct(st.soma, ENV500_TOTAL)}%"></div></div>
        <div class="env-stats">
          <div><div class="k">Marcados</div><div class="v">${st.qtd}/${st.totalCells}</div></div>
          <div><div class="k">Guardado</div><div class="v">${fmt(st.soma)}</div></div>
          <div><div class="k">Falta</div><div class="v">${fmt(st.faltaRs)}</div></div>
        </div>
        <div class="dica" style="margin-top:0.6rem;">${pct}% · valores mistos (5, 10, 15, 20, 25, 50)</div>
      </div>

      <div class="sect">Marcar</div>
      <div class="card" style="padding:10px;">
        <div class="env-grid tab500">${cells}</div>
        <div class="dica" style="margin-top:0.65rem;">Toque marca / toque de novo desfaz. Só tabela — não mexe no caixa sozinho.</div>
      </div>
      ${st.soma > 0 ? `<button type="button" class="btn full" data-action="env500-emergencia">Somar ${fmt(st.soma)} na emergência</button>
        <div class="dica">Soma o total já marcado no fundo (não desmarca a tabela).</div>` : ""}`;
  }

  function viewDesafio100() {
    const st = envStats();
    const feitos = envFeitosMap();
    const pct = Math.round((st.soma / ENV100_TOTAL) * 100);
    let cells = "";
    for (let n = 1; n <= 100; n++) {
      const done = !!feitos[String(n)];
      if (envFiltro === "feitos" && !done) continue;
      if (envFiltro === "faltam" && done) continue;
      const hint = envHint === n ? " hint" : "";
      cells += `<button type="button" class="env-cell${done ? " done" : ""}${hint}" data-action="env-abrir" data-n="${n}" title="Envelope ${n} = ${fmt(n)}">${n}</button>`;
    }
    return `
      <div class="card">
        <div class="t">Desafio 100 envelopes</div>
        <div class="s" style="margin-top:0.35rem;">Guarda o valor do número (envelope 47 = R$ 47). Soma final: <b>${fmt(ENV100_TOTAL)}</b>. Ordem livre ou sorteia.</div>
        <div class="bar" style="margin-top:0.85rem;"><div class="fill lim" style="width:${barraPct(st.soma, ENV100_TOTAL)}%"></div></div>
        <div class="env-stats">
          <div><div class="k">Feitos</div><div class="v">${st.qtd}/100</div></div>
          <div><div class="k">Guardado</div><div class="v">${fmt(st.soma)}</div></div>
          <div><div class="k">Falta</div><div class="v">${fmt(st.faltaRs)}</div></div>
        </div>
        <div class="dica" style="margin-top:0.6rem;">${pct}% do desafio · ${st.falta} envelopes ainda</div>
      </div>

      <div class="row" style="display:flex; gap:8px; margin: var(--space-3) 0;">
        <button type="button" class="btn ${envFiltro === "todos" ? "" : "ghost"}" style="flex:1;" data-action="env-filtro" data-f="todos">Todos</button>
        <button type="button" class="btn ${envFiltro === "faltam" ? "" : "ghost"}" style="flex:1;" data-action="env-filtro" data-f="faltam">Faltam</button>
        <button type="button" class="btn ${envFiltro === "feitos" ? "" : "ghost"}" style="flex:1;" data-action="env-filtro" data-f="feitos">Feitos</button>
      </div>
      <button type="button" class="btn full" data-action="env-sortear" ${st.falta ? "" : "disabled"}>Sortear envelope</button>

      <div class="sect">Envelopes</div>
      <div class="card" style="padding:10px;">
        <div class="env-grid">${cells || `<div class="vazio">Nada neste filtro.</div>`}</div>
        <div class="dica" style="margin-top:0.65rem;">Toque no número pra marcar. Pode só marcar ou somar no fundo emergência.</div>
      </div>`;
  }

  function maybeShowOnboard() {
    const old = document.getElementById("onboard");
    if (old) old.remove();
    if (!logado || !S.caixa || S.config.onboardDone) return;
    const steps = [
      { t: "3 potes no Hoje", p: "1 Pagar dívidas · 2 Lazer (teto) · 3 Guardar. App calcula. Você só anota." },
      { t: "Dívidas e Cartão", p: "Aba Dívidas = contas da casa. Cartão = fatura. Casa (despensa/gatos) fica em Mais." },
      { t: "Um cofre só", p: "Quando puder guardar, Mais → Mês → Guardei. Meta do mês alimenta o cofre. Sem bingo." },
    ];
    const s = steps[Math.min(onboardStep, steps.length - 1)];
    const last = onboardStep >= steps.length - 1;
    const wrap = document.createElement("div");
    wrap.id = "onboard";
    wrap.className = "onboard";
    wrap.innerHTML = `<div class="sheet">
      <div class="pill ok" style="margin-bottom:0.6rem;">Dica ${onboardStep + 1}/${steps.length}</div>
      <h2>${s.t}</h2>
      <p>${s.p}</p>
      <button class="btn full" type="button" data-action="onboard-next">${last ? "Entendi, bora" : "Próximo"}</button>
      <button class="softlink" type="button" data-action="onboard-skip">Pular</button>
    </div>`;
    document.body.appendChild(wrap);
  }

  /* ─── Mês (histórico) ─── */
  function viewMes() {
    const r = resumoMesDados();
    const c = r.c;
    const mk = c.mk;
    const maxBar = Math.max(c.entrouMes, r.saiu, 1);
    const meta = c.metaNum;
    const metaPct = barraPct(r.juntadoEst, meta || 1);
    const pag = S.pagamentos[mk] || {};
    const rec = S.recebidos[mk] || {};
    const ini = new Date(); ini.setDate(1); ini.setHours(0, 0, 0, 0);
    const gastosMes = S.gastos.filter((g) => g.ts >= ini.getTime()).slice().sort((a, b) => b.ts - a.ts);

    let detalhePago = "";
    const nqMes = nomesQuem();
    for (const id in pag) {
      const ct = S.contas.find((x) => x.id === id);
      const nome = ct ? ct.nome : "Conta antiga (apagada)";
      const quemP = pag[id].quem === "ela" ? nqMes.ela : pag[id].quem === "eu" ? nqMes.eu : "";
      if (!passaFiltroQuem(pag[id].quem || "casa")) continue;
      detalhePago += `<div class="item"><div class="grow"><div class="t">${esc(nome)}</div><div class="s">pago ${dataBR(pag[id].ts)}${quemP ? " · " + esc(quemP) : ""}</div></div><div class="val">${fmt(pag[id].valor)}</div></div>`;
    }
    let detalheEntrou = "";
    for (const id in rec) {
      const rd = S.config.rendas.find((x) => x.id === id);
      const nome = rd ? rd.nome : "Renda";
      detalheEntrou += `<div class="item"><div class="grow"><div class="t">${esc(nome)}</div><div class="s">caiu ${dataBR(rec[id].ts)}</div></div><div class="val">${fmt(rec[id].valor)}</div></div>`;
    }
    let detalheGastos = "";
    gastosMes.filter((g) => passaFiltroQuem(g.quem)).forEach((g) => {
      const quemLbl = g.quem === "ela" ? nqMes.ela : g.quem === "eu" ? nqMes.eu : (g.quem === "casa" ? "Casa" : "");
      detalheGastos += `<div class="item"><div class="grow"><div class="t">${esc(g.desc)}</div><div class="s">${esc(g.cat)}${quemLbl ? " · " + esc(quemLbl) : ""} · ${dataBR(g.ts)}</div></div><div class="val">${fmt(g.valor)}</div></div>`;
    });

    let html = `
      <div class="hero ${r.saldo >= 0 ? "verde" : "vermelho"}">
        <div class="k">Este mês · ${esc(mesNome())}</div>
        <div class="v">${fmt(r.saldo)}</div>
        <div class="sub">Entrou ${fmt(c.entrouMes)} · saiu ${fmt(r.saiu)} (contas + dinheiro + fatura paga)</div>
      </div>

      <div class="sect">Ver por pessoa</div>
      <div class="card">${htmlFiltroQuem()}<div class="dica" style="margin-top:0;">Filtra gastos e contas pagas abaixo.</div></div>

      <div class="sect">Fluxo</div>
      <div class="card">
        <div class="bar-legend"><span>Entrou</span><span>${fmt(c.entrouMes)} / previsto ${fmt(c.previstoMes)}</span></div>
        <div class="hbar"><i style="width:${barraPct(c.entrouMes, c.previstoMes || maxBar)}%"></i></div>
        <div class="bar-legend"><span>Saiu</span><span>${fmt(r.saiu)}</span></div>
        <div class="hbar alt"><i style="width:${barraPct(r.saiu, maxBar)}%"></i></div>
        <div class="bar-legend"><span>Contas pagas</span><span>${fmt(c.contasPagas)}</span></div>
        <div class="hbar"><i style="width:${barraPct(c.contasPagas, maxBar)}%"></i></div>
        <div class="bar-legend"><span>Gastos no dinheiro</span><span>${fmt(c.gastosMes)}</span></div>
        <div class="hbar"><i style="width:${barraPct(c.gastosMes, maxBar)}%"></i></div>
        <div class="bar-legend"><span>Fatura paga</span><span>${fmt(c.faturaPaga)}</span></div>
        <div class="hbar"><i style="width:${barraPct(c.faturaPaga, maxBar)}%"></i></div>
        <div class="bar-legend"><span>Cartão aberto (ciclo)</span><span>${fmt(c.comprasCiclo)}</span></div>
        <div class="hbar bad"><i style="width:${barraPct(c.comprasCiclo, maxBar)}%"></i></div>
      </div>

      <div class="sect">De onde veio o número</div>
      <div class="card">
        <div class="t" style="margin-bottom:0.4rem;">Entrou</div>
        ${detalheEntrou || `<div class="vazio">Nenhum salário marcado.</div>`}
        <div class="t" style="margin:0.8rem 0 0.4rem;">Contas pagas</div>
        ${detalhePago || `<div class="vazio">Nenhuma conta paga.</div>`}
        <div class="t" style="margin:0.8rem 0 0.4rem;">Gastos no dinheiro</div>
        ${detalheGastos || `<div class="vazio">Nenhum gasto.</div>`}
        ${c.faturaPaga ? `<div class="t" style="margin:0.8rem 0 0.4rem;">Fatura</div><div class="item"><div class="grow"><div class="t">Fatura paga</div></div><div class="val">${fmt(c.faturaPaga)}</div></div>` : ""}
      </div>

      <div class="sect">Onde o dinheiro foi</div>
      <div class="card">
        <div class="bar-legend"><span>iFood</span><span>${fmt(r.ifood)}</span></div>
        <div class="hbar alt"><i style="width:${barraPct(r.ifood, Math.max(c.gastosMes, 1))}%"></i></div>
        <div class="bar-legend"><span>Mercado</span><span>${fmt(r.mercado)}</span></div>
        <div class="hbar"><i style="width:${barraPct(r.mercado, Math.max(c.gastosMes, 1))}%"></i></div>
        <div class="bar-legend"><span>Lazer</span><span>${fmt(r.lazer)}</span></div>
        <div class="hbar"><i style="width:${barraPct(r.lazer, Math.max(c.gastosMes, 1))}%"></i></div>
        <div class="bar-legend"><span>Imprevisto</span><span>${fmt(r.imprevisto)}</span></div>
        <div class="hbar bad"><i style="width:${barraPct(r.imprevisto, Math.max(c.gastosMes, 1))}%"></i></div>
        ${Object.keys(r.porCat).filter((k) => !["iFood", "Mercado", "Lazer", "Imprevisto"].includes(k)).map((k) => `
          <div class="bar-legend"><span>${esc(k)}</span><span>${fmt(r.porCat[k])}</span></div>
          <div class="hbar"><i style="width:${barraPct(r.porCat[k], Math.max(c.gastosMes, 1))}%"></i></div>
        `).join("")}
        ${!c.gastosMes ? `<div class="vazio">Nenhum gasto no dinheiro este mês.</div>` : ""}
      </div>

      <div class="sect">Guardar (um cofre só)</div>
      <div class="card">
        <div class="bar-legend"><span>Meta deste mês</span><span>${fmt(meta)}</span></div>
        <div class="bar"><div class="fill lim" style="width:${meta > 0 ? metaPct : 0}%"></div></div>
        <div class="bar-legend"><span>Sobra estimada</span><span>${fmt(r.juntadoEst)}</span></div>
        <div class="bar" style="margin-top:0.85rem;"><div class="fill lim" style="width:${barraPct(emergenciaGuardado(), emergenciaMeta())}%"></div></div>
        <div class="bar-legend"><span>Cofre</span><span>${fmt(emergenciaGuardado())} / ${fmt(emergenciaMeta())}</span></div>
        <form class="buyrow mt" data-form="emergencia-add" data-genio-anchor="cofre" style="grid-template-columns: 1fr auto;">
          <input name="valor" inputmode="decimal" placeholder="Quanto guardou" required />
          <button class="btn small" type="submit">Guardei</button>
        </form>
        ${emergenciaGuardado() > 0 ? `<button type="button" class="btn ghost full" data-action="cofre-reset" style="margin-top:10px;">Zerar cofre</button>` : ""}
        <div class="dica">Ordem: 1) pagar dívidas 2) lazer no teto 3) Guardei → soma no cofre. Sem segundo pote.</div>
      </div>

      <div class="sect">Previsto × real (contas)</div>
      <div class="card">`;
    const previstoContas = S.contas.reduce((a, x) => a + num(x.valor), 0);
    S.contas.slice().sort((a, b) => a.dia - b.dia).forEach((x) => {
      const p = pag[x.id];
      const delta = p ? num(p.valor) - num(x.valor) : null;
      html += `
        <div class="item">
          <div class="grow">
            <div class="t">${esc(x.nome)} <span class="pill neu">dia ${x.dia}</span></div>
            <div class="s">previsto ${fmt(x.valor)}${p ? ` · pago ${fmt(p.valor)}${delta ? ` (${delta > 0 ? "+" : ""}${fmt(delta)})` : ""}` : " · ainda não"}</div>
          </div>
          <div class="val">${p ? fmt(p.valor) : "—"}</div>
        </div>`;
    });
    html += `
        <div class="bar-legend" style="margin-top:0.5rem;"><span>Previsto total</span><span>${fmt(previstoContas)}</span></div>
        <div class="bar-legend"><span>Pago total</span><span>${fmt(c.contasPagas)}</span></div>
      </div>`;

    const fechado = S.mesesFechados && S.mesesFechados[mk];
    html += `
      <div class="sect">Fechar mês</div>
      <div class="card">
        ${fechado ? `
          <div class="alerta ok" style="margin-bottom:0.7rem;"><span>Mês fechado em ${dataBR(fechado.ts)}. Foto do fechamento salva.</span></div>
          <div class="bar-legend"><span>Renda</span><span>${fmt(fechado.entrou)} / prev ${fmt(fechado.previstoRenda)}</span></div>
          <div class="bar-legend"><span>Contas</span><span>${fmt(fechado.contasPagas)} / prev ${fmt(fechado.previstoContas)}</span></div>
          <div class="bar-legend"><span>Gastos + fatura</span><span>${fmt((fechado.gastos || 0) + (fechado.fatura || 0))}</span></div>
          <div class="bar-legend"><span>Sobra est.</span><span>${fmt(fechado.juntadoEst)} (meta ${fmt(fechado.meta)})</span></div>
          <button class="btn ghost full" data-action="mes-reabrir">Reabrir mês</button>
        ` : `
          <div class="s" style="margin-bottom:0.7rem;">Trava um resumo deste mês (previsto × real). Continua podendo anotar depois; o fechamento é a foto.</div>
          <button class="btn full" data-action="mes-fechar">Fechar ${esc(mesNome())}</button>
        `}
      </div>`;

    const histKeys = mesesFechadosLista();
    if (histKeys.length) {
      if (!histCmpA || !S.mesesFechados[histCmpA]) histCmpA = histKeys[0] || "";
      if (!histCmpB || !S.mesesFechados[histCmpB]) histCmpB = histKeys[1] || histKeys[0] || "";
      html += `
      <div class="sect">Histórico fechados <span class="mini">${histKeys.length}</span></div>
      <div class="card">`;
      histKeys.slice(0, 8).forEach((k) => {
        const s = S.mesesFechados[k];
        html += `<div class="item">
          <div class="grow">
            <div class="t">${esc(mesNomeDe(k))}${k === mk ? ' <span class="pill ok">atual</span>' : ""}</div>
            <div class="s">entrou ${fmt(s.entrou)} · saiu ${fmt(s.saiu)} · sobra ${fmt(s.juntadoEst)}</div>
          </div>
          <div class="val">${fmt(s.juntadoEst)}</div>
        </div>`;
      });
      html += `
        <div class="sect" style="margin:0.8rem 0 0.4rem;">Comparar dois meses</div>
        <form data-form="hist-cmp">
          <div class="row2">
            <div><label>Mês A</label><select name="a">${histKeys.map((k) => `<option value="${k}" ${k === histCmpA ? "selected" : ""}>${esc(mesNomeDe(k))}</option>`).join("")}</select></div>
            <div><label>Mês B</label><select name="b">${histKeys.map((k) => `<option value="${k}" ${k === histCmpB ? "selected" : ""}>${esc(mesNomeDe(k))}</option>`).join("")}</select></div>
          </div>
          <button class="btn full" type="submit">Atualizar comparação</button>
        </form>`;
      const a = S.mesesFechados[histCmpA];
      const b = S.mesesFechados[histCmpB];
      if (a && b) {
        const row = (label, va, vb) => {
          const max = Math.max(num(va), num(vb), 1);
          return `<div class="bar-legend"><span>${esc(label)}</span><span>${fmt(va)} vs ${fmt(vb)}</span></div>
            <div class="hbar"><i style="width:${barraPct(va, max)}%"></i></div>
            <div class="hbar alt"><i style="width:${barraPct(vb, max)}%"></i></div>`;
        };
        html += `<div class="dica">${esc(mesNomeDe(histCmpA))} (barra) vs ${esc(mesNomeDe(histCmpB))} (barra clara)</div>
          ${row("Entrou", a.entrou, b.entrou)}
          ${row("Saiu", a.saiu, b.saiu)}
          ${row("Gastos", a.gastos, b.gastos)}
          ${row("iFood", a.ifood, b.ifood)}
          ${row("Sobra", a.juntadoEst, b.juntadoEst)}`;
      }
      html += `</div>`;
    }

    html += `
      <div class="sect">Limpar / exportar</div>
      <div class="card">
        <div class="s" style="margin-bottom:0.7rem;">Apaga só os lançamentos de <b>${esc(mesNome())}</b>: salários marcados, contas pagas, gastos no dinheiro e fatura paga do mês. Contas cadastradas, despensa, gatos e saldo do banco <b>ficam</b>.</div>
        <button class="btn ghost full" data-action="exportar-mes">Baixar resumo do mês (.txt)</button>
        <button class="btn danger full" data-action="limpar-mes">Limpar lançamentos deste mês</button>
      </div>`;
    return html;
  }

  /* ─── Contas ─── */
  function viewContas() {
    const c = calc();
    const cobrando = contasCobrandoAgora();
    const totalCobra = cobrando.reduce((a, x) => a + num(x.st.valor), 0);
    const fatSt = estadoFatura();
    const lista = S.contas
      .map((ct) => ({ ct, st: estadoConta(ct) }))
      .sort((a, b) => a.st.venc - b.st.venc || a.ct.nome.localeCompare(b.ct.nome));
    const pagoMes = lista.filter((x) => x.st.pago).length;
    const pct = lista.length ? Math.min(100, (pagoMes / lista.length) * 100) : 0;

    let html = `
      <div class="sect">Dívidas da casa <span class="mini">${esc(mesNome())}</span></div>
      <div class="card resumo-card" data-genio-anchor="dividas">
        <div class="resumo-label">Cobrando agora</div>
        <div class="resumo-valor">${fmt(totalCobra + (fatSt.cobrando ? fatSt.valor : 0))}</div>
        <div class="resumo-meta">Só o que já venceu ou vence hoje${fatSt.cobrando ? " · fatura inclusa" : ""}</div>
        <div class="bar"><div class="fill lim" style="width:${pct}%"></div></div>
        <div class="bar-legend"><span>${pagoMes}/${lista.length} contas do ciclo</span><span>${fmt(Math.max(0, num(c.contasProximas)))} ainda não venceu</span></div>
      </div>
      <div class="card">`;

    if (!S.contas.length) {
      html += `<div class="vazio">Nenhuma conta cadastrada.<br>Adicione a primeira conta fixa pra começar.</div>`;
    }
    const nqC = nomesQuem();
    lista.forEach(({ ct: x, st }) => {
      const p = (S.pagamentos[st.mk] || {})[x.id] || (st.pago ? (S.pagamentos[mesKey()] || {})[x.id] : null);
      const quemLbl = p && p.quem === "ela" ? nqC.ela : p && p.quem === "eu" ? nqC.eu : "";
      const openMenu = menuContaId === x.id;
      const dias = diasAteDate(st.venc);
      let statusTxt = "";
      if (st.pago) statusTxt = `Paga · próxima ${dataBRFull(st.venc)}`;
      else if (st.status === "atrasada") statusTxt = `Atrasada desde ${dataBRFull(st.venc)}`;
      else if (st.status === "hoje") statusTxt = `Vence hoje · ${dataBRFull(st.venc)}`;
      else statusTxt = `Próxima cobrança ${dataBRFull(st.venc)}${dias > 0 ? " · em " + dias + "d" : ""}`;
      const pill = st.cobrando
        ? (st.status === "atrasada" ? `<span class="pill bad">Pagar</span>` : `<span class="pill warn">Hoje</span>`)
        : (st.pago ? `<span class="pill ok">OK</span>` : `<span class="pill neu">Depois</span>`);
      html += `
        <div class="conta-row">
          <div class="grow">
            <div class="t">${esc(x.nome)} ${pill}</div>
            <div class="s">${statusTxt}${quemLbl && st.pago ? " · " + esc(quemLbl) : ""} · todo dia ${x.dia}</div>
            <div class="val">${fmt(st.valor)}</div>
          </div>
          <div class="conta-actions">
            ${st.pago && !st.cobrando
              ? `<button class="statusbtn tem" data-action="conta-desfazer" data-id="${x.id}" data-mk="${esc(st.mkPago || mesKey())}">Pago ✓</button>`
              : st.cobrando
                ? `<button class="btn small" data-action="conta-pagar" data-id="${x.id}">Pagar</button>`
                : `<button class="btn small ghost" data-action="conta-pagar" data-id="${x.id}" title="Adiantar">Adiantar</button>`}
            <button type="button" class="icon-more" data-action="conta-menu" data-id="${x.id}" aria-label="Mais opções">⋮</button>
          </div>
        </div>`;
      if (openMenu) {
        html += `<div class="menu-sheet" style="padding-bottom:8px;">
          <button class="btn ghost full" style="margin-top:0;" data-action="conta-edit" data-id="${x.id}">Editar valor / dia fixo</button>
          <button class="btn danger full" style="margin-top:0;" data-action="conta-del" data-id="${x.id}">Excluir conta</button>
          <button class="btn ghost full" style="margin-top:0;" data-action="conta-menu-close">Fechar</button>
        </div>`;
      }
      if (pagandoId === x.id) {
        html += `
        <form class="card" data-form="conta-paga" data-id="${x.id}" data-mk="${esc(st.mk)}" style="margin:0 0 12px; box-shadow:none; border-style:dashed;">
          <label style="margin-top:0;">Valor real · cobrança ${dataBRFull(st.venc)}</label>
          <input name="valor" inputmode="decimal" value="${String(num(x.valor)).replace(".", ",")}" required />
          <label>Quem pagou?</label>
          <select name="quem">
            <option value="eu">${esc(nqC.eu)}</option>
            <option value="ela">${esc(nqC.ela)}</option>
            <option value="casa">Juntos</option>
          </select>
          <button class="btn full" type="submit">Confirmar pagamento</button>
          <div class="dica">Depois de pagar, próxima data vira sozinha o dia ${x.dia} do mês seguinte.</div>
        </form>`;
      }
    });
    if (fatSt.valor > 0 || fatSt.cobrando || fatSt.pago) {
      html += `
        <div class="conta-row" style="border-top:1px dashed var(--line); margin-top:8px; padding-top:12px;">
          <div class="grow">
            <div class="t">Fatura cartão ${fatSt.cobrando ? `<span class="pill bad">Pagar</span>` : fatSt.pago ? `<span class="pill ok">OK</span>` : `<span class="pill warn">Separar</span>`}</div>
            <div class="s">${fatSt.pago ? "Paga · próxima " + dataBRFull(fatSt.venc) : (fatSt.cobrando ? "Vence " : "Separar até ") + dataBRFull(fatSt.venc)} · todo dia ${S.config.diaVencFatura || 19}${faturaEstimativaEhChute() && !fatSt.pago ? " · chute" : ""}</div>
            <div class="val">${fmt(fatSt.valor)}</div>
          </div>
          <div class="conta-actions">
            <button class="btn small ghost" data-action="tab" data-tab="cartao">Abrir</button>
          </div>
        </div>`;
    }
    html += `</div>`;

    if (!showNovaConta) {
      html += `<button type="button" class="add-trigger" data-action="toggle-nova-conta">+ Nova conta fixa</button>`;
    } else {
      html += `
      <form class="card mt" data-form="conta-add">
        <label style="margin-top:0;">Nome da conta</label>
        <input name="nome" placeholder="Água, gás…" required autofocus />
        <div class="row2">
          <div><label>Valor (R$)</label><input name="valor" inputmode="decimal" placeholder="100,00" required /></div>
          <div><label>Dia do vencimento</label><input name="dia" type="number" min="1" max="31" value="7" required /></div>
        </div>
        <div class="dica">Dia fixo todo mês. App mostra a data cheia e só cobra quando chega o dia. Depois de pagar, pula pro mês seguinte sozinho.</div>
        <button class="btn full" type="submit">Salvar conta</button>
        <button type="button" class="softlink" data-action="toggle-nova-conta">Cancelar</button>
      </form>`;
    }
    return html;
  }

  /* ─── Cartão ─── */
  function viewCartao() {
    const c = calc();
    const mk = c.mk;
    const limite = num(S.config.limiteCartao) || 1200;
    const reserva = Math.max(0, num(S.config.reservaCartao));
    const teto = limite + reserva;
    const total = c.comprasCiclo;
    const fatura = S.cartao.faturas[mk];
    const fatSt = estadoFatura();
    const prev = valorFaturaPrevista();

    const baseTeto = Math.max(teto, 1);
    const pctLim = Math.min(total, limite) / baseTeto * 100;
    const pctRes = reserva > 0 ? Math.max(0, Math.min(total - limite, reserva)) / baseTeto * 100 : 0;
    const pctOver = Math.max(0, total - teto) / baseTeto * 100;

    let html = `
      <div class="sect">Fatura atual <span class="mini">vence ${dataBRFull(fatSt.venc)}</span></div>
      <div class="card fatura-hero" data-genio-anchor="fatura">
        <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:12px;">
          <div>
            <div class="fh-val">${fmt(total > 0 ? total : prev)}</div>
            <div class="fh-meta">${fatura ? "Fatura paga neste mês" : (total > 0 ? "Ciclo aberto · compras lançadas" : "Fatura R$ 1.200 · separar do caixa")}</div>
          </div>
          ${fatura ? `<span class="pill ok">Paga</span>` : fatSt.cobrando ? `<span class="pill bad">Pagar</span>` : total > teto ? `<span class="pill bad">Estourou</span>` : `<span class="pill warn">Separar</span>`}
        </div>
        ${!fatura ? `<div class="alerta warn" style="margin:12px 0 0;"><span><b>Separa ${fmt(prev)}</b> do caixa até ${dataBRFull(fatSt.venc)}. Não gasta essa grana.</span></div>` : ""}
        <div class="bar">
          <div class="fill lim" style="width:${pctLim}%"></div>
          ${reserva > 0 ? `<div class="fill res" style="width:${pctRes}%"></div>` : ""}
          <div class="fill over" style="width:${Math.min(pctOver, 100 - pctLim - pctRes)}%"></div>
        </div>
        <div class="bar-legend"><span>${fmt(total)} usado</span><span>${fmt(teto)} limite</span></div>
        <div class="fatura-stats" style="grid-template-columns:${reserva > 0 ? "1fr 1fr 1fr" : "1fr 1fr"};">
          <div><div class="k">Limite</div><div class="v">${fmt(limite)}</div></div>
          ${reserva > 0 ? `<div><div class="k">Reserva</div><div class="v">${fmt(reserva)}</div></div>` : ""}
          <div><div class="k">Utilizado</div><div class="v">${fmt(total)}</div></div>
        </div>
        ${!fatura ? `
        <form data-form="fatura-paga-valor" class="mt">
          <label>Valor da fatura (R$)</label>
          <input name="valor" inputmode="decimal" value="${String((total > 0 ? total : prev)).replace(".", ",")}" placeholder="0,00" required />
          <button class="btn full" type="submit">Pagar fatura e zerar ciclo</button>
          <div class="dica">Confirma o valor e zera as compras deste ciclo. Parcelas futuras entram depois.</div>
        </form>
        <form data-form="cfg-fatura-est" class="mt" style="border-top:1px dashed var(--line); padding-top:12px;">
          <label>Valor fixo da fatura (pra separar no plano)</label>
          <div class="buyrow" style="grid-template-columns:1fr auto;">
            <input name="faturaEst" inputmode="decimal" value="${num(S.config.faturaEstimada) > 0 ? String(num(S.config.faturaEstimada)).replace(".", ",") : "1200"}" placeholder="1200" />
            <button class="btn small" type="submit">Salvar</button>
          </div>
        </form>` : `<div class="dica">Fatura de ${esc(mesNome())} paga (${fmt(fatura.valor)}). Compras novas entram na próxima.</div>`}
      </div>

      <div class="sect">Comprei no cartão</div>
      <form class="card" data-form="compra">
        <label style="margin-top:0;">Descrição</label>
        <input name="desc" placeholder="Mercado, remédio…" required />
        <div class="row2">
          <div>
            <label>Valor total (R$)</label>
            <input name="valor" inputmode="decimal" placeholder="300,00" required />
          </div>
          <div>
            <label>Parcelas</label>
            <input name="parcelas" type="number" min="1" max="24" value="1" />
          </div>
        </div>
        <button class="btn full" type="submit">Lançar no cartão</button>
        <div class="dica">Ex.: R$ 300 em 3× → R$ 100 nesta fatura; o resto cai depois.</div>
      </form>

      <div class="sect">Compras do ciclo</div>
      <div class="card">`;

    const lista = S.cartao.compras.slice().sort((a, b) => b.ts - a.ts);
    if (!lista.length) html += `<div class="vazio">Nenhuma compra neste ciclo.<br>Cartão zerado — ótimo.</div>`;
    lista.forEach((x) => {
      html += `
        <div class="item">
          <div class="grow"><div class="t">${esc(x.desc)}</div><div class="s">${dataBR(x.ts)}</div></div>
          <div class="val">${fmt(x.valor)}</div>
          <button class="icon-more" data-action="compra-del" data-id="${x.id}" aria-label="Remover compra" title="Remover">×</button>
        </div>`;
    });
    html += `</div>`;

    const fut = (S.cartao.parcelas || []).slice();
    if (fut.length) {
      html += `<div class="sect">Parcelas futuras</div><div class="card">`;
      fut.forEach((p) => {
        html += `
          <div class="item">
            <div class="grow">
              <div class="t">${esc(p.desc)}</div>
              <div class="s">${p.restantes}× de ${fmt(p.valorParcela)} (total ${p.total}× · ${fmt(p.valorTotal)})</div>
            </div>
            <div class="val">${fmt(num(p.valorParcela) * num(p.restantes))}</div>
          </div>`;
      });
      html += `<div class="dica">Entram sozinhas no ciclo depois que vocês pagam a fatura.</div></div>`;
    }

    const pags = Object.keys(S.cartao.faturas).sort().reverse().slice(0, 4);
    if (pags.length) {
      html += `<div class="sect">Faturas pagas</div><div class="card">`;
      pags.forEach((k) => {
        const f = S.cartao.faturas[k];
        const [y, m] = k.split("-");
        const nome = new Date(y, m - 1, 1).toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
        html += `<div class="item"><div class="grow"><div class="t">${esc(nome)}</div></div><div class="val">${fmt(f.valor)}</div></div>`;
      });
      html += `</div>`;
    }
    return html;
  }

  /* ─── Despensa ─── */
  function viewDespensa() {
    let html = `
      <div class="sect">Lista de compras <span class="mini">usar o cartão dos R$ 1.200</span></div>
      <div class="card">`;
    if (!S.lista.length) html += `<div class="vazio">Lista vazia. Ao marcar algo como "acabando" ou "acabou", ele aparece aqui.</div>`;
    S.lista.forEach((it) => {
      const dep = S.despensa.find((d) => d.nome.toLowerCase() === it.nome.toLowerCase());
      const dm = dep ? duracaoMedia(dep) : null;
      const dica = dm ? `dura ~${Math.round(dm)}d/un · leva ${Math.max(1, Math.ceil(30 / dm))}` : "";
      html += `
        <form class="buyrow" data-form="lista-comprar" data-id="${it.id}">
          <div class="nome">${esc(it.nome)}<span class="s">${esc([it.cat, dica].filter(Boolean).join(" · "))}</span></div>
          <input name="qtd" type="number" min="1" step="1" value="1" title="Quantidade" required />
          <input name="valor" inputmode="decimal" placeholder="R$ total" title="Quanto custou" required />
          <button class="btn small" type="submit" data-pago="cartao">Cartão</button>
          <button class="btn small ghost" type="submit" data-pago="dinheiro">Dinheiro</button>
        </form>`;
    });
    html += `
        <form class="buyrow" data-form="lista-add" style="border-top:1px dashed var(--line); margin-top:0.3rem;">
          <div class="nome"><input name="nome" placeholder="Adicionar à lista…" required style="border:none; padding:0; font-weight:800;" /></div>
          <span></span>
          <span></span>
          <button class="btn small" type="submit">Add</button>
          <span></span>
        </form>
      </div>

      <div class="sect">Tem em casa <span class="mini">toque no status p/ mudar</span></div>
      <div class="card">`;

  function closeModal() {
    $("#modalbk").hidden = true;
    $("#modal").innerHTML = "";
  }

  const A = {
    "tab": (el) => {
      tab = el.dataset.tab;
      if (tab === "casa" && el.dataset.sub) casaSub = el.dataset.sub;
      if (tab === "mais" && el.dataset.mais) maisSub = el.dataset.mais;
      hojePainel = null;
      closeModal();
      render();
      window.scrollTo(0, 0);
    },
    "genio-toggle": () => {
      if (genioUI.open) {
        genioUI.open = false;
        paintGenio();
        return;
      }
      if (genioUI.tip && !genioUI.tip.ephemeral) {
        genioUI.open = true;
        paintGenio();
        return;
      }
      tickGenio(true);
    },
    "genio-dismiss": () => {
      const tip = genioUI.tip;
      if (tip && tip.chave && !tip.skipVisto) genioMarcar(tip.chave);
      if (tip && tip.coach) {
        genioCoach = null;
      }
      genioUI.open = false;
      genioUI.tip = null;
      genioHighlight = null;
      paintGenio();
      scheduleGenio();
    },
    "genio-ir": () => {
      const tip = genioUI.tip;
      if (!tip) return;
      if (tip.chave && !tip.skipVisto) genioMarcar(tip.chave);

      if (tip.action === "guardar" && num(tip.valor) > 0) {
        const antes = emergenciaGuardado();
        const v = registrarAporte(tip.valor, "genio-coach");
        genioCelebrarAporte(v, antes);
        saveLocal();
        if (logado && NCCloud.configured()) {
          clearTimeout(saveTimer);
          saveTimer = setTimeout(cloudSave, 900);
        }
        genioNavegarTip(Object.assign({}, tip, {
          highlight: {
            anchor: "cofre",
            tit: "Vitória no cofre",
            txt: "+" + fmt(v) + " · total " + fmt(emergenciaGuardado()) + ". Hoje só celebra.",
          },
        }));
        return;
      }

      if (tip.coachNext || (tip.coach && tip.tipo !== "coach-guardar")) {
        genioNavegarTip(tip);
        setTimeout(() => genioAvancarCoach(), 220);
        return;
      }

      genioUI.open = false;
      if (!tip.ephemeral) genioUI.tip = null;
      genioNavegarTip(tip);
    },
    "genio-hl-close": () => {
      genioHighlight = null;
      document.querySelectorAll(".genio-callout").forEach((n) => n.remove());
      document.querySelectorAll(".genio-hl").forEach((n) => n.classList.remove("genio-hl"));
    },
    "ir-mais": (el) => {
      tab = "mais";
      maisSub = el.dataset.mais || "ajustes";
      closeModal();
      render();
      window.scrollTo(0, 0);
    },
    "hoje-painel": (el) => {
      const p = el.dataset.painel;
      hojePainel = hojePainel === p ? null : p;
      render();
    },
    "toggle-mais-hoje": () => { showMaisHoje = !showMaisHoje; render(); },
    "casa-sub": (el) => { casaSub = el.dataset.sub || "despensa"; render(); window.scrollTo(0, 0); },
    "mais-sub": (el) => { maisSub = el.dataset.sub || "mes"; render(); window.scrollTo(0, 0); },
    "env-modo": (el) => { envModo = el.dataset.modo === "100" ? "100" : "500"; render(); window.scrollTo(0, 0); },
    "env500-toggle": (el) => {
      const i = Math.round(num(el.dataset.i));
      if (!(i >= 0 && i < VALORES_500.length)) return;
      if (!S.desafio500) S.desafio500 = { feitos: {} };
      if (!S.desafio500.feitos) S.desafio500.feitos = {};
      const key = String(i);
      const v = VALORES_500[i];
      if (S.desafio500.feitos[key]) {
        delete S.desafio500.feitos[key];
        touch("Desmarcou " + fmt(v));
      } else {
        S.desafio500.feitos[key] = { em: Date.now() };
        const st = env500Stats();
        touch(`✓ ${fmt(v)} · ${fmt(st.soma)}/${fmt(ENV500_TOTAL)}`);
      }
    },
    "env500-emergencia": () => {
      const st = env500Stats();
      if (!S.desafio500) S.desafio500 = { feitos: {} };
      const ja = Math.max(0, num(S.desafio500.enviadoEmerg));
      const delta = st.soma - ja;
      if (delta <= 0) {
        toast(st.soma <= 0 ? "Nada marcado ainda" : "Já somou o que está marcado");
        return;
      }
      if (!confirm(`Somar ${fmt(delta)} novo(s) da tabela na emergência?\n\n(Marcados: ${fmt(st.soma)} · já enviado antes: ${fmt(ja)})`)) return;
      const antes = emergenciaGuardado();
      registrarAporte(delta, "desafio500");
      S.desafio500.enviadoEmerg = st.soma;
      touch("✓ +" + fmt(delta) + " na emergência");
      setTimeout(() => genioCelebrarAporte(delta, antes), 280);
    },
    "env-filtro": (el) => { envFiltro = el.dataset.f || "todos"; render(); },
    "env-sortear": () => {
      const faltam = envFaltam();
      if (!faltam.length) { toast("Desafio completo!"); return; }
      envHint = faltam[Math.floor(Math.random() * faltam.length)];
      envFiltro = "faltam";
      maisSub = "100";
      render();
      toast("Sorteou #" + envHint + " · " + fmt(envHint));
    },
    "env-abrir": (el) => {
      const n = Math.round(num(el.dataset.n));
      if (!(n >= 1 && n <= 100)) return;
      const feitos = envFeitosMap();
      const key = String(n);
      if (feitos[key]) {
        if (!confirm(`Desfazer envelope #${n} (${fmt(n)})?\n\nNão tira valor da emergência automaticamente.`)) return;
        delete S.desafio100.feitos[key];
        if (envHint === n) envHint = null;
        touch("Envelope #" + n + " desfeito");
        return;
      }
      const ced = S.cedula ? num(S.cedula.valor) : 0;
      $("#modal").innerHTML = `
        <div class="t">Envelope #${n}</div>
        <div class="s" style="margin-top:0.35rem;">Guardar <b>${fmt(n)}</b> neste envelope.</div>
        <form data-form="env-guardar" data-n="${n}" class="mt">
          <label>Como anotar</label>
          <select name="fonte" required>
            <option value="emergencia">Somar na emergência</option>
            <option value="cedula">Saiu da cédula → emergência</option>
            <option value="marca">Só marcar (já guardei fora)</option>
          </select>
          <div class="dica">Cédula agora: ${fmt(ced)}. Emergência: ${fmt(emergenciaGuardado())}.</div>
          <button class="btn full" type="submit">Guardar ${fmt(n)}</button>
        </form>
        <button class="btn ghost full" data-action="modal-close">Cancelar</button>`;
      $("#modalbk").hidden = false;
    },
    "onboard-next": () => {
      const total = 3;
      if (onboardStep >= total - 1) {
        S.config.onboardDone = true;
        touch();
        return;
      }
      onboardStep += 1;
      maybeShowOnboard();
    },
    "onboard-skip": () => { S.config.onboardDone = true; touch(); },
    "modal-close": () => closeModal(),

    "renda-toggle": (el) => {
      const mk = mesKey();
      if (!S.recebidos[mk]) S.recebidos[mk] = {};
      if (S.recebidos[mk][el.dataset.id]) delete S.recebidos[mk][el.dataset.id];
      else {
        const r = S.config.rendas.find((x) => x.id === el.dataset.id);
        if (!r) return;
        S.recebidos[mk][r.id] = { valor: num(r.valor) * (num(r.pessoas) || 1), ts: Date.now() };
      }
      touch();
    },

    "checklist-salario": () => {
      const ck = checklistEstado();
      if (!ck || ck.caiu) return;
      if (ck.modo === "espera") {
        if (!confirm(`Hoje ainda não é dia ${ck.alvo.dia}. O salário já caiu no banco mesmo?`)) return;
      }
      if (!S.recebidos[ck.mk]) S.recebidos[ck.mk] = {};
      S.recebidos[ck.mk][ck.alvo.id] = { valor: ck.total, ts: Date.now() };
      touch();
    },
    "checklist-pagar-quinzena": () => {
      const ck = checklistEstado();
      if (!ck || !ck.faltam.length) return;
      if (!ck.caiu) { alert("Marca o salário como Caiu antes."); return; }
      if (!confirm(`Pagar ${ck.faltam.length} conta(s) da quinzena pelos valores previstos (${fmt(ck.totalContas)})? Energia/internet: ajuste depois em Contas se mudou.`)) return;
      if (!S.pagamentos[ck.mk]) S.pagamentos[ck.mk] = {};
      ck.faltam.forEach((ct) => {
        S.pagamentos[ck.mk][ct.id] = { valor: num(ct.valor), ts: Date.now() };
      });
      touch();
      setTimeout(() => genioStartCoachPosPagamento(), 350);
    },
    "checklist-fatura-guardar": () => {
      const mk = mesKey();
      if (!S.checklist) S.checklist = {};
      if (!S.checklist[mk]) S.checklist[mk] = {};
      S.checklist[mk].faturaGuardada = true;
      touch();
    },

    "gasto-del": (el) => {
      const g = S.gastos.find((x) => x.id === el.dataset.id);
      if (g && g.fonte === "cedula") {
        if (!S.cedula) S.cedula = { valor: 0 };
        S.cedula.valor = Math.round((num(S.cedula.valor) + num(g.valor)) * 100) / 100;
      }

      const g = S.gatos.find((x) => x.id === f.dataset.id);
      if (!g) return;
      if (!g.vacinas) g.vacinas = [];
      g.vacinas.push({ id: uid(), nome: f.nome.value.trim(), data: f.data.value || "", proxima: f.proxima.value || "" });
      touch();
      $("#modal").innerHTML = modalGato(g);
    },
    "renda-upd": (f) => {
      const r = S.config.rendas.find((x) => x.id === f.dataset.id);
      if (!r) return;
      r.nome = f.nome.value.trim() || r.nome;
      r.dia = Math.min(31, Math.max(1, parseInt(f.dia.value) || r.dia));
      r.valor = num(f.valor.value);
      touch();
    },
    "renda-add": (f) => {
      S.config.rendas.push({ id: uid(), nome: f.nome.value.trim(), dia: Math.min(31, Math.max(1, parseInt(f.dia.value) || 7)), valor: num(f.valor.value), pessoas: 2 });
      touch();
    },
    "cfg-fatura-est": (f) => {
      S.config.faturaEstimada = Math.max(0, num(f.faturaEst.value));
      touch("✓ Estimativa fatura " + fmt(S.config.faturaEstimada));
    },
    "cfg-cartao": (f) => {
      S.config.limiteCartao = num(f.limite.value);
      S.config.reservaCartao = 0;
      S.config.diaVencFatura = Math.min(31, Math.max(1, parseInt(f.diaFatura.value, 10) || 19));
      S.config.faturaEstimada = num(f.faturaEst.value);
      S.config.lazerMes = num(f.lazer.value);
      const rawMeta = String(f.meta.value || "").trim();
      const metaInput = rawMeta === "" ? 0 : num(rawMeta);
      const sug = metaSugerida();
      S.config.metaGuardar = metaInput > 0 && Math.round(metaInput) !== Math.round(sug) ? metaInput : 0;
      if (f.emergencia) S.config.emergenciaMeta = Math.max(0, num(f.emergencia.value));
      touch();
    },
    "cfg-casa": async (f) => {
      S.config.quemEu = f.quemEu.value.trim() || "Luiz";
      S.config.quemEla = f.quemEla.value.trim() || "Esposa";
      S.config.aiOn = !!(f.aiOn && f.aiOn.checked);
      S.config.aiProvider = f.aiProvider.value || "groq";
      const novaKey = f.aiKey.value.trim();
      if (novaKey) setAiKey(novaKey);
      const querLembrete = !!(f.lembretes && f.lembretes.checked);
      if (querLembrete) {
        if (!("Notification" in window)) {
          alert("Este celular/navegador não tem notificação.");
          S.config.lembretesOn = false;
        } else {
          const p = await Notification.requestPermission();
          S.config.lembretesOn = p === "granted";
          if (!S.config.lembretesOn) alert("Permissão de notificação negada.");
        }
      } else {
        S.config.lembretesOn = false;
      }
      touch();
      checarLembretes(true);
    },
    "perfil": async (f) => {
      const msg = $("#perfil-msg");
      try {
        const r = await NCCloud.atualizarPerfil({ nome: f.nome.value.trim(), senhaAtual: f.atual.value || null, senhaNova: f.nova.value || null });
        if (r && r.ok) {
          if (r.nome) $("#h-nome").textContent = r.nome;
          if (msg) { msg.hidden = false; msg.textContent = "Perfil salvo."; }
          f.atual.value = ""; f.nova.value = "";
        } else if (msg) {
          msg.hidden = false;
          msg.textContent = (r && r.erro) || "Não deu pra salvar.";
        }
      } catch (e2) {
        if (msg) { msg.hidden = false; msg.textContent = "Sem nuvem agora — tente de novo."; }
      }
    },
  };

  document.addEventListener("submit", (e) => {
    const f = e.target.closest("form[data-form]");
    if (!f) return;
    e.preventDefault();
    const fn = F[f.dataset.form];
    if (fn) Promise.resolve(fn(f, e.submitter)).catch((err) => console.error(err));
  });

  function checarLembretes(force) {
    if (!S.config.lembretesOn || !("Notification" in window) || Notification.permission !== "granted") return;
    const diaKey = new Date().toISOString().slice(0, 10);
    try {
      if (!force && localStorage.getItem("nc-lembrete-dia") === diaKey) return;
      localStorage.setItem("nc-lembrete-dia", diaKey);
    } catch (_) {}
    const hoje = new Date().getDate();
    const vf = diaFatura();
    S.config.rendas.forEach((r) => {
      if (r.dia === hoje + 1) {
        try { new Notification("Nossa Casa", { body: `Amanhã cai ${r.nome}. Marca no app quando entrar.` }); } catch (_) {}
      }
      if (r.dia === hoje) {
        try { new Notification("Nossa Casa", { body: `Hoje é dia de ${r.nome}. Caiu? Marca no Hoje.` }); } catch (_) {}
      }
    });
    if (vf === hoje + 1) {
      try { new Notification("Nossa Casa", { body: "Amanhã vence a fatura — separa o dinheiro." }); } catch (_) {}
    }
    if (vf === hoje) {
      try { new Notification("Nossa Casa", { body: "Hoje é dia da fatura. Olha o Cartão no app." }); } catch (_) {}
    }
    S.gatos.forEach((g) => (g.vacinas || []).forEach((va) => {
      const d = diasPara(va.proxima);
      if (d === 0 || d === 1 || d === 7) {
        try { new Notification("Nossa Casa", { body: `Vacina ${va.nome} do ${g.nome}: ${d === 0 ? "hoje" : "em " + d + "d"}.` }); } catch (_) {}
      }
    }));
  }

  /* ═══════════════════════ BOOT ═══════════════════════ */
  $("#form-login").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector("button");
    const erro = $("#l-erro");
    btn.disabled = true;
    erro.hidden = true;
    try {
      const r = await NCCloud.login($("#l-usuario").value, $("#l-senha").value, $("#l-permanente").checked);
      if (!r.ok) {
        erro.textContent = r.erro || "Login inválido";
        erro.hidden = false;
        return;
      }
      entrar();
    } catch (e2) {
      erro.textContent = "Sem conexão com a nuvem. Confere a internet.";
      erro.hidden = false;
    } finally {
      btn.disabled = false;
    }
  });

  async function entrar() {
    logado = true;
    $("#gate").hidden = true;
    $("#app").hidden = false;
    const meta = NCCloud.getMeta();
    if (meta.nome) $("#h-nome").textContent = meta.nome;
    render();
    await cloudLoad();
    checarLembretes(false);
  }

  (async function boot() {
    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      navigator.serviceWorker.register("./sw.js").catch(() => {});
    }
    if (NCCloud.configured() && NCCloud.getToken()) {
      $("#gate").hidden = true;
      $("#app").hidden = false;
      logado = true;
      const meta = NCCloud.getMeta();
      if (meta.nome) $("#h-nome").textContent = meta.nome;
      render();
      cloudLoad().then(() => checarLembretes(false));
    } else if (!NCCloud.configured()) {
      // Sem nuvem: modo local, sem login
      logado = true;
      $("#gate").hidden = true;
      $("#app").hidden = false;
      setSync("");
      render();
      checarLembretes(false);
    } else {
      $("#gate").hidden = false;
    }
  })();
  </script>
</body>
</html>
