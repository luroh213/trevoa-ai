# Publica a pasta nossacasa/ no GitHub Pages a cada push em main.
name: Deploy Nossa Casa

on:
  push:
    branches: [main]
    paths:
      - "nossacasa/**"
      - ".github/workflows/deploy-nossacasa.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-nossacasa
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: nossacasa
      - id: deployment
        uses: actions/deploy-pages@v4
