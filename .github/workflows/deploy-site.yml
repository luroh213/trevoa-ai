# Publica o site multi-app no GitHub Pages (Trevo na raiz + pastas fiado, nossacasa, etc.).
# NÃO sobe só uma pasta na raiz — senão some os outros projetos do site ao vivo.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-site
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Montar pasta pública
        run: |
          mkdir -p _site
          cp index.html _site/
          for d in fiado nossacasa balanco caixa coletagem corpoearoma; do
            if [ -d "$d" ]; then cp -r "$d" _site/; fi
          done
          # evita publicar lixo de agent/skills se existir
          rm -rf _site/.agents _site/.github || true

      - name: Injetar chave Groq no Nossa Casa
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "Sem GROQ_API_KEY no repo — IA só liga se colar em Ajustes no aparelho."
            exit 0
          fi
          python3 - <<'PY'
          import os, json
          k = os.environ["GROQ_API_KEY"]
          path = "_site/nossacasa/config.secrets.js"
          body = "window.NC_AI = {\n  enabled: true,\n  provider: \"groq\",\n  apiKey: %s,\n};\n" % json.dumps(k)
          open(path, "w", encoding="utf-8").write(body)
          print("config.secrets.js escrito (chave nao aparece no log).")
          PY

      - uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
